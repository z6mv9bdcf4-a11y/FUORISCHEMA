<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FSocial — FUORISCHEMA</title>

<style>

/* =========================================================
   FUORISCHEMA — FSOCIAL
   SOCIAL UI
========================================================= */

:root {
    --bg: #050505;
    --surface: #0b0b0b;
    --surface-2: #101010;
    --surface-3: #151515;
    --border: rgba(255,255,255,.09);
    --border-light: rgba(255,255,255,.14);
    --text: #f5f5f5;
    --muted: #858585;
    --muted-2: #5d5d5d;
    --orange: #ff4d00;
    --orange-light: #ff641f;
    --danger: #ff3b30;
    --radius: 18px;
    --max: 1050px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(255,77,0,.09),
            transparent 35%
        ),
        var(--bg);
    color: var(--text);
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

button,
input,
textarea {
    font-family: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

a {
    color: inherit;
}


/* =========================================================
   HEADER
========================================================= */

.topbar {
    height: 72px;

    position: sticky;
    top: 0;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    background: rgba(5,5,5,.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-bottom: 1px solid var(--border);
}

.brand {
    text-decoration: none;

    font-size: 21px;
    font-weight: 1000;
    letter-spacing: -1.5px;
}

.brand-white {
    color: white;
}

.brand-orange {
    color: var(--orange);
}

.topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.top-btn {
    height: 38px;

    padding: 0 16px;

    border: 1px solid var(--border-light);
    border-radius: 10px;

    background: transparent;
    color: white;

    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.5px;

    text-decoration: none;
    text-transform: uppercase;

    cursor: pointer;

    transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease,
        transform .2s ease;
}

.top-btn:hover {
    border-color: var(--orange);
    color: var(--orange);
}

.top-btn.primary {
    background: white;
    color: #050505;
    border-color: white;
}

.top-btn.primary:hover {
    background: var(--orange);
    border-color: var(--orange);
}


/* =========================================================
   MAIN
========================================================= */

.app {
    width: 100%;
}

.social-container {
    width: 100%;
    max-width: var(--max);

    margin: 0 auto;

    padding: 34px 20px 100px;
}


/* =========================================================
   SOCIAL HEADER
========================================================= */

.social-heading {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;

    margin-bottom: 26px;
}

.social-title {
    font-size: clamp(36px, 7vw, 64px);
    line-height: .9;

    font-weight: 1000;
    letter-spacing: -4px;
}

.social-title span {
    color: var(--orange);
}

.social-subtitle {
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;

    padding-bottom: 6px;
}


/* =========================================================
   STORIES
========================================================= */

.stories {
    display: flex;
    gap: 14px;

    overflow-x: auto;

    padding: 3px 2px 18px;

    scrollbar-width: none;
}

.stories::-webkit-scrollbar {
    display: none;
}

.story {
    flex: 0 0 auto;

    width: 72px;

    text-align: center;

    cursor: pointer;
}

.story-avatar {
    width: 68px;
    height: 68px;

    margin: 0 auto 7px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #ff6a21,
            #ff4d00 50%,
            #ff2500
        );

    border: 3px solid var(--bg);

    box-shadow:
        0 0 0 1px rgba(255,77,0,.6),
        0 8px 25px rgba(255,77,0,.12);

    color: #050505;

    font-size: 21px;
    font-weight: 1000;
}

.story-name {
    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    color: #aaa;

    font-size: 9px;
    font-weight: 800;
}


/* =========================================================
   CREATE POST
========================================================= */

.create-card {
    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );

    border: 1px solid var(--border);

    border-radius: var(--radius);

    padding: 20px;

    margin-bottom: 28px;

    overflow: hidden;
}

.create-card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--orange),
            transparent
        );
}

.create-top {
    display: flex;
    align-items: center;
    gap: 12px;

    margin-bottom: 18px;
}

.avatar {
    width: 44px;
    height: 44px;

    flex: 0 0 44px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--orange);
    color: #050505;

    font-size: 16px;
    font-weight: 1000;

    overflow: hidden;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.user-info {
    min-width: 0;
}

.user-name {
    font-size: 13px;
    font-weight: 900;
}

.user-handle {
    color: var(--muted);
    font-size: 10px;
    margin-top: 3px;
}

#postContent {
    width: 100%;
    min-height: 92px;

    resize: vertical;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    font-size: 17px;
    line-height: 1.55;

    padding: 4px 0;

    caret-color: var(--orange);
}

#postContent::placeholder {
    color: #555;
}

.create-image {
    display: none;

    position: relative;

    margin-top: 15px;

    border-radius: 14px;
    overflow: hidden;

    background: #080808;
}

.create-image.active {
    display: block;
}

.create-image img {
    width: 100%;
    max-height: 430px;

    display: block;

    object-fit: cover;
}

.remove-image {
    position: absolute;

    top: 12px;
    right: 12px;

    width: 34px;
    height: 34px;

    border: 1px solid rgba(255,255,255,.2);
    border-radius: 50%;

    background: rgba(0,0,0,.7);
    color: white;

    cursor: pointer;
}

.create-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-top: 15px;

    padding-top: 15px;

    border-top: 1px solid var(--border);
}

.create-tools {
    display: flex;
    align-items: center;
    gap: 8px;
}

.photo-label {
    display: flex;
    align-items: center;
    gap: 7px;

    padding: 9px 12px;

    border-radius: 9px;

    background: var(--surface-3);

    color: #bbb;

    font-size: 10px;
    font-weight: 900;
    letter-spacing: .7px;

    cursor: pointer;

    transition: .2s ease;
}

.photo-label:hover {
    color: white;
    background: #1b1b1b;
}

#postImageInput {
    display: none;
}

#postStatus {
    color: var(--muted);

    font-size: 10px;
    font-weight: 700;
}

.publish-button {
    min-width: 105px;

    border: none;
    border-radius: 10px;

    background: var(--orange);
    color: #050505;

    padding: 12px 18px;

    font-size: 10px;
    font-weight: 1000;
    letter-spacing: 1px;

    cursor: pointer;

    transition:
        transform .2s ease,
        background .2s ease;
}

.publish-button:hover {
    background: white;
    transform: translateY(-1px);
}

.publish-button:disabled {
    opacity: .5;
    cursor: wait;
    transform: none;
}


/* =========================================================
   FEED
========================================================= */

.feed {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.feed-label {
    display: flex;
    align-items: center;
    gap: 12px;

    margin: 12px 4px 2px;
}

.feed-label span:first-child {
    font-size: 10px;
    font-weight: 1000;
    letter-spacing: 2px;
    color: white;
}

.feed-label span:last-child {
    flex: 1;
    height: 1px;
    background: var(--border);
}


/* =========================================================
   POST CARD
========================================================= */

.post-card {
    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    overflow: hidden;

    transition:
        border-color .25s ease,
        transform .25s ease;
}

.post-card:hover {
    border-color: var(--border-light);
}


/* POST HEADER */

.post-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 16px 17px 13px;
}

.post-author {
    display: flex;
    align-items: center;
    gap: 11px;

    min-width: 0;

    cursor: pointer;
}

.post-author:hover .post-author-name {
    color: var(--orange);
}

.post-avatar {
    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--orange);
    color: #050505;

    font-size: 15px;
    font-weight: 1000;

    overflow: hidden;
}

.post-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.post-author-info {
    min-width: 0;
}

.post-author-name {
    font-size: 13px;
    font-weight: 900;

    transition: color .2s ease;
}

.post-author-handle {
    color: var(--muted);

    font-size: 10px;

    margin-top: 3px;
}

.post-date {
    color: var(--muted-2);

    font-size: 9px;
    font-weight: 700;

    white-space: nowrap;
}

.post-menu {
    width: 32px;
    height: 32px;

    border: none;
    border-radius: 50%;

    background: transparent;

    color: #777;

    font-size: 17px;

    cursor: pointer;
}

.post-menu:hover {
    background: #171717;
    color: white;
}


/* POST IMAGE */

.post-image {
    width: 100%;

    background: #080808;
}

.post-image img {
    width: 100%;

    max-height: 650px;

    display: block;

    object-fit: cover;
}


/* POST CONTENT */

.post-body {
    padding: 16px 17px 6px;
}

.post-text {
    color: #e7e7e7;

    font-size: 14px;
    line-height: 1.6;

    white-space: pre-wrap;

    word-break: break-word;
}


/* ACTIONS */

.post-actions {
    display: flex;
    align-items: center;

    gap: 5px;

    padding: 10px 13px 3px;
}

.action-button {
    display: flex;
    align-items: center;
    gap: 6px;

    border: none;
    border-radius: 9px;

    background: transparent;

    color: #888;

    padding: 8px 9px;

    font-size: 11px;
    font-weight: 900;

    cursor: pointer;

    transition:
        background .2s ease,
        color .2s ease,
        transform .15s ease;
}

.action-button:hover {
    background: #151515;
    color: white;
}

.action-button:active {
    transform: scale(.94);
}

.action-button.like-button.liked {
    color: var(--orange);
}

.action-icon {
    font-size: 19px;
    line-height: 1;
}

.like-count,
.comment-count {
    font-size: 10px;
    font-weight: 900;
}


/* POST META */

.post-meta {
    padding: 4px 17px 16px;

    color: #777;

    font-size: 10px;
}

.post-meta strong {
    color: white;
}


/* =========================================================
   COMMENTS
========================================================= */

.comments {
    display: none;

    margin: 0 17px 16px;

    padding-top: 13px;

    border-top: 1px solid var(--border);
}

.comments.active {
    display: block;
}

.comments-list {
    display: flex;
    flex-direction: column;
    gap: 12px;

    margin-bottom: 14px;
}

.comment {
    display: flex;
    gap: 9px;
}

.comment-avatar {
    width: 28px;
    height: 28px;

    flex: 0 0 28px;

    border-radius: 50%;

    background: var(--orange);

    display: flex;
    align-items: center;
    justify-content: center;

    color: #050505;

    font-size: 9px;
    font-weight: 1000;
}

.comment-content {
    flex: 1;

    background: #111;

    border-radius: 10px;

    padding: 8px 10px;
}

.comment-user {
    font-size: 10px;
    font-weight: 900;

    color: white;
}

.comment-text {
    margin-top: 3px;

    color: #aaa;

    font-size: 12px;
    line-height: 1.4;
}

.comment-box {
    display: flex;
    gap: 8px;
}

.comment-input {
    flex: 1;

    min-width: 0;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: #0b0b0b;
    color: white;

    padding: 10px 12px;

    outline: none;

    font-size: 12px;
}

.comment-input:focus {
    border-color: rgba(255,77,0,.5);
}

.comment-button {
    width: 42px;

    border: none;
    border-radius: 10px;

    background: var(--orange);
    color: #050505;

    font-weight: 1000;

    cursor: pointer;
}


/* =========================================================
   EMPTY
========================================================= */

.empty {
    text-align: center;

    padding: 70px 25px;

    border: 1px dashed var(--border-light);
    border-radius: var(--radius);

    background: rgba(255,255,255,.015);
}

.empty-icon {
    font-size: 34px;
    margin-bottom: 15px;
}

.empty strong {
    display: block;

    font-size: 17px;
    font-weight: 1000;

    margin-bottom: 7px;
}

.empty span {
    color: var(--muted);

    font-size: 11px;
}


/* =========================================================
   PROFILE MODAL
========================================================= */

.profile-overlay {
    position: fixed;

    inset: 0;

    z-index: 300;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.78);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.profile-overlay.active {
    display: flex;
}

.profile-modal {
    width: 100%;
    max-width: 440px;

    position: relative;

    background:
        linear-gradient(
            145deg,
            #111,
            #080808
        );

    border: 1px solid var(--border-light);

    border-radius: 24px;

    padding: 28px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.7);
}

.profile-close {
    position: absolute;

    top: 15px;
    right: 15px;

    width: 34px;
    height: 34px;

    border: 1px solid var(--border);
    border-radius: 50%;

    background: #111;

    color: #aaa;

    cursor: pointer;

    font-size: 16px;
}

.profile-close:hover {
    color: white;
    border-color: var(--orange);
}

.profile-modal-top {
    text-align: center;
}

.profile-modal-avatar {
    width: 90px;
    height: 90px;

    margin: 5px auto 15px;

    border-radius: 50%;

    background: var(--orange);

    display: flex;
    align-items: center;
    justify-content: center;

    color: #050505;

    font-size: 30px;
    font-weight: 1000;

    overflow: hidden;

    box-shadow:
        0 0 0 5px rgba(255,77,0,.1),
        0 0 35px rgba(255,77,0,.12);
}

.profile-modal-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-modal-name {
    font-size: 25px;
    font-weight: 1000;

    letter-spacing: -1px;
}

.profile-modal-handle {
    color: var(--muted);

    margin-top: 5px;

    font-size: 12px;
}

.profile-modal-bio {
    margin-top: 20px;

    color: #aaa;

    font-size: 13px;
    line-height: 1.6;
}

.profile-social {
    display: flex;
    gap: 8px;

    margin-top: 23px;
}

.profile-social a,
.profile-social button {
    flex: 1;

    min-height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid var(--border-light);
    border-radius: 10px;

    background: #111;

    color: white;

    text-decoration: none;

    font-size: 10px;
    font-weight: 900;
    letter-spacing: .8px;

    cursor: pointer;
}

.profile-social a:hover {
    border-color: var(--orange);
    color: var(--orange);
}

.profile-social .instagram {
    background: var(--orange);
    border-color: var(--orange);
    color: #050505;
}

.profile-social .instagram:hover {
    background: white;
    border-color: white;
}


/* =========================================================
   DELETE MENU
========================================================= */

.delete-button {
    color: #777;
}

.delete-button:hover {
    color: var(--danger);
    background: rgba(255,59,48,.07);
}


/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    z-index: 500;

    transform:
        translate(-50%, 20px);

    opacity: 0;
    pointer-events: none;

    padding: 12px 18px;

    border: 1px solid var(--border-light);
    border-radius: 12px;

    background: #111;

    color: white;

    font-size: 11px;
    font-weight: 800;

    transition: .25s ease;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =========================================================
   FOOTER
========================================================= */

.social-footer {
    margin-top: 45px;

    padding-top: 25px;

    border-top: 1px solid var(--border);

    display: flex;
    justify-content: space-between;

    color: #444;

    font-size: 9px;
    font-weight: 800;
    letter-spacing: 2px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .topbar {
        height: 62px;
        padding: 0 15px;
    }

    .brand {
        font-size: 18px;
    }

    .top-btn {
        height: 34px;
        padding: 0 11px;
        font-size: 8px;
    }

    .social-container {
        padding: 25px 10px 80px;
    }

    .social-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 9px;
    }

    .social-title {
        font-size: 45px;
        letter-spacing: -3px;
    }

    .social-subtitle {
        padding: 0;
    }

    .stories {
        margin-right: -10px;
        margin-left: -10px;

        padding-left: 10px;
        padding-right: 10px;
    }

    .create-card,
    .post-card {
        border-radius: 15px;
    }

    .create-card {
        padding: 16px;
    }

    #postContent {
        min-height: 75px;
        font-size: 15px;
    }

    .post-header {
        padding: 14px 13px 11px;
    }

    .post-body {
        padding: 14px 13px 5px;
    }

    .post-actions {
        padding-left: 9px;
        padding-right: 9px;
    }

    .post-meta {
        padding-left: 13px;
        padding-right: 13px;
    }

    .comments {
        margin-left: 13px;
        margin-right: 13px;
    }

    .post-image img {
        max-height: 500px;
    }

    .profile-modal {
        padding: 25px 20px;
        border-radius: 20px;
    }

    .social-footer {
        flex-direction: column;
        gap: 8px;
    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width: 390px) {

    .topbar-actions {
        gap: 4px;
    }

    .top-btn {
        padding: 0 8px;
    }

    .social-title {
        font-size: 40px;
    }

    .create-footer {
        align-items: flex-end;
    }

    .create-tools {
        flex-direction: column;
        align-items: flex-start;
    }

}

</style>

</head>


<body>

     HEADER

            href="area-personale.html"

            id="logoutButton"

    </div>

        </div>

        <div class="social-subtitle">

        </div>

    </div>



    <!-- ==================================================

    <div

    >

       <div class="story" id="myStory">

    </div>

</div>

>

    </div>



    <!-- ==================================================

    <section class="create-card">

            </div>

            <div class="user-info">

                <div
                    id="createUserName"

                >

                </div>

                <div

/* ========================================================

function escapeHtml(text) {

        document.createElement("div");

}



/* ========================================================
   INITIALS
======================================================== */

function getInitials(name) {

    if (!name) return "F";

    const parts =
        String(name)
            .trim()
            .split(/\s+/);

    if (parts.length === 1) {

        return parts[0]
            .slice(0, 2)
            .toUpperCase();

    }

    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();

}

function getUserName(user) {

/* ========================================================

function getUsername(user) {

}

/* ========================================================

}



/* ========================================================
   FORMAT DATE
======================================================== */

function formatDate(date) {

    const d =
        new Date(date);

    return d.toLocaleDateString(
        "it-IT",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}



/* ========================================================
   TIME AGO
======================================================== */

function timeAgo(date) {

    const now =
        new Date();

    const then =
        new Date(date);

    const diff =
        Math.floor(
            (now - then) / 1000
        );

    if (diff < 60) {
        return "ora";
    }

    if (diff < 3600) {

        return (
            Math.floor(diff / 60) +
            " min"
        );

    }

    if (diff < 86400) {

        return (
            Math.floor(diff / 3600) +
            " h"
        );

    }

    if (diff < 604800) {

        return (
            Math.floor(diff / 86400) +
            " g"
        );

    }

    return formatDate(date);

}

/* ========================================================
   UPLOAD IMAGE
======================================================== */

async function uploadPostImage(file) {

    if (!file) return null;

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();

    const fileName =
        `${currentUser.id}/${Date.now()}-${crypto.randomUUID()}.${extension}`;


    const {
        error
    } =
        await supabase.storage
            .from("post-images")
            .upload(
                fileName,
                file,
                {
                    cacheControl: "3600",
                    upsert: false
                }
            );


    if (error) {

        console.error(
            "Errore upload:",
            error
        );

        throw new Error(
            "Non riesco a caricare la foto. Controlla il bucket post-images su Supabase."
        );

    }


    const {
        data
    } =
        supabase.storage
            .from("post-images")
            .getPublicUrl(
                fileName
            );


    return data?.publicUrl || null;

}

                .select(

}

/* ========================================================

async function renderPost(post) {

    const author =
        await resolveAuthor(
            post.user_id
        );


    const article =
        document.createElement(
            "article"
        );

    article.className =
        "post-card";


    const initials =
        getInitials(
            author.name
        );


    const avatarHtml =
        author.avatar

            ? `
                <img
                    src="${escapeHtml(author.avatar)}"
                    alt=""
                >
            `

            : initials;


    let imageHtml =
        "";


    /*
     * Supportiamo image_url se presente.
     * Se il tuo database ha già questo campo,
     * la foto apparirà automaticamente.
     */

    if (post.image_url) {

        imageHtml = `
            <div class="post-image">

                    src="${escapeHtml(post.image_url)}"
                    alt="Post FUORISCHEMA"
                    loading="lazy"

    }


    article.innerHTML = `

        <div class="post-header">

            <div
                class="post-author author-profile-trigger"
                data-user-id="${escapeHtml(post.user_id)}"
            >

                <div class="post-avatar">
                    ${avatarHtml}

                <div class="post-author-info">

                    <div class="post-author-name">
                        ${escapeHtml(author.name)}
                    </div>

                    <div class="post-author-handle">

                        ${
                            author.username
                                ? "@" + escapeHtml(author.username)
                                : "Membro FUORISCHEMA"
                        }

                    </div>

                </div>

            </div>


            <div
                class="post-date"
                title="${escapeHtml(formatDate(post.created_at))}"
            >
                ${escapeHtml(timeAgo(post.created_at))}
            </div>

        </div>


        ${imageHtml}


        <div class="post-body">

            ${
                post.content
                    ? `
                    <div class="post-text">
                        ${escapeHtml(post.content)}
                    </div>
                    `
                    : ""
            }

        </div>


        <div class="post-actions">

            <button
                class="action-button like-button"
                data-id="${escapeHtml(post.id)}"
                type="button"
            >

                <span class="action-icon">
                    ♡
                </span>

                <span class="like-count">
                    0
                </span>

            </button>


            <button
                class="action-button comment-toggle"
                data-id="${escapeHtml(post.id)}"
                type="button"
            >

                <span class="action-icon">
                    ○
                </span>

                <span class="comment-count">
                    0
                </span>

            </button>


            ${
                post.user_id === currentUser.id

                    ? `
                        <button
                            class="action-button delete-button"
                            data-id="${escapeHtml(post.id)}"
                            type="button"
                        >
                            ELIMINA
                        </button>
                    `

                    : ""
            }

        </div>


        <div class="post-meta">

            <strong>
                ${escapeHtml(author.name)}
            </strong>

            ${
                author.username
                    ? ` · @${escapeHtml(author.username)}`
                    : ""
            }

        </div>


        <div
            class="comments"
            id="comments-${escapeHtml(post.id)}"
        >

            <div class="comments-list"></div>

            <div class="comment-box">

                <input
                    class="comment-input"
                    type="text"
                    placeholder="Aggiungi un commento..."
                >

                <button
                    class="comment-button"
                    data-id="${escapeHtml(post.id)}"
                    type="button"
                >
                    →
                </button>

            </div>

        </div>

    `;


    feed.appendChild(article);


    /* LIKE */

    const likeButton =
        article.querySelector(
            ".like-button"
        );


    likeButton.addEventListener(
        "click",
        () =>
            toggleLike(
                post.id,
                likeButton
            )
    );


    await updateLikeState(
        post.id,
        likeButton
    );


    /* COMMENTS */

    const commentButton =
        article.querySelector(
            ".comment-toggle"
        );


    commentButton.addEventListener(
        "click",
        () =>
            toggleComments(
                post.id,
                article
            )
    );


    await updateCommentCount(
        post.id,
        commentButton
    );


    /* PROFILE */

    const authorTrigger =
        article.querySelector(
            ".author-profile-trigger"
        );


    authorTrigger.addEventListener(
        "click",
        () =>
            openProfile(
                author
            )
    );


    /* DELETE */

    const deleteButton =
        article.querySelector(
            ".delete-button"
        );


    if (deleteButton) {

        deleteButton.addEventListener(
            "click",
            () =>
                deletePost(
                    post.id
                )
        );

    }


    /* ADD COMMENT */

    const addCommentButton =
        article.querySelector(
            ".comment-button"
        );


    addCommentButton.addEventListener(
        "click",
        () =>
            addComment(
                post.id,
                article
            )
    );


    const input =
        article.querySelector(
            ".comment-input"
        );


    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                addComment(
                    post.id,
                    article
                );

            }

        }
    );

}

                    "id",
                    {
                        count: "exact",
                        head: true
                    }
                )
                .eq(
                    "post_id",
                    postId
                );


        button.querySelector(
            ".like-count"
        ).textContent =
            count || 0;


        if (!currentUser) return;


        const {
            data: existing
        } =
            await supabase
                .from("post_likes")
                .select("id")
                .eq(
                    "post_id",
                    postId
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .maybeSingle();


        if (existing) {

            button.classList.add(
                "liked"
            );

            button.querySelector(
                ".action-icon"
            ).textContent =
                "♥";

        }

    }
    catch (error) {

        console.error(
            "Errore stato like:",
            error
        );

    }

}



/* ========================================================
   TOGGLE LIKE
======================================================== */

async function toggleLike(
    postId,
    button
) {

    if (!currentUser) {

        showToast(
            "Devi essere loggato."
        );

        return;

    }


    if (button.disabled) return;


    button.disabled =
        true;


    try {

        const {
            data: existing,
            error: checkError
        } =
            await supabase
                .from("post_likes")
                .select("id")
                .eq(
                    "post_id",
                    postId
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .maybeSingle();


        if (checkError) {

            throw checkError;

        }


        if (existing) {

            const {
                error
            } =
                await supabase
                    .from("post_likes")
                    .delete()
                    .eq(
                        "id",
                        existing.id
                    );


            if (error) {

                throw error;

            }


            button.classList.remove(
                "liked"
            );

            button.querySelector(
                ".action-icon"
            ).textContent =
                "♡";

        }
        else {

            const {
                error
            } =
                await supabase
                    .from("post_likes")
                    .insert({

                        post_id:
                            postId,

                        user_id:
                            currentUser.id

                    });


            if (error) {

                throw error;

            }


            button.classList.add(
                "liked"
            );

            button.querySelector(
                ".action-icon"
            ).textContent =
                "♥";

        }


        const {
            count
        } =
            await supabase
                .from("post_likes")
                .select(
                    "id",
                    {
                        count: "exact",
                        head: true
                    }
                )
                .eq(
                    "post_id",
                    postId
                );


        button.querySelector(
            ".like-count"
        ).textContent =
            count || 0;

    }
    catch (error) {

        console.error(
            "Errore LIKE:",
            error
        );

        showToast(
            "Errore nel like: " +
            error.message
        );

    }
    finally {

        button.disabled =
            false;

    }

}

/* ========================================================
   TOGGLE COMMENTS
======================================================== */

async function toggleComments(
    postId,
    article
) {

    const box =
        document.getElementById(
            `comments-${postId}`
        );


    if (!box) return;


    box.classList.toggle(

/* ========================================================
   LOAD COMMENTS
======================================================== */

async function loadComments(
    postId,
    box
) {

    const list =
        box.querySelector(
            ".comments-list"
        );


    const {
        data,
        error
    } =
        await supabase
            .from("post_comments")
            .select("*")
            .eq(
                "post_id",
                postId
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        list.innerHTML = `
            <div class="comment-text">
                ${escapeHtml(error.message)}
            </div>
        `;

        return;

    }


    list.innerHTML =
        "";


    if (!data || data.length === 0) {

        list.innerHTML = `
            <div class="comment-text">
                Nessun commento. Sii il primo.
            </div>
        `;

        return;

    }


    for (const comment of data) {

        const author =
            await resolveAuthor(
                comment.user_id
            );


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "comment";


        const initials =
            getInitials(
                author.name
            );


        const avatar =
            author.avatar

                ? `
                    <img
                        src="${escapeHtml(author.avatar)}"
                        alt=""
                        style="width:100%;height:100%;object-fit:cover;"
                    >
                `

                : initials;


        div.innerHTML = `

            <div class="comment-avatar">
                ${avatar}
            </div>

            <div class="comment-content">

                <div class="comment-user">
                    ${escapeHtml(author.name)}
                </div>

                <div class="comment-text">
                    ${escapeHtml(comment.content)}
                </div>

            </div>

        `;


        list.appendChild(
            div
        );

    }

}



/* ========================================================
   ADD COMMENT
======================================================== */

async function addComment(
    postId,
    article
) {

    if (!currentUser) {

        showToast(
            "Devi essere loggato."
        );

        return;

    }


    const input =
        article.querySelector(
            ".comment-input"
        );


    const content =
        input.value.trim();


    if (!content) return;


    const button =
        article.querySelector(
            ".comment-button"
        );


    button.disabled =
        true;


    try {

        const {
            error
        } =
            await supabase
                .from("post_comments")
                .insert({

                    post_id:
                        postId,

                    user_id:
                        currentUser.id,

                    content:
                        content

                });


        if (error) {

            throw error;

        }


        input.value =
            "";


        const box =
            document.getElementById(
                `comments-${postId}`
            );


        box.classList.add(
            "active"
        );


        await loadComments(
            postId,
            box
        );


        await updateCommentCount(
            postId,
            article.querySelector(
                ".comment-toggle"
            )
        );


        showToast(
            "Commento pubblicato."
        );

    }
    catch (error) {

        console.error(error);

        showToast(
            "Errore: " +
            error.message
        );

    }
    finally {

        button.disabled =
            false;

    }

}

async function deletePost(

) {

    const confirmed =
        confirm(
            "Vuoi davvero eliminare questo post?"

    const {
        error
    } =
        await supabase
            .from("posts")
            .delete()
            .eq(

                postId
            );


    if (error) {

        );

    await loadFeed();

/* ========================================================
   OPEN PROFILE
======================================================== */

function openProfile(
    author
) {

    const initials =
        getInitials(
            author.name
        );


    if (author.avatar) {

        modalAvatar.innerHTML = `
            <img
                src="${escapeHtml(author.avatar)}"
                alt=""
            >
        `;

    }
    else {

        modalAvatar.textContent =
            initials;

    }


    modalName.textContent =
        author.name;


    modalHandle.textContent =
        author.username
            ? "@" + author.username
            : "Membro FUORISCHEMA";


    modalBio.textContent =
        author.bio ||
        "Membro FUORISCHEMA.";


    if (author.instagram) {

        let username =
            author.instagram
                .replace(/^@/, "")
                .trim();


        instagramLink.href =
            `https://instagram.com/${encodeURIComponent(username)}`;

        instagramLink.style.display =
            "flex";

    }
    else {

        instagramLink.href =
            "#";

        instagramLink.style.display =
            "none";

    }


    /*
     * Il profilo FS punta all'area personale.
     * Se in futuro creeremo profile.html con gli ID,
     * potremo renderlo specifico per ogni membro.
     */

    profilePageLink.href =
        "area-personale.html";


    profileOverlay.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";

}



/* ========================================================
   CLOSE PROFILE
======================================================== */

function closeProfile() {

    profileOverlay.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";

}


profileClose.addEventListener(
    "click",
    closeProfile
);


profileOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            profileOverlay
        ) {

            closeProfile();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeProfile();

        }

    }
);



/* ========================================================
   STORIES
======================================================== */

async function loadStories(
    posts
) {

    stories.innerHTML = "";


    const seen =
        new Set();


    const authors =
        [];


    /*
     * Mostriamo gli utenti comparsi
     * nel feed come "people".
     */

    for (const post of posts) {

        if (
            seen.has(
                post.user_id
            )
        ) {

            continue;

        }


        seen.add(
            post.user_id
        );


        const author =
            await resolveAuthor(
                post.user_id
            );


        authors.push(
            author
        );


        if (
            authors.length >= 8
        ) {

            break;

        }

    }


    /*
     * Primo elemento = TU
     */

    const me =
        await resolveAuthor(
            currentUser.id
        );


    createStory(
        me,
        true
    );


    for (const author of authors) {

        if (
            author.id ===
            currentUser.id
        ) {

            continue;

        }


        createStory(
            author,
            false
        );

    }

}



/* ========================================================
   CREATE STORY
======================================================== */

function createStory(
    author,
    isMe
) {

    const story =
        document.createElement(
            "div"
        );


    story.className =
        "story";


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "story-avatar";


    if (author.avatar) {

        avatar.innerHTML = `
            <img
                src="${escapeHtml(author.avatar)}"
                alt=""
                style="width:100%;height:100%;object-fit:cover;border-radius:50%;"
            >
        `;

    }
    else {

        avatar.textContent =
            getInitials(
                author.name
            );

    }


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "story-name";


    name.textContent =
        isMe
            ? "Tu"
            : author.username
                ? "@" + author.username
                : author.name;


    story.appendChild(
        avatar
    );

    story.appendChild(
        name
    );


   story.addEventListener(
    "click",
    () => {

        if (isMe) {

            if (!myStoryImageUrl) {

                storyInput.value = "";
                storyInput.click();

                return;
            }

            storyViewerImage.src =
                myStoryImageUrl;

            storyViewerName.textContent =
                "Tu";

            storyViewerAvatar.textContent =
                "V";

            storyViewer.classList.add("show");

            return;
        }

        if (!author.storyImage) {

            showToast("Nessuna Story disponibile");

            return;
        }

        storyViewerImage.src =
            author.storyImage;

        storyViewerName.textContent =
            author.name || "FUORISCHEMA";

        storyViewerAvatar.textContent =
            getInitials(author.name);

        storyViewer.classList.add("show");
    }
);

    stories.appendChild(
        story
    );

}

if (logged) {
