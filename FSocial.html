<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FSocial — FUORISCHEMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #050505;
    --panel: #0d0d0f;
    --panel-border: rgba(255, 255, 255, 0.08);
    --line: rgba(255, 255, 255, 0.05);
    --line-strong: rgba(255, 255, 255, 0.15);
    --text: #f8f8f8;
    --muted: #8e8e93;
    --muted-2: #55555c;
    --orange: #ff4d00;
    --orange-hover: #ff6a26;
    --orange-glow: rgba(255, 77, 0, 0.25);
    --orange-subtle: rgba(255, 77, 0, 0.12);
    --danger: #ff3b30;
    --radius: 18px;
    --feed-width: 520px;
    --font-title: 'Syne', sans-serif;
    --font-body: 'Inter', sans-serif;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color: transparent;
}
html{
    scroll-behavior:smooth;
}
body{
    min-height:100vh;
    background: var(--bg);
    color:var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing:antialiased;
    letter-spacing: -0.01em;
    -webkit-overflow-scrolling: touch;
}
body.modal-open{overflow:hidden}
button,input,textarea{font:inherit}
button{
    border:0;
    background:transparent;
    cursor:pointer;
    touch-action: manipulation;
}
a{
    color:inherit;
    text-decoration:none;
    touch-action: manipulation;
}

/* Topbar Header */
.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:rgba(5, 5, 5, 0.82);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--panel-border);
}
.brand{
    font-family: var(--font-title);
    font-size:20px;
    font-weight:900;
    letter-spacing:-0.5px;
    display:inline-flex;
    align-items:center;
    gap:2px;
    transition: opacity 0.2s ease;
}
.brand:hover{
    opacity: 0.88;
}
.brand-white{color:#fff}
.brand-orange{color:var(--orange)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.top-btn{
    min-height:34px;
    padding:0 14px;
    border:1px solid var(--panel-border);
    border-radius:100px;
    background:rgba(255,255,255,0.03);
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    letter-spacing:0.8px;
    text-transform:uppercase;
    transition:all .25s var(--ease-out);
    display:inline-flex;
    align-items:center;
    justify-content:center;
}
.top-btn:hover{
    border-color:rgba(255,255,255,0.25);
    color:#fff;
    background:rgba(255,255,255,0.08);
}
.top-btn:active{
    transform: scale(0.96);
}
.top-btn.primary{
    background:var(--orange);
    color:#000;
    border-color:var(--orange);
    font-weight:800;
    box-shadow:0 0 16px var(--orange-glow);
}
.top-btn.primary:hover{
    background:#fff;
    border-color:#fff;
    color:#000;
    box-shadow:0 0 22px rgba(255,255,255,0.3);
}

.page{
    width:100%;
    padding:28px 0 90px;
    display:flex;
    justify-content:center;
}
.feed-shell{
    width:100%;
    max-width:var(--feed-width);
    margin:0 auto;
    padding:0 16px;
}

.hero{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:20px;
    padding:0 4px;
}
.hero-title{
    font-family: var(--font-title);
    font-size:32px;
    font-weight:900;
    letter-spacing:-1.2px;
    line-height:1;
}
.hero-title span{color:var(--orange)}
.hero-meta{
    color:var(--muted-2);
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
}

/* User Search Bar */
.user-search-wrapper {
    position: relative;
    margin-bottom: 24px;
    z-index: 50;
}
.user-search-input-box {
    position: relative;
    display: flex;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 100px;
    padding: 0 16px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.user-search-input-box:focus-within {
    border-color: rgba(255, 255, 255, 0.25);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}
.search-icon {
    font-size: 14px;
    color: var(--muted);
    margin-right: 10px;
    user-select: none;
    -webkit-user-select: none;
}
.user-search-input {
    width: 100%;
    height: 42px;
    border: 0;
    background: transparent;
    color: #fff;
    font-size: 13px;
    outline: none;
}
.user-search-input::placeholder {
    color: var(--muted-2);
    font-weight: 400;
}
.search-clear-btn {
    display: none;
    background: transparent;
    border: 0;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    padding: 4px;
    margin-left: 6px;
    transition: color 0.2s ease;
}
.search-clear-btn:hover {
    color: #fff;
}
.search-results {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    max-height: 320px;
    overflow-y: auto;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 60;
}
.search-results.active {
    display: block;
}
.search-result-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    transition: background-color 0.2s ease;
}
.search-result-item:last-child {
    border-bottom: none;
}
.search-result-item:hover {
    background: rgba(255, 255, 255, 0.05);
}
.search-result-avatar {
    width: 36px;
    height: 36px;
    flex: 0 0 36px;
    border-radius: 50%;
    background: var(--orange);
    color: #000;
    font-family: var(--font-title);
    font-size: 12px;
    font-weight: 900;
    display: grid;
    place-items: center;
    overflow: hidden;
}
.search-result-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.search-result-info {
    min-width: 0;
    display: flex;
    flex-direction: column;
}
.search-result-name {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}
.search-result-handle {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}
.search-state-message {
    padding: 18px 16px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
}

/* Feed Tabs Switcher */
.feed-tabs {
    position: relative;
    display: flex;
    background: rgba(255, 255, 255, 0.03);
    padding: 3px;
    border-radius: 100px;
    border: 1px solid var(--panel-border);
    margin-bottom: 28px;
}
.tab-btn {
    position: relative;
    z-index: 1;
    flex: 1;
    padding: 9px 0;
    background: transparent;
    border: none;
    border-radius: 100px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.25s ease, background-color 0.25s var(--ease-out), transform 0.15s ease, box-shadow 0.25s ease;
    text-align: center;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
}
.tab-btn:hover {
    color: #fff;
}
.tab-btn:active {
    transform: scale(0.97);
}
.tab-btn.active {
    color: #000;
    background: #fff;
    font-weight: 800;
    box-shadow: 0 4px 16px rgba(255, 255, 255, 0.18);
}

/* Editorial Create Post Box */
.create-card{
    position:relative;
    margin-bottom:32px;
    padding:18px 20px;
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    background: linear-gradient(180deg, rgba(18,18,22,0.7) 0%, rgba(10,10,12,0.85) 100%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: border-color .3s ease, box-shadow .3s ease;
}
.create-card:focus-within{
    border-color: rgba(255, 255, 255, 0.22);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}
.create-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{
    width:40px;height:40px;flex:0 0 40px;
    display:grid;place-items:center;
    border-radius:50%;
    background: linear-gradient(135deg, var(--orange) 0%, #ff8000 100%);
    color:#000;
    font-family: var(--font-title);
    font-size:14px;font-weight:900;
    overflow:hidden;
    box-shadow: 0 2px 10px var(--orange-glow);
    transition: transform 0.25s var(--ease-out);
    user-select: none;
    -webkit-user-select: none;
}
.avatar:hover{
    transform: scale(1.04);
}
.avatar img{
    width:100%;height:100%;object-fit:cover;
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
}
.user-info{min-width:0}
.user-name{font-size:13px;font-weight:700;color:#fff;letter-spacing:-0.01em}
.user-handle{margin-top:2px;color:var(--muted);font-size:11px;font-weight:500}
#postContent{
    width:100%;
    min-height:76px;
    resize:none;
    outline:0;
    border:0;
    background:transparent;
    color:#fff;
    font-size:14px;
    line-height:1.5;
    padding:4px 0;
    caret-color:var(--orange);
}
#postContent::placeholder{color:var(--muted-2);font-weight:400}
.create-image{
    display:none;
    position:relative;
    margin-top:12px;
    border:1px solid var(--panel-border);
    border-radius:12px;
    overflow:hidden;
    background:#000;
}
.create-image.active{display:block}
.create-image img{
    display:block;
    width:100%;
    max-height:420px;
    object-fit:cover;
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
}
.remove-image{
    position:absolute;
    top:10px;right:10px;
    width:28px;height:28px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    color:#fff;
    font-size:16px;
    cursor:pointer;
    display:grid;place-items:center;
    transition: background .2s, transform .2s ease;
}
.remove-image:hover{background:rgba(255,59,48,0.9);transform:scale(1.08)}
.remove-image:active{transform:scale(0.95)}
.create-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
}
.create-tools{display:flex;align-items:center;gap:12px;min-width:0}
.photo-label{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 13px;
    border-radius:100px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--panel-border);
    color:#ccc;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    cursor:pointer;
    transition:all .2s var(--ease-out);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
}
.photo-label:hover{background:rgba(255,255,255,0.09);color:#fff;border-color:rgba(255,255,255,0.22)}
.photo-label:active{transform:scale(0.96)}
#postImageInput{display:none}
#postStatus{color:var(--muted);font-size:11px;font-weight:600}
.publish-button{
    padding:8px 18px;
    border-radius:100px;
    background:var(--orange);
    color:#000;
    font-size:11px;
    font-weight:800;
    letter-spacing:0.6px;
    cursor:pointer;
    transition:all .25s var(--ease-out);
    box-shadow:0 0 14px var(--orange-glow);
}
.publish-button:hover{background:#fff;color:#000;box-shadow:0 0 20px rgba(255,255,255,0.3);transform:translateY(-1px)}
.publish-button:active{transform:translateY(0) scale(0.97)}
.publish-button:disabled{opacity:.4;cursor:wait;box-shadow:none;transform:none}

/* Feed & Street-Editorial Post Cards */
.feed{display:flex;flex-direction:column;gap:24px}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: translateY(12px) scale(0.99);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.post-card{
    overflow:hidden;
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    background:var(--panel);
    transition: border-color .3s ease, box-shadow .3s ease;
    animation: cardEnter 0.4s var(--ease-out) forwards;
    touch-action: pan-y;
}
.post-card:hover{
    border-color: rgba(255, 255, 255, 0.16);
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
}

.post-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
}
.post-author{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
    cursor:pointer;
    transition: opacity 0.2s ease;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
}
.post-author:hover{
    opacity: 0.88;
}
.post-avatar{
    width:36px;height:36px;flex:0 0 36px;
    display:grid;place-items:center;
    border-radius:50%;
    overflow:hidden;
    background:var(--orange);
    color:#000;
    font-family: var(--font-title);
    font-size:13px;font-weight:900;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    user-select: none;
    -webkit-user-select: none;
}
.post-avatar img{
    width:100%;height:100%;object-fit:cover;
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
}
.post-author-info{min-width:0;display:flex;flex-direction:column}
.post-author-name{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:13.5px;font-weight:700;
    color:#fff;
    letter-spacing:-0.01em;
}
.post-author-handle{
    margin-top:1px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    color:var(--muted);
    font-size:11px;
    font-weight:500;
}
.post-date{color:var(--muted-2);font-size:11px;font-weight:600;letter-spacing:0.5px}

.post-image{
    width:100%;
    background:#000;
    overflow:hidden;
    border-top:1px solid rgba(255, 255, 255, 0.04);
    border-bottom:1px solid rgba(255, 255, 255, 0.04);
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
}
.post-image img{
    display:block;
    width:100%;
    max-height:620px;
    object-fit:cover;
    background:#000;
    transition: transform .5s var(--ease-out);
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
}
.post-card:hover .post-image img{
    transform: scale(1.018);
}

.post-actions{
    display:flex;
    align-items:center;
    padding:12px 16px 6px;
    gap:16px;
}
.action-button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:transparent;
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    padding:4px;
    border-radius:8px;
    transition: color .2s ease, transform .15s ease, background-color .2s ease;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
}
.action-button:hover{color:#fff;background:rgba(255, 255, 255, 0.05)}
.action-button:active{transform:scale(0.86)}
.action-icon{font-size:19px;line-height:1;transition: transform 0.2s var(--ease-out), color 0.2s ease;}
.action-button.liked .action-icon{
    color:var(--orange);
    animation: likePulse 0.35s var(--ease-out);
}
.action-button.liked{color:var(--orange)}
.action-button.liked:hover{background:var(--orange-subtle)}

@keyframes likePulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
}

.delete-button{
    margin-left:auto;
    color:var(--muted-2);
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:5px 9px;
    border-radius:6px;
    transition: all .2s ease;
}
.delete-button:hover{color:var(--danger);background:rgba(255, 59, 48, 0.12)}
.delete-button:active{transform:scale(0.94)}

.post-meta{
    padding:2px 16px 6px;
    font-size:12.5px;
    color:var(--muted);
    font-weight:500;
}
.post-meta strong{font-weight:700;color:#fff}

.post-body{
    padding:2px 16px 14px;
}
.post-caption{
    font-size:13.5px;
    line-height:1.55;
    color:#e0e0e0;
    word-break:break-word;
}
.post-caption .author-username-inline{
    font-weight:700;
    margin-right:8px;
    color:#fff;
    transition: color .2s;
    touch-action: manipulation;
}
.post-caption .author-username-inline:hover{
    color:var(--orange);
}
.post-text{
    display:inline;
    white-space:pre-wrap;
}

/* Comments Section */
.comments{
    display:none;
    padding:14px 16px;
    background: rgba(0,0,0,0.35);
    border-top:1px solid var(--line);
    transition: all 0.3s var(--ease-out);
}
.comments.active{display:block}
.comments-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;max-height:240px;overflow-y:auto}
.comment{display:flex;gap:10px;align-items:flex-start}
.comment-avatar{
    width:26px;height:26px;flex:0 0 26px;
    display:grid;place-items:center;
    overflow:hidden;
    border-radius:50%;
    background:var(--orange);
    color:#000;
    font-family: var(--font-title);
    font-size:10px;font-weight:900;
    margin-top:2px;
    user-select: none;
    -webkit-user-select: none;
}
.comment-avatar img{
    width:100%;height:100%;object-fit:cover;
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
}
.comment-content{
    min-width:0;
    flex:1;
    font-size:12.5px;
    line-height:1.4;
    background: rgba(255,255,255,0.025);
    padding:8px 12px;
    border-radius:12px;
    border: 1px solid rgba(255,255,255,0.04);
}
.comment-user{font-size:12px;font-weight:700;color:#fff;display:inline;margin-right:6px}
.comment-text{color:#ccc;display:inline;word-break:break-word}

.comment-box{display:flex;gap:8px;align-items:center;margin-top:10px}
.comment-input{
    min-width:0;
    flex:1;
    outline:0;
    border:1px solid var(--panel-border);
    border-radius:100px;
    background:rgba(255,255,255,0.03);
    color:#fff;
    padding:8px 14px;
    font-size:12px;
    transition: border-color .2s ease, background-color .2s ease;
}
.comment-input:focus{border-color:rgba(255,255,255,0.22);background:rgba(255,255,255,0.05)}
.comment-input::placeholder{color:var(--muted-2)}
.comment-button{
    background:transparent;
    color:var(--orange);
    font-weight:800;
    font-size:11px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    cursor:pointer;
    padding:6px 12px;
    border-radius:100px;
    transition: all .2s ease;
}
.comment-button:hover{color:#fff;background:var(--orange-subtle)}
.comment-button:active{transform:scale(0.95)}
.comment-button:disabled{opacity:.3;background:transparent;transform:none}

.empty{
    padding:50px 20px;
    border:1px dashed var(--panel-border);
    border-radius:var(--radius);
    background:rgba(255,255,255,0.01);
    text-align:center;
}
.empty-icon{margin-bottom:12px;color:var(--orange);font-size:26px}
.empty strong{display:block;margin-bottom:6px;font-size:13px;font-weight:800;letter-spacing:1px}
.empty span{color:var(--muted);font-size:12px}

.social-footer{
    display:flex;
    justify-content:space-between;
    margin-top:40px;
    padding:18px 4px 0;
    border-top:1px solid var(--line);
    color:var(--muted-2);
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
}

/* Profile modal */
.profile-overlay{
    position:fixed;
    inset:0;

<script type="module">
import { supabase } from "./supabase.js";

/* =========================================================
   ELEMENTS
========================================================= */
const feed = document.getElementById("feed");
const postContent = document.getElementById("postContent");
const publishButton = document.getElementById("publishButton");
const postStatus = document.getElementById("postStatus");
const logoutButton = document.getElementById("logoutButton");
const postImageInput = document.getElementById("postImageInput");
const postImagePreview = document.getElementById("postImagePreview");
const previewImage = document.getElementById("previewImage");
const removeImageButton = document.getElementById("removeImageButton");
const createAvatar = document.getElementById("createAvatar");
const createUserName = document.getElementById("createUserName");
const createUserHandle = document.getElementById("createUserHandle");

const userSearchInput = document.getElementById("userSearchInput");
const searchClearBtn = document.getElementById("searchClearBtn");
const searchResults = document.getElementById("searchResults");

const profileOverlay = document.getElementById("profileOverlay");
const profileClose = document.getElementById("profileClose");
const modalAvatar = document.getElementById("modalAvatar");
const modalName = document.getElementById("modalName");
const modalHandle = document.getElementById("modalHandle");
const modalBio = document.getElementById("modalBio");
const instagramLink = document.getElementById("instagramLink");
const profilePageLink = document.getElementById("profilePageLink");

const tabForYou = document.getElementById("tabForYou");
const tabRecent = document.getElementById("tabRecent");

const toast = document.getElementById("toast");

/* =========================================================
   STATE
========================================================= */
let currentUser = null;
let selectedImageFile = null;
let selectedImageUrl = null;
let currentFeedType = "foryou"; // "foryou" oppure "recent"
let searchDebounceTimer = null;

/* =========================================================
   HELPERS
========================================================= */
function showToast(message){
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(window.__fsToast);
    window.__fsToast = setTimeout(() => toast.classList.remove("show"), 2600);
}

function escapeHtml(value){
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

function getInitials(name){
    if(!name) return "F";
    const parts = String(name).trim().split(/\s+/);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function getUserName(user){
    return user?.user_metadata?.full_name ||
           user?.user_metadata?.name ||
           user?.user_metadata?.display_name ||
           "MEMBRO FUORISCHEMA";
}

function getUsername(user){
    return user?.user_metadata?.username ||
           user?.user_metadata?.user_name ||
           user?.user_metadata?.preferred_username ||
           "";
}

function getInstagram(user){
    return user?.user_metadata?.instagram || "";
}

function getAvatar(user){
    return user?.user_metadata?.avatar_url ||
           user?.user_metadata?.picture ||
           user?.user_metadata?.avatar ||
           "";
}

function timeAgo(date){
    const diff = Math.floor((Date.now() - new Date(date).getTime()) / 1000);
    if(diff < 60) return "ora";
    if(diff < 3600) return `${Math.floor(diff/60)}m`;
    if(diff < 86400) return `${Math.floor(diff/3600)}h`;
    if(diff < 604800) return `${Math.floor(diff/86400)}g`;
    return new Date(date).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function fileExtension(file){
    const ext = file.name.split(".").pop()?.toLowerCase();
    return ext && /^[a-z0-9]+$/.test(ext) ? ext : "jpg";
}

function setAvatar(element, author){
    if(author?.avatar){
        element.innerHTML = `<img src="${escapeHtml(author.avatar)}" alt="">`;
    }else{
        element.textContent = getInitials(author?.name);
    }
}

/* Micro-noise deterministico stabile per utente/post (varia tra 0.995 e 1.005) */
function getForYouHistoryKey(){
    return `fsocial_foryou_history_${currentUser?.id || "guest"}`;
}

function loadForYouHistory(){
    try{
        const raw = localStorage.getItem(getForYouHistoryKey());
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
    }catch{
        return [];
    }
}

function saveForYouHistory(posts){
    try{
        const history = posts.slice(0, 12).map((post, index) => ({
            id: post.id,
            position: index,
            shownAt: Date.now()
        }));
        localStorage.setItem(getForYouHistoryKey(), JSON.stringify(history));
    }catch{
        // Il feed deve continuare a funzionare anche se localStorage non è disponibile.
    }
}

function getRotationPenalty(postId, history){
    const item = history.find(entry => entry.id === postId);
    if(!item) return 1;

    // Penalizza soprattutto ciò che era in cima al feed precedente.
    // Non esclude mai il post: con pochi contenuti può comunque tornare.
    if(item.position === 0) return 0.18;
    if(item.position === 1) return 0.35;
    if(item.position === 2) return 0.55;
    if(item.position <= 5) return 0.72;
    return 0.86;
}

function getRandomFeedNoise(){
    // Piccola variazione per evitare un ranking identico ad ogni apertura/refresh.
    return 0.88 + (Math.random() * 0.24);
}

/* =========================================================
   DYNAMIC WINDOW ALGORITHM PARAMS
========================================================= */
function getDynamicWindowParams(N) {
    if (!N || N <= 0) {
        return { K: 150, T: 720 };
    }

    const rawK = Math.min(N, 50 + Math.floor(5 * Math.sqrt(N)));
    const K = Math.min(150, rawK);

    const T_max = 720;
    const T_min = 48;
    const N0 = 100;
    const gamma = 1.2;

    const T = T_min + (T_max - T_min) /
        (1 + Math.pow(N / N0, gamma));

    return { K, T };
}

/* =========================================================
   AUTH
========================================================= */
async function checkUser(){
    const {data,error} = await supabase.auth.getUser();

    if(error || !data?.user){
        window.location.href = "login.html";
        return false;
    }

    currentUser = data.user;

    let profileAvatar = "";
    const { data: profile } = await supabase
        .from("profiles")
        .select("avatar_url")
        .eq("id", currentUser.id)
        .maybeSingle();

    if (profile && profile.avatar_url) {
        profileAvatar = profile.avatar_url;
    }

    const me = {
        name:getUserName(currentUser),
        username:getUsername(currentUser),
        avatar:profileAvatar || getAvatar(currentUser)
    };

    createUserName.textContent = me.name;
    createUserHandle.textContent = me.username ? `@${me.username}` : "Cosa c'è di nuovo?";
    setAvatar(createAvatar, me);

    return true;
}

logoutButton.addEventListener("click", async () => {
    logoutButton.disabled = true;
    await supabase.auth.signOut();
    window.location.href = "index.html";
});

/* =========================================================
   SEARCH USERS
========================================================= */
userSearchInput.addEventListener("input", (e) => {
    const query = e.target.value.trim();

    if (query.length > 0) {
        searchClearBtn.style.display = "block";
    } else {
        searchClearBtn.style.display = "none";
        searchResults.classList.remove("active");
        searchResults.innerHTML = "";
        return;
    }

    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
        searchUsers(query);
    }, 250);
});

searchClearBtn.addEventListener("click", () => {
    userSearchInput.value = "";
    searchClearBtn.style.display = "none";
    searchResults.classList.remove("active");
    searchResults.innerHTML = "";
    userSearchInput.focus();
});

document.addEventListener("click", (e) => {
    if (!e.target.closest(".user-search-wrapper")) {
        searchResults.classList.remove("active");
    }
});

userSearchInput.addEventListener("focus", () => {
    if (userSearchInput.value.trim().length > 0 && searchResults.children.length > 0) {
        searchResults.classList.add("active");
    }
});

async function searchUsers(query) {
    const cleanQuery = query.replace(/^@/, "").trim();
    if (!cleanQuery) {
        searchResults.classList.remove("active");
        searchResults.innerHTML = "";
        return;
    }

    searchResults.innerHTML = `<div class="search-state-message">Ricerca in corso...</div>`;
    searchResults.classList.add("active");

    try {
        const { data, error } = await supabase
            .from("profiles")
            .select("id, username, full_name, instagram, avatar_url, bio")
            .or(`username.ilike.%${cleanQuery}%,full_name.ilike.%${cleanQuery}%`)
            .limit(8);

        if (error) throw error;

        if (!data || data.length === 0) {
            searchResults.innerHTML = `<div class="search-state-message">Nessun utente trovato per "${escapeHtml(cleanQuery)}"</div>`;
            return;
        }

        searchResults.innerHTML = "";
        data.forEach(profile => {
            const author = {
                id: profile.id,
                name: profile.full_name || profile.username || "MEMBRO FUORISCHEMA",
                username: profile.username || "",
                instagram: profile.instagram || "",
                avatar: profile.avatar_url || "",
                bio: profile.bio || "Membro FUORISCHEMA."
            };

            const item = document.createElement("div");
            item.className = "search-result-item";

            const avatarContent = author.avatar
                ? `<img src="${escapeHtml(author.avatar)}" alt="">`
                : escapeHtml(getInitials(author.name));

            item.innerHTML = `
                <div class="search-result-avatar">${avatarContent}</div>
                <div class="search-result-info">
                    <div class="search-result-name">${escapeHtml(author.name)}</div>
                    <div class="search-result-handle">${author.username ? "@" + escapeHtml(author.username) : "Membro FUORISCHEMA"}</div>
                </div>
            `;

            item.addEventListener("click", () => {
                searchResults.classList.remove("active");
                openProfile(author);
            });

            searchResults.appendChild(item);
        });
    } catch (err) {
        console.error("Errore durante la ricerca utenti:", err);
        searchResults.innerHTML = `<div class="search-state-message">Errore durante la ricerca</div>`;
    }
}

/* =========================================================
   IMAGE POST
========================================================= */
postImageInput.addEventListener("change", () => {
    const file = postImageInput.files?.[0];
    if(!file) return;

    if(!file.type.startsWith("image/")){
        showToast("Seleziona una foto.");
        postImageInput.value = "";
        return;
    }

    if(file.size > 10 * 1024 * 1024){
        showToast("La foto è troppo grande. Massimo 10 MB.");
        postImageInput.value = "";
        return;
    }

    selectedImageFile = file;

    if(selectedImageUrl) URL.revokeObjectURL(selectedImageUrl);
    selectedImageUrl = URL.createObjectURL(file);

    previewImage.src = selectedImageUrl;
    postImagePreview.classList.add("active");
});

removeImageButton.addEventListener("click", () => {
    selectedImageFile = null;
    postImageInput.value = "";

    if(selectedImageUrl) URL.revokeObjectURL(selectedImageUrl);
    selectedImageUrl = null;

    previewImage.src = "";
    postImagePreview.classList.remove("active");
});

async function uploadPostImage(file){
   const uniqueId = (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function")
    ? crypto.randomUUID()
    : `${Date.now()}-${Math.random().toString(36).slice(2, 11)}`;

const path = `${currentUser.id}/${uniqueId}`;

    const {error} = await supabase.storage
        .from("post-images")
        .upload(path,file,{cacheControl:"3600",upsert:false});

    if(error) throw new Error("Non riesco a caricare la foto: " + error.message);

    const {data} = supabase.storage.from("post-images").getPublicUrl(path);
    return data?.publicUrl || null;
}

publishButton.addEventListener("click", async () => {
    if(!currentUser){
        showToast("Devi essere loggato.");
        return;
    }

    const content = postContent.value.trim();
    if(!content && !selectedImageFile){
        showToast("Scrivi qualcosa o aggiungi una foto.");
        return;
    }

    publishButton.disabled = true;
    postStatus.textContent = "Pubblicazione...";

    try{
        let imageUrl = null;
        if(selectedImageFile) imageUrl = await uploadPostImage(selectedImageFile);

        const postData = {
            user_id: currentUser.id,
            content
        };
        if(imageUrl) postData.image_url = imageUrl;

        const {error} = await supabase.from("posts").insert(postData);
        if(error) throw error;

        postContent.value = "";
        selectedImageFile = null;
        postImageInput.value = "";

        if(selectedImageUrl) URL.revokeObjectURL(selectedImageUrl);
        selectedImageUrl = null;
        previewImage.src = "";
        postImagePreview.classList.remove("active");

        postStatus.textContent = "Pubblicato.";
        showToast("Post pubblicato 🔥");
        await loadFeed();
    }catch(error){
        console.error(error);
        postStatus.textContent = "Errore";
        showToast(error.message || "Errore durante la pubblicazione.");
    }finally{
        publishButton.disabled = false;
    }
});

/* =========================================================
   PROFILES
========================================================= */
async function getProfile(userId){
    if(!userId) return null;

    const {data,error} = await supabase
        .from("profiles")
        .select("id,username,full_name,instagram,avatar_url,bio")
        .eq("id",userId)
        .maybeSingle();

    if(error){
        console.warn("Profilo non disponibile:",error.message);
        return null;
    }
    return data || null;
}

async function resolveAuthor(userId){
    const profile = await getProfile(userId);

    if(profile){
        return {
            id:profile.id,
            name:profile.full_name || profile.username || "MEMBRO FUORISCHEMA",
            username:profile.username || "",
            instagram:profile.instagram || "",
            avatar:profile.avatar_url || "",
            bio:profile.bio || "Membro FUORISCHEMA."
        };
    }

    if(currentUser && userId === currentUser.id){
        return {
            id:currentUser.id,
            name:getUserName(currentUser),
            username:getUsername(currentUser),
            instagram:getInstagram(currentUser),
            avatar:getAvatar(currentUser),
            bio:"Membro FUORISCHEMA."
        };
    }

    return {
        id:userId,
        name:"MEMBRO FUORISCHEMA",
        username:"",
        instagram:"",
        avatar:"",
        bio:"Membro FUORISCHEMA."
    };
}

function openProfile(author){
    setAvatar(modalAvatar,author);
    modalName.textContent = author.name;
    modalHandle.textContent = author.username ? `@${author.username}` : "Membro FUORISCHEMA";
    modalBio.textContent = author.bio || "Membro FUORISCHEMA.";

    if(author.instagram){
        const username = author.instagram.replace(/^@/,"").trim();
        instagramLink.href = `https://instagram.com/${encodeURIComponent(username)}`;
        instagramLink.style.display = "flex";
    }else{
        instagramLink.href = "#";
        instagramLink.style.display = "none";
    }

    profilePageLink.href = author?.id ? `area-personale.html?id=${encodeURIComponent(author.id)}` : "area-personale.html";
    profileOverlay.classList.add("active");
    profileOverlay.style.display = "flex";
    document.body.classList.add("modal-open");
}

function closeProfile(){
    profileOverlay.classList.remove("active");
    setTimeout(() => {
        if(!profileOverlay.classList.contains("active")){
            profileOverlay.style.display = "none";
        }
    }, 250);
    document.body.classList.remove("modal-open");
}

   FEED LOGIC WITH DYNAMIC WINDOW
========================================================= */

// Event Listeners per i Tab

// Funzione condivisa per il fetch del pool di candidati tramite Finestra Dinamica
async function fetchFeedWindow() {
    // 1. Calcolo del numero totale di post N
    const { count: totalPosts, error: countErr } = await supabase
        .from("posts")
        .select("id", { count: "exact", head: true });

    if (countErr) throw countErr;

    const N = totalPosts || 0;
    const { K, T } = getDynamicWindowParams(N);

    // 2. Definizione del cutoff temporale
    const cutoffDate = new Date(Date.now() - T * 60 * 60 * 1000).toISOString();

    // 3. Recupero dei post nella finestra T, al massimo K
    let { data: posts, error: fetchErr } = await supabase
        .from("posts")
        .select("*")
        .gte("created_at", cutoffDate)
        .order("created_at", { ascending: false })
        .limit(K);

    if (fetchErr) throw fetchErr;

    // 4. Fallback: Se la finestra T non restituisce post, recupera i più recenti fino a K
    if (!posts || posts.length === 0) {
        const { data: fallbackPosts, error: fallbackErr } = await supabase
            .from("posts")
            .select("*")
            .order("created_at", { ascending: false })
            .limit(K);

        if (fallbackErr) throw fallbackErr;
        posts = fallbackPosts || [];
    }

    return posts;
}

async function fetchRecentPosts() {
    const posts = await fetchFeedWindow();
    return posts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
}

async function fetchForYouPosts(){
    let pool = await fetchFeedWindow();

    if(!pool || pool.length === 0) return [];

    /*
     * PER TE:
     * - privilegia contenuti recenti + engagement;
     * - mantiene diversità tra gli autori;
     * - ruota i contenuti mostrati in precedenza;
     * - non esclude definitivamente i post vecchi;
     * - introduce una piccola variazione ad ogni caricamento.
     */
    const history = loadForYouHistory();

    // Se abbiamo pochi contenuti nella finestra dinamica, allarghiamo il pool
    // per dare al feed la possibilità di ripescare post più vecchi.
    if(pool.length < 12){
        const knownIds = new Set(pool.map(post => post.id));

        const { data: olderPosts, error: olderError } = await supabase
            .from("posts")
            .select("*")
            .order("created_at", { ascending: false })
            .limit(50);

        if(!olderError && olderPosts){
            for(const post of olderPosts){
                if(!knownIds.has(post.id)){
                    pool.push(post);
                    knownIds.add(post.id);
                }
                if(pool.length >= 50) break;
            }
        }
    }

    const postIds = pool.map(post => post.id);

    // Fetch dell'Engagement in Batch
    let likesMap = {};
    let commentsMap = {};

    try{
        const pLikes = supabase
            .from("post_likes")
            .select("post_id")
            .in("post_id", postIds);

        const pComments = supabase
            .from("post_comments")
            .select("post_id")
            .in("post_id", postIds);

        const [resLikes, resComments] = await Promise.all([pLikes, pComments]);

        if(!resLikes.error && resLikes.data){
            resLikes.data.forEach(l => {
                likesMap[l.post_id] = (likesMap[l.post_id] || 0) + 1;
            });
        }

        if(!resComments.error && resComments.data){
            resComments.data.forEach(c => {
                commentsMap[c.post_id] = (commentsMap[c.post_id] || 0) + 1;
            });
        }
    }catch(engagementErr){
        console.warn("Errore recupero engagement, proseguimento con conteggi a zero:", engagementErr);
    }

    const now = Date.now();

    // Step 1: Score base + rotazione + variazione casuale.
    const poolWithScore = pool.map(post => {
        const likes = likesMap[post.id] || 0;
        const comments = commentsMap[post.id] || 0;
        const createdAt = new Date(post.created_at).getTime();
        const hoursSinceCreation = Math.max(
            0,
            (now - createdAt) / (1000 * 60 * 60)
        );

        const baseScore =
            (1 + (likes * 1.5) + (comments * 2.0)) /
            Math.pow(hoursSinceCreation + 2, 1.2);

        const rotationPenalty = getRotationPenalty(post.id, history);
        const randomNoise = getRandomFeedNoise();

        return {
            post,
            baseScore: baseScore * rotationPenalty * randomNoise
        };
    });

    // Step 2: Reranking per diversità degli autori.
    const selectedPosts = [];
    const authorSelectedCount = {};
    let candidates = [...poolWithScore];

    function getAuthorPenalty(count){
        if(count === 0) return 1.0;
        if(count === 1) return 0.50;
        if(count === 2) return 0.25;
        return 0.20;
    }

    while(candidates.length > 0){
        let bestIndex = -1;
        let bestDynamicScore = -1;

        for(let i = 0; i < candidates.length; i++){
            const cand = candidates[i];
            const authorId = cand.post.user_id;
            const count = authorSelectedCount[authorId] || 0;
            const penalty = getAuthorPenalty(count);
            const dynamicScore = cand.baseScore * penalty;

            if(dynamicScore > bestDynamicScore){
                bestDynamicScore = dynamicScore;
                bestIndex = i;
            }
        }

        if(bestIndex === -1) break;

        const [chosen] = candidates.splice(bestIndex, 1);
        selectedPosts.push(chosen.post);

        const chosenAuthorId = chosen.post.user_id;
        authorSelectedCount[chosenAuthorId] =
            (authorSelectedCount[chosenAuthorId] || 0) + 1;
    }

    // Salviamo l'ordine appena mostrato per favorire una rotazione
    // intelligente alla prossima apertura del feed.
    saveForYouHistory(selectedPosts);

    return selectedPosts;
}

async function loadFeed() {
    feed.innerHTML = `
        <div class="empty">
            <div class="empty-icon">◌</div>
            <strong>CARICAMENTO...</strong>
            <span>Stiamo preparando FSocial.</span>
        </div>
    `;

    let posts = [];

    try {
        if (currentFeedType === "foryou") {
            posts = await fetchForYouPosts();
        } else {
            posts = await fetchRecentPosts();
        }
    } catch (err) {
        console.warn("Fallback attivato per errore durante il fetch del feed:", err);
        try {
            posts = await fetchRecentPosts();
        } catch (fallbackErr) {
            console.error("Errore irreversibile nel feed:", fallbackErr);
            feed.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">!</div>
                    <strong>ERRORE NEL FEED</strong>
                    <span>${escapeHtml(fallbackErr.message)}</span>
                </div>
            `;
            return;
        }
    }

    if (!posts || posts.length === 0) {
        feed.innerHTML = `
            <div class="empty">
                <div class="empty-icon">◎</div>
                <strong>IL FEED È VUOTO</strong>
                <span>Sii il primo a lasciare il tuo segno.</span>
            </div>
        `;
        return;
    }

    feed.innerHTML = "";

    const authors = await Promise.all(posts.map(post => resolveAuthor(post.user_id)));
    await Promise.all(posts.map((post, index) => renderPost(post, authors[index])));
}

async function renderPost(post,author){
    const article = document.createElement("article");
    article.className = "post-card";

    const avatarHtml = author.avatar
        ? `<img src="${escapeHtml(author.avatar)}" alt="">`
        : escapeHtml(getInitials(author.name));

    const imageHtml = post.image_url ? `
        <div class="post-image">
            <img src="${escapeHtml(post.image_url)}" alt="Post FUORISCHEMA" loading="lazy">
        </div>
    ` : "";

    const handleOrName = author.username ? author.username : author.name;

    article.innerHTML = `
        <div class="post-header">
            <div class="post-author author-profile-trigger">
                <div class="post-avatar">${avatarHtml}</div>
                <div class="post-author-info">
                    <div class="post-author-name">${escapeHtml(author.name)}</div>
                    <div class="post-author-handle">${author.username ? "@"+escapeHtml(author.username) : "Membro FUORISCHEMA"}</div>
                </div>
            </div>
            <div class="post-date" title="${new Date(post.created_at).toLocaleString("it-IT")}">${escapeHtml(timeAgo(post.created_at))}</div>
        </div>

        ${imageHtml}

        <div class="post-actions">
            <button class="action-button like-button" type="button" aria-label="Mi piace">
                <span class="action-icon">♡</span>
            </button>

            <button class="action-button comment-toggle" type="button" aria-label="Commenta">
                <span class="action-icon">💬</span>
            </button>

            <button class="action-button share-button" type="button" aria-label="Condividi">
                <span class="action-icon">✈</span>
            </button>

            ${post.user_id === currentUser.id ? `
                <button class="action-button delete-button" type="button">ELIMINA</button>
            ` : ""}
        </div>

        <div class="post-meta">
            Piace a <strong class="like-count">0</strong> persone
        </div>

        ${post.content ? `
            <div class="post-body">
                <div class="post-caption">
                    <span class="author-username-inline author-profile-trigger" style="cursor:pointer;">${escapeHtml(handleOrName)}</span>
                    <span class="post-text">${escapeHtml(post.content)}</span>
                </div>
            </div>
        ` : ""}

        <div class="comments" id="comments-${escapeHtml(post.id)}">
            <div class="comments-list"></div>
            <div class="comment-box">
                <input class="comment-input" type="text" maxlength="500" placeholder="Aggiungi un commento...">
                <button class="comment-button" type="button">Pubblica</button>
            </div>
        </div>
    `;

    feed.appendChild(article);

    const likeButton = article.querySelector(".like-button");
    const commentButton = article.querySelector(".comment-toggle");
    const deleteButton = article.querySelector(".delete-button");
    const shareButton = article.querySelector(".share-button");
    const addCommentButton = article.querySelector(".comment-button");
    const input = article.querySelector(".comment-input");
    const authorTriggers = article.querySelectorAll(".author-profile-trigger");

    likeButton.addEventListener("click",() => toggleLike(post.id,likeButton,article));
    commentButton.addEventListener("click",() => toggleComments(post.id,article));
    addCommentButton.addEventListener("click",() => addComment(post.id,article));
    input.addEventListener("keydown",event => {
        if(event.key === "Enter"){
            event.preventDefault();
            addComment(post.id,article);
        }
    });

    authorTriggers.forEach(trigger => {
        trigger.addEventListener("click",(event) => {
            event.preventDefault();
            event.stopPropagation();
            openProfile(author);
        });
    });

    if(deleteButton){
        deleteButton.addEventListener("click",() => deletePost(post.id));
    }

    shareButton.addEventListener("click",async () => {
        const url = `${location.origin}${location.pathname}#post-${post.id}`;
        try{
            await navigator.clipboard.writeText(url);
            showToast("Link del post copiato.");
        }catch{
            showToast("Non posso copiare il link da questo browser.");
        }
    });

    await Promise.all([
        updateLikeState(post.id,likeButton,article),
        updateCommentCount(post.id,commentButton)
    ]);
}

/* =========================================================
   LIKES
========================================================= */
async function updateLikeState(postId,button,article){
    try{
        const {count} = await supabase
            .from("post_likes")
            .select("id",{count:"exact",head:true})
            .eq("post_id",postId);

        const likeCountEl = article.querySelector(".like-count");
        if(likeCountEl) likeCountEl.textContent = count || 0;

        const {data:existing} = await supabase
            .from("post_likes")
            .select("id")
            .eq("post_id",postId)
            .eq("user_id",currentUser.id)
            .maybeSingle();

        if(existing){
            button.classList.add("liked");
            button.querySelector(".action-icon").textContent = "♥";
        }
    }catch(error){
        console.error("Errore stato like:",error);
    }
}

async function toggleLike(postId,button,article){
    if(!currentUser){
        showToast("Devi essere loggato.");
        return;
    }
    if(button.disabled) return;

    button.disabled = true;

    try{
        const {data:existing,error:checkError} = await supabase
            .from("post_likes")
            .select("id")
            .eq("post_id",postId)
            .eq("user_id",currentUser.id)
            .maybeSingle();

        if(checkError) throw checkError;

        if(existing){
            const {error} = await supabase
                .from("post_likes")
                .delete()
                .eq("id",existing.id);
            if(error) throw error;

            button.classList.remove("liked");
            button.querySelector(".action-icon").textContent = "♡";
        }else{
            const {error} = await supabase
                .from("post_likes")
                .insert({post_id:postId,user_id:currentUser.id});
            if(error) throw error;

            button.classList.add("liked");
            button.querySelector(".action-icon").textContent = "♥";
        }

        const {count} = await supabase
            .from("post_likes")
            .select("id",{count:"exact",head:true})
            .eq("post_id",postId);

        const likeCountEl = article.querySelector(".like-count");
        if(likeCountEl) likeCountEl.textContent = count || 0;
    }catch(error){
        console.error(error);
        showToast("Errore nel like: " + error.message);
    }finally{
        button.disabled = false;
    }
}

/* =========================================================
   COMMENTS
========================================================= */
async function updateCommentCount(postId,button){
    try{
        const {count} = await supabase
            .from("post_comments")
            .select("id",{count:"exact",head:true})
            .eq("post_id",postId);

        // optional comment count display
    }catch(error){
        console.error("Errore comment count:",error);
    }
}

async function toggleComments(postId,article){
    const box = document.getElementById(`comments-${postId}`);
    if(!box) return;

    box.classList.toggle("active");
    if(box.classList.contains("active")) await loadComments(postId,box);
}

async function loadComments(postId,box){
    const list = box.querySelector(".comments-list");
    list.innerHTML = `<div class="comment-text">Caricamento...</div>`;

    const {data,error} = await supabase
        .from("post_comments")
        .select("*")
        .eq("post_id",postId)
        .order("created_at",{ascending:true});

    if(error){
        list.innerHTML = `<div class="comment-text">${escapeHtml(error.message)}</div>`;
        return;
    }

    list.innerHTML = "";

    if(!data?.length){
        list.innerHTML = `<div class="comment-text" style="color:var(--muted-2);">Nessun commento. Sii il primo.</div>`;
        return;
    }

    const authors = await Promise.all(data.map(comment => resolveAuthor(comment.user_id)));

    data.forEach((comment,index) => {
        const author = authors[index];
        const div = document.createElement("div");
        div.className = "comment";

        const avatar = author.avatar
            ? `<img src="${escapeHtml(author.avatar)}" alt="">`
            : escapeHtml(getInitials(author.name));

        const authorHandleOrName = author.username ? author.username : author.name;

        div.innerHTML = `
            <div class="comment-avatar">${avatar}</div>
            <div class="comment-content">
                <span class="comment-user">${escapeHtml(authorHandleOrName)}</span>
                <span class="comment-text">${escapeHtml(comment.content)}</span>
            </div>
        `;
        list.appendChild(div);
    });
}

async function addComment(postId,article){
    if(!currentUser){
        showToast("Devi essere loggato.");
        return;
    }

    const input = article.querySelector(".comment-input");
    const button = article.querySelector(".comment-button");
    const content = input.value.trim();

    if(!content) return;

    button.disabled = true;

    try{
        const {error} = await supabase
            .from("post_comments")
            .insert({
                post_id:postId,
                user_id:currentUser.id,
                content
            });

        if(error) throw error;

        input.value = "";

        const box = document.getElementById(`comments-${postId}`);
        box.classList.add("active");
        await loadComments(postId,box);

        showToast("Commento pubblicato.");
    }catch(error){
        console.error(error);
        showToast("Errore: " + error.message);
    }finally{
        button.disabled = false;
    }
}

/* =========================================================
   DELETE
========================================================= */
async function deletePost(postId){
    if(!confirm("Vuoi davvero eliminare questo post?")) return;

    const {error} = await supabase
        .from("posts")
        .delete()
        .eq("id",postId);

    if(error){
        showToast("Errore: " + error.message);
        return;
    }

    showToast("Post eliminato.");
    await loadFeed();
}

/* =========================================================
   START
========================================================= */
const logged = await checkUser();
if(logged) await loadFeed();
