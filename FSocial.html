<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSocial — FUORISCHEMA</title>

<style>
:root {
    --bg: #000000;
    --panel: #000000;
    --panel-border: #262626;
    --line: #262626;
    --line-strong: #363636;
    --text: #f5f5f5;
    --muted: #a8a8a8;
    --muted-2: #737373;
    --orange: #ff4d00;
    --orange-hover: #e04400;
    --danger: #ed4956;
    --radius: 12px;
    --feed-width: 470px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    min-height:100vh;
    background: var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
}
body.modal-open{overflow:hidden}
button,input,textarea{font:inherit}
button{border:0;background:transparent;cursor:pointer}
a{color:inherit;text-decoration:none}

/* Topbar - Instagram style top header */
.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--panel-border);
}
.brand{
    font-size:22px;
    font-weight:900;
    letter-spacing:-1px;
}
.brand-white{color:#fff}
.brand-orange{color:var(--orange)}
.topbar-actions{display:flex;align-items:center;gap:12px}
.top-btn{
    min-height:34px;
    padding:0 14px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    background:transparent;
    color:#fff;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.8px;
    text-transform:uppercase;
    transition:.2s ease;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}
.top-btn:hover{border-color:var(--orange);color:var(--orange)}
.top-btn.primary{background:var(--orange);color:#000;border-color:var(--orange);font-weight:800}
.top-btn.primary:hover{background:#fff;border-color:#fff;color:#000}

.page{
    width:100%;
    padding:24px 0 80px;
    display:flex;
    justify-content:center;
}
.feed-shell{
    width:100%;
    max-width:var(--feed-width);
    margin:0 auto;
    padding:0 8px;
}

.hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
    padding:0 4px;
}
.hero-title{
    font-size:28px;
    font-weight:900;
    letter-spacing:-1px;
}
.hero-title span{color:var(--orange)}
.hero-meta{
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
    text-align:right;
}

/* Instagram Create Post Box */
.create-card{
    position:relative;
    margin-bottom:28px;
    padding:16px;
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    background:#0a0a0a;
}
.create-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{
    width:40px;height:40px;flex:0 0 40px;
    display:grid;place-items:center;
    border-radius:50%;
    background:var(--orange);
    color:#000;
    font-size:14px;font-weight:900;
    overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.user-info{min-width:0}
.user-name{font-size:13px;font-weight:700;color:#fff}
.user-handle{margin-top:1px;color:var(--muted);font-size:11px}
#postContent{
    width:100%;
    min-height:70px;
    resize:none;
    outline:0;
    border:0;
    background:transparent;
    color:#fff;
    font-size:14px;
    line-height:1.4;
    padding:4px 0;
    caret-color:var(--orange);
}
#postContent::placeholder{color:var(--muted-2)}
.create-image{
    display:none;
    position:relative;
    margin-top:10px;
    border:1px solid var(--panel-border);
    border-radius:8px;
    overflow:hidden;
    background:#000;
}
.create-image.active{display:block}
.create-image img{
    display:block;
    width:100%;
    max-height:400px;
    object-fit:contain;
    background:#000;
}
.remove-image{
    position:absolute;
    top:8px;right:8px;
    width:28px;height:28px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,0.75);
    color:#fff;
    font-size:18px;
    cursor:pointer;
    display:grid;place-items:center;
}
.create-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--panel-border);
}
.create-tools{display:flex;align-items:center;gap:10px;min-width:0}
.photo-label{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    border-radius:8px;
    background:#1a1a1a;
    color:#ccc;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    transition:.2s ease;
}
.photo-label:hover{background:#262626;color:#fff}
#postImageInput{display:none}
#postStatus{color:var(--muted);font-size:11px;font-weight:600}
.publish-button{
    padding:7px 16px;
    border-radius:8px;
    background:var(--orange);
    color:#000;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:.2s ease;
}
.publish-button:hover{background:#fff;color:#000}
.publish-button:disabled{opacity:.5;cursor:wait}

/* Feed & Instagram Post Cards */
.feed{display:flex;flex-direction:column;gap:24px}

.post-card{
    overflow:hidden;
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    background:var(--panel);
}

.post-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
}
.post-author{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
    cursor:pointer;
}
.post-avatar{
    width:38px;height:38px;flex:0 0 38px;
    display:grid;place-items:center;
    border-radius:50%;
    overflow:hidden;
    background:var(--orange);
    color:#000;
    font-size:13px;font-weight:900;
}
.post-avatar img{width:100%;height:100%;object-fit:cover}
.post-author-info{min-width:0;display:flex;flex-direction:column}
.post-author-name{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:13px;font-weight:700;
    color:#fff;
}
.post-author-handle{
    margin-top:1px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    color:var(--muted);
    font-size:11px;
}
.post-date{color:var(--muted-2);font-size:11px;font-weight:500}

.post-image{
    width:100%;
    background:#000;
}
.post-image img{
    display:block;
    width:100%;
    max-height:600px;
    object-fit:cover;
    background:#000;
}

/* Instagram action row */
.post-actions{
    display:flex;
    align-items:center;
    padding:10px 14px 6px;
    gap:16px;
}
.action-button{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:transparent;
    color:#f5f5f5;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    padding:0;
    transition:transform .12s ease;
}
.action-button:active{transform:scale(0.88)}
.action-icon{font-size:22px;line-height:1}
.action-button.liked .action-icon{color:var(--orange)}
.action-button.liked{color:var(--orange)}
.delete-button{
    margin-left:auto;
    color:var(--muted-2);
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
}
.delete-button:hover{color:var(--danger)}

/* Instagram Likes count & Meta */
.post-meta{
    padding:4px 14px;
    font-size:13px;
    color:#fff;
}
.post-meta strong{font-weight:700;color:#fff}

/* Instagram Caption format */
.post-body{
    padding:4px 14px 10px;
}
.post-caption{
    font-size:13px;
    line-height:1.45;
    color:#f5f5f5;
    word-break:break-word;
}
.post-caption .author-username-inline{
    font-weight:700;
    margin-right:6px;
    color:#fff;
}
.post-text{
    display:inline;
    white-space:pre-wrap;
}

/* Comments Section */
.comments{
    display:none;
    padding:8px 14px 14px;
    border-top:1px solid #1a1a1a;
}
.comments.active{display:block}
.comments-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:220px;overflow-y:auto}
.comment{display:flex;gap:8px;align-items:flex-start}
.comment-avatar{
    width:26px;height:26px;flex:0 0 26px;
    display:grid;place-items:center;
    overflow:hidden;
    border-radius:50%;
    background:var(--orange);
    color:#000;
    font-size:9px;font-weight:900;
    margin-top:2px;
}
.comment-avatar img{width:100%;height:100%;object-fit:cover}
.comment-content{
    min-width:0;
    flex:1;
    font-size:12px;
    line-height:1.4;
}
.comment-user{font-size:12px;font-weight:700;color:#fff;display:inline;margin-right:5px}
.comment-text{color:#ddd;display:inline;word-break:break-word}

.comment-box{display:flex;gap:8px;align-items:center;margin-top:8px}
.comment-input{
    min-width:0;
    flex:1;
    outline:0;
    border:0;
    background:transparent;
    color:#fff;
    padding:6px 0;
    font-size:12px;
}
.comment-input::placeholder{color:var(--muted-2)}
.comment-button{
    background:transparent;
    color:var(--orange);
    font-weight:800;
    font-size:12px;
    cursor:pointer;
    padding:4px 8px;
}
.comment-button:disabled{opacity:.4}

.empty{
    padding:48px 20px;
    border:1px dashed var(--line-strong);
    border-radius:var(--radius);
    background:#080808;
    text-align:center;
}
.empty-icon{margin-bottom:10px;color:var(--orange);font-size:24px}
.empty strong{display:block;margin-bottom:4px;font-size:14px;font-weight:800}
.empty span{color:var(--muted);font-size:11px}

.social-footer{
    display:flex;
    justify-content:space-between;
    margin-top:36px;
    padding:16px 4px 0;
    border-top:1px solid var(--panel-border);
    color:var(--muted-2);
    font-size:10px;
    font-weight:800;
    letter-spacing:1px;
}

/* Profile modal */
.profile-overlay{
    position:fixed;
    inset:0;
    z-index:99999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(8px);
}
.profile-overlay.active{display:flex}
.profile-modal{
    position:relative;
    width:min(100%,380px);
    padding:24px;
    border:1px solid var(--panel-border);
    border-radius:18px;
    background:#121212;
    box-shadow:0 20px 50px rgba(0,0,0,.9);
}
.profile-close{
    position:absolute;
    top:16px; right:16px;
    z-index:100001;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:20px;
    cursor:pointer;
}
.profile-close:hover{color:#fff}

.profile-modal-top{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:20px;
}
.profile-modal-avatar{
    width:70px; height:70px;
    border-radius:50%;
    background:var(--orange);
    color:#000;
    font-size:22px;
    font-weight:900;
    display:grid; place-items:center;
    overflow:hidden;
    margin-bottom:12px;
}
.profile-modal-avatar img{width:100%;height:100%;object-fit:cover}
.profile-modal-name{font-size:16px;font-weight:800;color:#fff}
.profile-modal-handle{font-size:12px;color:var(--muted);margin-top:2px}
.profile-modal-bio{font-size:13px;color:#ccc;margin-top:10px;line-height:1.4}

.profile-social{
    display:flex;
    flex-direction:column;
    gap:8px;
}
.profile-social a{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    border-radius:8px;
    font-size:12px;
    font-weight:800;
    text-align:center;
    background:#262626;
    color:#fff;
    transition:.2s ease;
}
.profile-social a.instagram{
    background:var(--orange);
    color:#000;
}
.profile-social a:hover{opacity:0.9}

.toast{
    position:fixed;
    left:50%;
    bottom:24px;
    z-index:900;
    max-width:calc(100vw - 30px);
    padding:10px 16px;
    border:1px solid var(--panel-border);
    border-radius:10px;
    background:#1a1a1a;
    color:#fff;
    font-size:12px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,18px);
    transition:.22s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:500px){
    .topbar{padding:0 12px;height:54px}
    .brand{font-size:19px}
    .top-btn{padding:0 10px;font-size:10px;min-height:30px}
    .page{padding-top:16px}
    .post-card{border-radius:0;border-left:0;border-right:0}
    .create-card{border-radius:0;border-left:0;border-right:0}
}
</style>
</head>

<body>

<header class="topbar">
    <a href="index.html" class="brand">
        <span class="brand-white">FUORI</span><span class="brand-orange">SCHEMA</span>
    </a>
    <div class="topbar-actions">
        <a href="index.html" class="top-btn">HOME</a>
        <a href="area-personale.html" class="top-btn">PROFILO</a>
        <button id="logoutButton" class="top-btn primary" type="button">ESCI</button>
    </div>
</header>

<main class="page">
    <div class="feed-shell">

        <section class="hero">
            <div class="hero-title">F<span>Social</span></div>
            <div class="hero-meta">FUORISCHEMA COMMUNITY</div>
        </section>

        <!-- Create Post Section -->
        <section class="create-card">
            <div class="create-top">
                <div id="createAvatar" class="avatar">F</div>
                <div class="user-info">
                    <div id="createUserName" class="user-name">FUORISCHEMA MEMBER</div>
                    <div id="createUserHandle" class="user-handle">Cosa c'è di nuovo?</div>
                </div>
            </div>

            <textarea id="postContent" placeholder="Scrivi una didascalia..."></textarea>

            <div id="postImagePreview" class="create-image">
                <img id="previewImage" src="" alt="Anteprima">
                <button id="removeImageButton" class="remove-image" type="button" aria-label="Rimuovi foto">×</button>
            </div>

            <div class="create-footer">
                <div class="create-tools">
                    <label for="postImageInput" class="photo-label">📷 FOTO</label>
                    <input id="postImageInput" type="file" accept="image/*">
                    <span id="postStatus"></span>
                </div>
                <button id="publishButton" class="publish-button" type="button">CONDIVIDI</button>
            </div>
        </section>

        <!-- Instagram-style Posts Feed -->
        <section id="feed" class="feed">
            <div class="empty">
                <div class="empty-icon">◌</div>
                <strong>CARICAMENTO...</strong>
                <span>Stiamo preparando FSocial.</span>
            </div>
        </section>

        <footer class="social-footer">
            <span>FUORISCHEMA</span>
            <span>FSOCIAL / 01</span>
        </footer>
    </div>
</main>

<!-- PROFILE MODAL -->
<div id="profileOverlay" class="profile-overlay">
    <div class="profile-modal">
        <button id="profileClose" class="profile-close" type="button" aria-label="Chiudi">✕</button>
        <div class="profile-modal-top">
            <div id="modalAvatar" class="profile-modal-avatar">F</div>
            <div id="modalName" class="profile-modal-name">FUORISCHEMA MEMBER</div>
            <div id="modalHandle" class="profile-modal-handle">@member</div>
            <div id="modalBio" class="profile-modal-bio">Membro FUORISCHEMA.</div>
        </div>
        <div class="profile-social">
            <a id="instagramLink" class="instagram" href="#" target="_blank" rel="noopener noreferrer">INSTAGRAM ↗</a>
            <a id="profilePageLink" href="area-personale.html">PROFILO FS ↗</a>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { supabase } from "./supabase.js";

/* =========================================================
   ELEMENTS
========================================================= */
const feed = document.getElementById("feed");
const postContent = document.getElementById("postContent");
const publishButton = document.getElementById("publishButton");
const postStatus = document.getElementById("postStatus");
const logoutButton = document.getElementById("logoutButton");
const postImageInput = document.getElementById("postImageInput");
const postImagePreview = document.getElementById("postImagePreview");
const previewImage = document.getElementById("previewImage");
const removeImageButton = document.getElementById("removeImageButton");
const createAvatar = document.getElementById("createAvatar");
const createUserName = document.getElementById("createUserName");
const createUserHandle = document.getElementById("createUserHandle");

const profileOverlay = document.getElementById("profileOverlay");
const profileClose = document.getElementById("profileClose");
const modalAvatar = document.getElementById("modalAvatar");
const modalName = document.getElementById("modalName");
const modalHandle = document.getElementById("modalHandle");
const modalBio = document.getElementById("modalBio");
const instagramLink = document.getElementById("instagramLink");
const profilePageLink = document.getElementById("profilePageLink");

const toast = document.getElementById("toast");

/* =========================================================
   STATE
========================================================= */
let currentUser = null;
let selectedImageFile = null;
let selectedImageUrl = null;

/* =========================================================
   HELPERS
========================================================= */
function showToast(message){
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(window.__fsToast);
    window.__fsToast = setTimeout(() => toast.classList.remove("show"), 2600);
}

function escapeHtml(value){
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

function getInitials(name){
    if(!name) return "F";
    const parts = String(name).trim().split(/\s+/);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function getUserName(user){
    return user?.user_metadata?.full_name ||
           user?.user_metadata?.name ||
           user?.user_metadata?.display_name ||
           "MEMBRO FUORISCHEMA";
}

function getUsername(user){
    return user?.user_metadata?.username ||
           user?.user_metadata?.user_name ||
           user?.user_metadata?.preferred_username ||
           "";
}

function getInstagram(user){
    return user?.user_metadata?.instagram || "";
}

function getAvatar(user){
    return user?.user_metadata?.avatar_url ||
           user?.user_metadata?.picture ||
           user?.user_metadata?.avatar ||
           "";
}

function timeAgo(date){
    const diff = Math.floor((Date.now() - new Date(date).getTime()) / 1000);
    if(diff < 60) return "ora";
    if(diff < 3600) return `${Math.floor(diff/60)}m`;
    if(diff < 86400) return `${Math.floor(diff/3600)}h`;
    if(diff < 604800) return `${Math.floor(diff/86400)}g`;
    return new Date(date).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function fileExtension(file){
    const ext = file.name.split(".").pop()?.toLowerCase();
    return ext && /^[a-z0-9]+$/.test(ext) ? ext : "jpg";
}

function setAvatar(element, author){
    if(author?.avatar){
        element.innerHTML = `<img src="${escapeHtml(author.avatar)}" alt="">`;
    }else{
        element.textContent = getInitials(author?.name);
    }
}

/* =========================================================
   AUTH
========================================================= */
async function checkUser(){
    const {data,error} = await supabase.auth.getUser();

    if(error || !data?.user){
        window.location.href = "login.html";
        return false;
    }

    currentUser = data.user;

    const me = {
        name:getUserName(currentUser),
        username:getUsername(currentUser),
        avatar:getAvatar(currentUser)
    };

    createUserName.textContent = me.name;
    createUserHandle.textContent = me.username ? `@${me.username}` : "Cosa c'è di nuovo?";
    setAvatar(createAvatar, me);

    return true;
}

logoutButton.addEventListener("click", async () => {
    logoutButton.disabled = true;
    await supabase.auth.signOut();
    window.location.href = "index.html";
});

/* =========================================================
   IMAGE POST
========================================================= */
postImageInput.addEventListener("change", () => {
    const file = postImageInput.files?.[0];
    if(!file) return;

    if(!file.type.startsWith("image/")){
        showToast("Seleziona una foto.");
        postImageInput.value = "";
        return;
    }

    if(file.size > 10 * 1024 * 1024){
        showToast("La foto è troppo grande. Massimo 10 MB.");
        postImageInput.value = "";
        return;
    }

    selectedImageFile = file;

    if(selectedImageUrl) URL.revokeObjectURL(selectedImageUrl);
    selectedImageUrl = URL.createObjectURL(file);

    previewImage.src = selectedImageUrl;
    postImagePreview.classList.add("active");
});

removeImageButton.addEventListener("click", () => {
    selectedImageFile = null;
    postImageInput.value = "";

    if(selectedImageUrl) URL.revokeObjectURL(selectedImageUrl);
    selectedImageUrl = null;

    previewImage.src = "";
    postImagePreview.classList.remove("active");
});

async function uploadPostImage(file){
    const path = `${currentUser.id}/${Date.now()}-${crypto.randomUUID()}.${fileExtension(file)}`;

    const {error} = await supabase.storage
        .from("post-images")
        .upload(path,file,{cacheControl:"3600",upsert:false});

    if(error) throw new Error("Non riesco a caricare la foto: " + error.message);

    const {data} = supabase.storage.from("post-images").getPublicUrl(path);
    return data?.publicUrl || null;
}

publishButton.addEventListener("click", async () => {
    if(!currentUser){
        showToast("Devi essere loggato.");
        return;
    }

    const content = postContent.value.trim();
    if(!content && !selectedImageFile){
        showToast("Scrivi qualcosa o aggiungi una foto.");
        return;
    }

    publishButton.disabled = true;
    postStatus.textContent = "Pubblicazione...";

    try{
        let imageUrl = null;
        if(selectedImageFile) imageUrl = await uploadPostImage(selectedImageFile);

        const postData = {
            user_id: currentUser.id,
            content
        };
        if(imageUrl) postData.image_url = imageUrl;

        const {error} = await supabase.from("posts").insert(postData);
        if(error) throw error;

        postContent.value = "";
        selectedImageFile = null;
        postImageInput.value = "";

        if(selectedImageUrl) URL.revokeObjectURL(selectedImageUrl);
        selectedImageUrl = null;
        previewImage.src = "";
        postImagePreview.classList.remove("active");

        postStatus.textContent = "Pubblicato.";
        showToast("Post pubblicato 🔥");
        await loadFeed();
    }catch(error){
        console.error(error);
        postStatus.textContent = "Errore";
        showToast(error.message || "Errore durante la pubblicazione.");
    }finally{
        publishButton.disabled = false;
    }
});

/* =========================================================
   PROFILES
========================================================= */
async function getProfile(userId){
    if(!userId) return null;

    const {data,error} = await supabase
        .from("profiles")
        .select("id,username,full_name,instagram,avatar_url,bio")
        .eq("id",userId)
        .maybeSingle();

    if(error){
        console.warn("Profilo non disponibile:",error.message);
        return null;
    }
    return data || null;
}

async function resolveAuthor(userId){
    const profile = await getProfile(userId);

    if(profile){
        return {
            id:profile.id,
            name:profile.full_name || profile.username || "MEMBRO FUORISCHEMA",
            username:profile.username || "",
            instagram:profile.instagram || "",
            avatar:profile.avatar_url || "",
            bio:profile.bio || "Membro FUORISCHEMA."
        };
    }

    if(currentUser && userId === currentUser.id){
        return {
            id:currentUser.id,
            name:getUserName(currentUser),
            username:getUsername(currentUser),
            instagram:getInstagram(currentUser),
            avatar:getAvatar(currentUser),
            bio:"Membro FUORISCHEMA."
        };
    }

    return {
        id:userId,
        name:"MEMBRO FUORISCHEMA",
        username:"",
        instagram:"",
        avatar:"",
        bio:"Membro FUORISCHEMA."
    };
}

function openProfile(author){
    setAvatar(modalAvatar,author);
    modalName.textContent = author.name;
    modalHandle.textContent = author.username ? `@${author.username}` : "Membro FUORISCHEMA";
    modalBio.textContent = author.bio || "Membro FUORISCHEMA.";

    if(author.instagram){
        const username = author.instagram.replace(/^@/,"").trim();
        instagramLink.href = `https://instagram.com/${encodeURIComponent(username)}`;
        instagramLink.style.display = "flex";
    }else{
        instagramLink.href = "#";
        instagramLink.style.display = "none";
    }

    profilePageLink.href = author?.id ? `area-personale.html?id=${encodeURIComponent(author.id)}` : "area-personale.html";
    profileOverlay.classList.add("active");
    profileOverlay.style.display = "flex";
    document.body.classList.add("modal-open");
}

function closeProfile(){
    profileOverlay.classList.remove("active");
    profileOverlay.style.display = "none";
    document.body.classList.remove("modal-open");
}

profileClose.addEventListener("click",closeProfile);
profileOverlay.addEventListener("click",event => {
    if(event.target === profileOverlay) closeProfile();
});

/* =========================================================
   FEED (INSTAGRAM STYLE LAYOUT)
========================================================= */
async function loadFeed(){
    feed.innerHTML = `
        <div class="empty">
            <div class="empty-icon">◌</div>
            <strong>CARICAMENTO...</strong>
            <span>Stiamo preparando FSocial.</span>
        </div>
    `;

    const {data:rawPosts,error} = await supabase
        .from("posts")
        .select("*")
        .order("created_at",{ascending:false});

    const posts = rawPosts || [];

    if(error){
        console.error(error);
        feed.innerHTML = `
            <div class="empty">
                <div class="empty-icon">!</div>
                <strong>ERRORE NEL FEED</strong>
                <span>${escapeHtml(error.message)}</span>
            </div>
        `;
        return;
    }

    if(!posts?.length){
        feed.innerHTML = `
            <div class="empty">
                <div class="empty-icon">◎</div>
                <strong>IL FEED È VUOTO</strong>
                <span>Sii il primo a lasciare il tuo segno.</span>
            </div>
        `;
        return;
    }

    feed.innerHTML = "";

    const authors = await Promise.all(posts.map(post => resolveAuthor(post.user_id)));
    await Promise.all(posts.map((post,index) => renderPost(post,authors[index])));

}

async function renderPost(post,author){
    const article = document.createElement("article");
    article.className = "post-card";

    const avatarHtml = author.avatar
        ? `<img src="${escapeHtml(author.avatar)}" alt="">`
        : escapeHtml(getInitials(author.name));

    const imageHtml = post.image_url ? `
        <div class="post-image">
            <img src="${escapeHtml(post.image_url)}" alt="Post FUORISCHEMA" loading="lazy">
        </div>
    ` : "";

    const handleOrName = author.username ? author.username : author.name;

    article.innerHTML = `
        <div class="post-header">
            <div class="post-author author-profile-trigger">
                <div class="post-avatar">${avatarHtml}</div>
                <div class="post-author-info">
                    <div class="post-author-name">${escapeHtml(author.name)}</div>
                    <div class="post-author-handle">${author.username ? "@"+escapeHtml(author.username) : "Membro FUORISCHEMA"}</div>
                </div>
            </div>
            <div class="post-date" title="${new Date(post.created_at).toLocaleString("it-IT")}">${escapeHtml(timeAgo(post.created_at))}</div>
        </div>

        ${imageHtml}

        <div class="post-actions">
            <button class="action-button like-button" type="button" aria-label="Mi piace">
                <span class="action-icon">♡</span>
            </button>

            <button class="action-button comment-toggle" type="button" aria-label="Commenta">
                <span class="action-icon">💬</span>
            </button>

            <button class="action-button share-button" type="button" aria-label="Condividi">
                <span class="action-icon">✈</span>
            </button>

            ${post.user_id === currentUser.id ? `
                <button class="action-button delete-button" type="button">ELIMINA</button>
            ` : ""}
        </div>

        <div class="post-meta">
            Piace a <strong class="like-count">0</strong> persone
        </div>

        ${post.content ? `
            <div class="post-body">
                <div class="post-caption">
                    <span class="author-username-inline author-profile-trigger" style="cursor:pointer;">${escapeHtml(handleOrName)}</span>
                    <span class="post-text">${escapeHtml(post.content)}</span>
                </div>
            </div>
        ` : ""}

        <div class="comments" id="comments-${escapeHtml(post.id)}">
            <div class="comments-list"></div>
            <div class="comment-box">
                <input class="comment-input" type="text" maxlength="500" placeholder="Aggiungi un commento...">
                <button class="comment-button" type="button">Pubblica</button>
            </div>
        </div>
    `;

    feed.appendChild(article);

    const likeButton = article.querySelector(".like-button");
    const commentButton = article.querySelector(".comment-toggle");
    const deleteButton = article.querySelector(".delete-button");
    const shareButton = article.querySelector(".share-button");
    const addCommentButton = article.querySelector(".comment-button");
    const input = article.querySelector(".comment-input");
    const authorTriggers = article.querySelectorAll(".author-profile-trigger");

    likeButton.addEventListener("click",() => toggleLike(post.id,likeButton,article));
    commentButton.addEventListener("click",() => toggleComments(post.id,article));
    addCommentButton.addEventListener("click",() => addComment(post.id,article));
    input.addEventListener("keydown",event => {
        if(event.key === "Enter"){
            event.preventDefault();
            addComment(post.id,article);
        }
    });

    authorTriggers.forEach(trigger => {
        trigger.addEventListener("click",(event) => {
            event.preventDefault();
            event.stopPropagation();
            openProfile(author);
        });
    });

    if(deleteButton){
        deleteButton.addEventListener("click",() => deletePost(post.id));
    }

    shareButton.addEventListener("click",async () => {
        const url = `${location.origin}${location.pathname}#post-${post.id}`;
        try{
            await navigator.clipboard.writeText(url);
            showToast("Link del post copiato.");
        }catch{
            showToast("Non posso copiare il link da questo browser.");
        }
    });

    await Promise.all([
        updateLikeState(post.id,likeButton,article),
        updateCommentCount(post.id,commentButton)
    ]);
}

/* =========================================================
   LIKES
========================================================= */
async function updateLikeState(postId,button,article){
    try{
        const {count} = await supabase
            .from("post_likes")
            .select("id",{count:"exact",head:true})
            .eq("post_id",postId);

        const likeCountEl = article.querySelector(".like-count");
        if(likeCountEl) likeCountEl.textContent = count || 0;

        const {data:existing} = await supabase
            .from("post_likes")
            .select("id")
            .eq("post_id",postId)
            .eq("user_id",currentUser.id)
            .maybeSingle();

        if(existing){
            button.classList.add("liked");
            button.querySelector(".action-icon").textContent = "♥";
        }
    }catch(error){
        console.error("Errore stato like:",error);
    }
}

async function toggleLike(postId,button,article){
    if(!currentUser){
        showToast("Devi essere loggato.");
        return;
    }
    if(button.disabled) return;

    button.disabled = true;

    try{
        const {data:existing,error:checkError} = await supabase
            .from("post_likes")
            .select("id")
            .eq("post_id",postId)
            .eq("user_id",currentUser.id)
            .maybeSingle();

        if(checkError) throw checkError;

        if(existing){
            const {error} = await supabase
                .from("post_likes")
                .delete()
                .eq("id",existing.id);
            if(error) throw error;

            button.classList.remove("liked");
            button.querySelector(".action-icon").textContent = "♡";
        }else{
            const {error} = await supabase
                .from("post_likes")
                .insert({post_id:postId,user_id:currentUser.id});
            if(error) throw error;

            button.classList.add("liked");
            button.querySelector(".action-icon").textContent = "♥";
        }

        const {count} = await supabase
            .from("post_likes")
            .select("id",{count:"exact",head:true})
            .eq("post_id",postId);

        const likeCountEl = article.querySelector(".like-count");
        if(likeCountEl) likeCountEl.textContent = count || 0;
    }catch(error){
        console.error(error);
        showToast("Errore nel like: " + error.message);
    }finally{
        button.disabled = false;
    }
}

/* =========================================================
   COMMENTS
========================================================= */
async function updateCommentCount(postId,button){
    try{
        const {count} = await supabase
            .from("post_comments")
            .select("id",{count:"exact",head:true})
            .eq("post_id",postId);

        // optional comment count display
    }catch(error){
        console.error("Errore comment count:",error);
    }
}

async function toggleComments(postId,article){
    const box = document.getElementById(`comments-${postId}`);
    if(!box) return;

    box.classList.toggle("active");
    if(box.classList.contains("active")) await loadComments(postId,box);
}

async function loadComments(postId,box){
    const list = box.querySelector(".comments-list");
    list.innerHTML = `<div class="comment-text">Caricamento...</div>`;

    const {data,error} = await supabase
        .from("post_comments")
        .select("*")
        .eq("post_id",postId)
        .order("created_at",{ascending:true});

    if(error){
        list.innerHTML = `<div class="comment-text">${escapeHtml(error.message)}</div>`;
        return;
    }

    list.innerHTML = "";

    if(!data?.length){
        list.innerHTML = `<div class="comment-text" style="color:var(--muted-2);">Nessun commento. Sii il primo.</div>`;
        return;
    }

    const authors = await Promise.all(data.map(comment => resolveAuthor(comment.user_id)));

    data.forEach((comment,index) => {
        const author = authors[index];
        const div = document.createElement("div");
        div.className = "comment";

        const avatar = author.avatar
            ? `<img src="${escapeHtml(author.avatar)}" alt="">`
            : escapeHtml(getInitials(author.name));

        const authorHandleOrName = author.username ? author.username : author.name;

        div.innerHTML = `
            <div class="comment-avatar">${avatar}</div>
            <div class="comment-content">
                <span class="comment-user">${escapeHtml(authorHandleOrName)}</span>
                <span class="comment-text">${escapeHtml(comment.content)}</span>
            </div>
        `;
        list.appendChild(div);
    });
}

async function addComment(postId,article){
    if(!currentUser){
        showToast("Devi essere loggato.");
        return;
    }

    const input = article.querySelector(".comment-input");
    const button = article.querySelector(".comment-button");
    const content = input.value.trim();

    if(!content) return;

    button.disabled = true;

    try{
        const {error} = await supabase
            .from("post_comments")
            .insert({
                post_id:postId,
                user_id:currentUser.id,
                content
            });

        if(error) throw error;

        input.value = "";

        const box = document.getElementById(`comments-${postId}`);
        box.classList.add("active");
        await loadComments(postId,box);

        showToast("Commento pubblicato.");
    }catch(error){
        console.error(error);
        showToast("Errore: " + error.message);
    }finally{
        button.disabled = false;
    }
}

/* =========================================================
   DELETE
========================================================= */
async function deletePost(postId){
    if(!confirm("Vuoi davvero eliminare questo post?")) return;

    const {error} = await supabase
        .from("posts")
        .delete()
        .eq("id",postId);

    if(error){
        showToast("Errore: " + error.message);
        return;
    }

    showToast("Post eliminato.");
    await loadFeed();
}

/* =========================================================
   START
========================================================= */
const logged = await checkUser();
if(logged) await loadFeed();
</script>
