<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FSocial — FUORISCHEMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #050505;
    --panel: #0d0d0f;
    --panel-border: rgba(255, 255, 255, 0.08);
    --line: rgba(255, 255, 255, 0.05);
    --line-strong: rgba(255, 255, 255, 0.15);
    --text: #f8f8f8;
    --muted: #8e8e93;
    --muted-2: #55555c;
    --orange: #ff4d00;
    --orange-hover: #ff6a26;
    --orange-glow: rgba(255, 77, 0, 0.25);
    --orange-subtle: rgba(255, 77, 0, 0.12);
    --danger: #ff3b30;
    --radius: 18px;
    --feed-width: 520px;
    --font-title: 'Syne', sans-serif;
    --font-body: 'Inter', sans-serif;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color: transparent;
}
html{
    scroll-behavior:smooth;
}
body{
    min-height:100vh;
    background: var(--bg);
    color:var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing:antialiased;
    letter-spacing: -0.01em;
    -webkit-overflow-scrolling: touch;
    overflow-x: hidden;
    padding-bottom: 70px;
}
body.modal-open{overflow:hidden}
button,input,textarea{font:inherit}
button{
    border:0;
    background:transparent;
    cursor:pointer;
    touch-action: manipulation;
}
a{
    color:inherit;
    text-decoration:none;
    touch-action: manipulation;
}

/* Topbar Header SENZA pulsanti HOME e PROFILO superiori */
.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:rgba(5, 5, 5, 0.82);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--panel-border);
}
.brand{
    font-family: var(--font-title);
    font-size:20px;
    font-weight:900;
    letter-spacing:-0.5px;
    display:inline-flex;
    align-items:center;
    gap:2px;
    transition: opacity 0.2s ease;
}
.brand:hover{
    opacity: 0.88;
}
.brand-white{color:#fff}
.brand-orange{color:var(--orange)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.top-btn{
    min-height:34px;
    padding:0 14px;
    border:1px solid var(--panel-border);
    border-radius:100px;
    background:rgba(255,255,255,0.03);
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    letter-spacing:0.8px;
    text-transform:uppercase;
    transition:all .25s var(--ease-out);
    display:inline-flex;
    align-items:center;
    justify-content:center;
}
.top-btn:hover{
    border-color:rgba(255,255,255,0.25);
    color:#fff;
    background:rgba(255,255,255,0.08);
}
.top-btn:active{
    transform: scale(0.96);
}
.top-btn.primary{
    background:var(--orange);
    color:#000;
    border-color:var(--orange);
    font-weight:800;
    box-shadow:0 0 16px var(--orange-glow);
}
.top-btn.primary:hover{
    background:#fff;
    border-color:#fff;
    color:#000;
    box-shadow:0 0 22px rgba(255,255,255,0.3);
}

.notif-btn {
    position: relative;
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--panel-border);
    background: rgba(255, 255, 255, 0.03);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    transition: all .25s var(--ease-out);
}
.notif-btn:hover {
    border-color: rgba(255, 255, 255, 0.25);
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
}
.notif-btn:active {
    transform: scale(0.92);
}
.notif-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    background: var(--orange);
    color: #000;
    font-size: 9px;
    font-weight: 900;
    min-width: 15px;
    height: 15px;
    border-radius: 100px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    box-shadow: 0 0 10px var(--orange-glow);
    border: 2px solid var(--bg);
}
.notif-badge.active {
    display: inline-flex;
}

.notif-overlay {
    position: fixed;
    inset: 0;
    bottom: 70px;
    z-index: 99998;
    display: none;
    justify-content: flex-end;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    opacity: 0;
    transition: opacity 0.3s var(--ease-out);
}
.notif-overlay.active {
    display: flex;
    opacity: 1;
}
.notif-modal {
    position: relative;
    width: 100%;
    max-width: 390px;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--panel-border);
    background: rgba(10, 10, 12, 0.95);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow: -20px 0 50px rgba(0, 0, 0, 0.8);
    transform: translateX(100%);
    transition: transform 0.32s var(--ease-out);
    overflow: hidden;
}
.notif-overlay.active .notif-modal {
    transform: translateX(0);
}
.notif-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.015);
}
.notif-title-group {
    display: flex;
    align-items: center;
    gap: 8px;
}
.notif-title {
    font-family: var(--font-title);
    font-size: 15px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.notif-dot-indicator {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 8px var(--orange);
    display: none;
}
.notif-dot-indicator.active {
    display: block;
}
.notif-header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}
.notif-mark-all {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--panel-border);
    padding: 5px 10px;
    border-radius: 100px;
    transition: all 0.2s ease;
}
.notif-mark-all:hover {
    color: var(--orange);
    border-color: rgba(255, 77, 0, 0.3);
    background: var(--orange-subtle);
}
.notif-close {
    border: 0;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--panel-border);
    border-radius: 50%;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
}
.notif-close:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.2);
}
.notif-list {
    flex: 1;
    overflow-y: auto;
    padding: 0;
}
.notif-list::-webkit-scrollbar {
    width: 4px;
}
.notif-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
}
.notif-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    background: transparent;
}
.notif-item:last-child {
    border-bottom: none;
}
.notif-item:hover {
    background: rgba(255, 255, 255, 0.03);
}
.notif-item.unread {
    background: rgba(255, 77, 0, 0.035);
}
.notif-item.unread:hover {
    background: rgba(255, 77, 0, 0.06);
}
.notif-avatar {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border-radius: 50%;
    background: var(--orange);
    color: #000;
    font-family: var(--font-title);
    font-size: 13px;
    font-weight: 900;
    display: grid;
    place-items: center;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.1);
}
.notif-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.notif-content {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
}
.notif-text {
    font-size: 13px;
    color: #d0d0d4;
    line-height: 1.4;
    word-break: break-word;
}
.notif-username {
    color: #fff;
    font-weight: 700;
    display: inline-block;
    margin-right: 3px;
}
.notif-time {
    font-size: 11px;
    color: var(--muted-2);
    font-weight: 600;
    letter-spacing: 0.3px;
}

.page{
    width:100%;
    padding:28px 0 90px;
    display:flex;
    justify-content:center;
}
.feed-shell{
    width:100%;
    max-width:var(--feed-width);
    margin:0 auto;
    padding:0 16px;
}

.hero{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:20px;
    padding:0 4px;
}
.hero-title{
    font-family: var(--font-title);
    font-size:32px;
    font-weight:900;
    letter-spacing:-1.2px;
    line-height:1;
}
.hero-title span{color:var(--orange)}
.hero-meta{
    color:var(--muted-2);
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
}

.user-search-wrapper {
    position: relative;
    margin-bottom: 24px;
    z-index: 50;
}
.user-search-input-box {
    position: relative;
    display: flex;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 100px;
    padding: 0 16px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.user-search-input-box:focus-within {
    border-color: rgba(255, 255, 255, 0.25);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}
.search-icon {
    font-size: 14px;
    color: var(--muted);
    margin-right: 10px;
    user-select: none;
    -webkit-user-select: none;
}
.user-search-input {
    width: 100%;
    height: 42px;
    border: 0;
    background: transparent;
    color: #fff;
    font-size: 13px;
    outline: none;
}
.user-search-input::placeholder {
    color: var(--muted-2);
    font-weight: 400;
}
.search-clear-btn {
    display: none;
    background: transparent;
    border: 0;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    padding: 4px;
    margin-left: 6px;
    transition: color 0.2s ease;
}
.search-clear-btn:hover {
    color: #fff;
}
.search-results {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    max-height: 320px;
    overflow-y: auto;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 60;
}
.search-results.active {
    display: block;
}
.search-result-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    transition: background-color 0.2s ease;
}
.search-result-item:last-child {
    border-bottom: none;
}
.search-result-item:hover {
    background: rgba(255, 255, 255, 0.05);
}
.search-result-avatar {
    width: 36px;
    height: 36px;
    flex: 0 0 36px;
    border-radius: 50%;
    background: var(--orange);
    color: #000;
    font-family: var(--font-title);
    font-size: 12px;
    font-weight: 900;
    display: grid;
    place-items: center;
    overflow: hidden;
}
.search-result-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.search-result-info {
    min-width: 0;
    display: flex;
    flex-direction: column;
}
.search-result-name {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}
.search-result-handle {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}
.search-state-message {
    padding: 24px 20px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.3px;
}

.feed-tabs {
    position: relative;
    display: flex;
    background: rgba(255, 255, 255, 0.03);
    padding: 3px;
    border-radius: 100px;
    border: 1px solid var(--panel-border);
    margin-bottom: 28px;
}
.tab-btn {
    position: relative;
    z-index: 1;
    flex: 1;
    padding: 9px 0;
    background: transparent;
    border: none;
    border-radius: 100px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.25s ease, background-color 0.25s var(--ease-out), transform 0.15s ease, box-shadow 0.25s ease;
    text-align: center;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
}
.tab-btn:hover {
    color: #fff;
}
.tab-btn:active {
    transform: scale(0.97);
}
.tab-btn.active {
    color: #000;
    background: #fff;
    font-weight: 800;
    box-shadow: 0 4px 16px rgba(255, 255, 255, 0.18);
}

.create-card{
    position:relative;
    margin-bottom:32px;
    padding:18px 20px;
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    background: linear-gradient(180deg, rgba(18,18,22,0.7) 0%, rgba(10,10,12,0.85) 100%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: border-color .3s ease, box-shadow .3s ease;
}
.create-card:focus-within{
    border-color: rgba(255, 255, 255, 0.22);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}
.create-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{
    width:40px;height:40px;flex:0 0 40px;
    display:grid;place-items:center;
    border-radius:50%;
    background: linear-gradient(135deg, var(--orange) 0%, #ff8000 100%);
    color:#000;
    font-family: var(--font-title);
    font-size:14px;font-weight:900;
    overflow:hidden;
    box-shadow: 0 2px 10px var(--orange-glow);
    transition: transform 0.25s var(--ease-out);
    user-select: none;
    -webkit-user-select: none;
}
.avatar:hover{
    transform: scale(1.04);
}
.avatar img{
    width:100%;height:100%;object-fit:cover;
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
}
.user-info{min-width:0}
.user-name{font-size:13px;font-weight:700;color:#fff;letter-spacing:-0.01em}
.user-handle{margin-top:2px;color:var(--muted);font-size:11px;font-weight:500}
#postContent{
    width:100%;
    min-height:76px;
    resize:none;
    outline:0;
    border:0;
    background:transparent;
    color:#fff;
    font-size:14px;
    line-height:1.5;
    padding:4px 0;
    caret-color:var(--orange);
}
#postContent::placeholder{color:var(--muted-2);font-weight:400}
.create-image{
    display:none;
    position:relative;
    margin-top:12px;
    border:1px solid var(--panel-border);
    border-radius:12px;
    overflow:hidden;
    background:#000;
}
.create-image.active{display:block}
.create-image img{
    display:block;
    width:100%;
    max-height:420px;
    object-fit:cover;
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
}
.remove-image{
    position:absolute;
    top:10px;right:10px;
    width:28px;height:28px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    color:#fff;
    font-size:16px;
    cursor:pointer;
    display:grid;place-items:center;
    transition: background .2s, transform .2s ease;
}
.remove-image:hover{background:rgba(255,59,48,0.9);transform:scale(1.08)}
.remove-image:active{transform:scale(0.95)}
.create-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
}
.create-tools{display:flex;align-items:center;gap:12px;min-width:0}
.photo-label{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 13px;
    border-radius:100px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--panel-border);
    color:#ccc;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    cursor:pointer;
    transition:all .2s var(--ease-out);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
}
.photo-label:hover{background:rgba(255,255,255,0.09);color:#fff;border-color:rgba(255,255,255,0.22)}
.photo-label:active{transform:scale(0.96)}
#postImageInput{display:none}
#postStatus{color:var(--muted);font-size:11px;font-weight:600}
.publish-button{
    padding:8px 18px;
    border-radius:100px;
    background:var(--orange);
    color:#000;
    font-size:11px;
    font-weight:800;
    letter-spacing:0.6px;
    cursor:pointer;
    transition:all .25s var(--ease-out);
    box-shadow:0 0 14px var(--orange-glow);
}
.publish-button:hover{background:#fff;color:#000;box-shadow:0 0 20px rgba(255,255,255,0.3);transform:translateY(-1px)}
.publish-button:active{transform:translateY(0) scale(0.97)}
.publish-button:disabled{opacity:.4;cursor:wait;box-shadow:none;transform:none}

.feed{display:flex;flex-direction:column;gap:24px}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: translateY(12px) scale(0.99);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.post-card{
    overflow:hidden;
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    background:var(--panel);
    transition: border-color .3s ease, box-shadow .3s ease;
    animation: cardEnter 0.4s var(--ease-out) forwards;
    touch-action: pan-y;
}
.post-card:hover{
    border-color: rgba(255, 255, 255, 0.16);
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
}

.post-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
}
.post-author{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
    cursor:pointer;
    transition: opacity 0.2s ease;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
}
.post-author:hover{
    opacity: 0.88;
}
.post-avatar{
    width:36px;height:36px;flex:0 0 36px;
    display:grid;place-items:center;
    border-radius:50%;
    overflow:hidden;
    background:var(--orange);
    color:#000;
    font-family: var(--font-title);
    font-size:13px;font-weight:900;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    user-select: none;
    -webkit-user-select: none;
}
.post-avatar img{
    width:100%;height:100%;object-fit:cover;
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
}
.post-author-info{min-width:0;display:flex;flex-direction:column}
.post-author-name{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:13.5px;font-weight:700;
    color:#fff;
    letter-spacing:-0.01em;
}
.post-author-handle{
    margin-top:1px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    color:var(--muted);
    font-size:11px;
    font-weight:500;
}
.post-date{color:var(--muted-2);font-size:11px;font-weight:600;letter-spacing:0.5px}

.post-image{
    width:100%;
    background:#000;
    overflow:hidden;
    border-top:1px solid rgba(255, 255, 255, 0.04);
    border-bottom:1px solid rgba(255, 255, 255, 0.04);
    touch-action: pan-y;
    user-select: none;

let notifPollInterval = null;

function showToast(message){
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(window.__fsToast);
    window.__fsToast = setTimeout(() => toast.classList.remove("show"), 2600);
}

function escapeHtml(value){
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

function getInitials(name){
    if(!name) return "F";
    const parts = String(name).trim().split(/\s+/);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function getUserName(user){
    return user?.user_metadata?.full_name ||
           user?.user_metadata?.name ||
           user?.user_metadata?.display_name ||
           "MEMBRO FUORISCHEMA";
}

function getUsername(user){
    return user?.user_metadata?.username ||
           user?.user_metadata?.user_name ||
           user?.user_metadata?.preferred_username ||
           "";
}

function getInstagram(user){
    return user?.user_metadata?.instagram || "";
}

function getAvatar(user){
    return user?.user_metadata?.avatar_url ||
           user?.user_metadata?.picture ||
           user?.user_metadata?.avatar ||
           "";
}

function timeAgo(date){
    const diff = Math.floor((Date.now() - new Date(date).getTime()) / 1000);
    if(diff < 60) return "ora";
    if(diff < 3600) return `${Math.floor(diff/60)}m`;
    if(diff < 86400) return `${Math.floor(diff/3600)}h`;
    if(diff < 604800) return `${Math.floor(diff/86400)}g`;
    return new Date(date).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function setAvatar(element, author){
    if(author?.avatar){
        element.innerHTML = `<img src="${escapeHtml(author.avatar)}" alt="">`;
    }else{
        element.textContent = getInitials(author?.name);
    }
}

async function checkUser(){
    const {data,error} = await supabase.auth.getUser();

    if(error || !data?.user){
        window.location.href = "login.html";
        return false;
    }

    currentUser = data.user;

    let profileAvatar = "";
    const { data: profile } = await supabase
        .from("profiles")
        .select("avatar_url")
        .eq("id", currentUser.id)
        .maybeSingle();

    if (profile && profile.avatar_url) {
        profileAvatar = profile.avatar_url;
    }

    const me = {
        name:getUserName(currentUser),
        username:getUsername(currentUser),
        avatar:profileAvatar || getAvatar(currentUser)
    };

    createUserName.textContent = me.name;
    createUserHandle.textContent = me.username ? `@${me.username}` : "Cosa c'è di nuovo?";
    setAvatar(createAvatar, me);

    updateNotificationBadge();
    loadFeed();

    const urlParams = new URLSearchParams(window.location.search);
    const action = urlParams.get("action");
    
    if (urlParams.get("openNotifications") === "1") {
        openNotifications();
        window.history.replaceState({}, document.title, window.location.pathname);
    } else if (action === "search") {
        setTimeout(() => {
            userSearchInput?.scrollIntoView({ behavior: "smooth", block: "center" });
            userSearchInput?.focus();
        }, 300);
        window.history.replaceState({}, document.title, window.location.pathname);
    } else if (action === "create") {
        setTimeout(() => {
            const card = document.getElementById("createPostCard");
            card?.scrollIntoView({ behavior: "smooth", block: "center" });
            postContent?.focus();
        }, 300);
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    return true;
}

    notifOverlay.classList.remove("active");

async function updateNotificationBadge() {
    if(!currentUser) return;
    try {
        const { count, error } = await supabase
            .from("notifications")
            .select("id", { count: "exact", head: true })
            .eq("user_id", currentUser.id)
            .eq("is_read", false);

        if(!error && count !== null && count > 0) {
            const val = count > 99 ? "99+" : String(count);
            bottomNavBadge.textContent = val;
            bottomNavBadge.classList.add("active");
            if(notifHeaderDot) notifHeaderDot.classList.add("active");
        } else {
            bottomNavBadge.textContent = "0";
            bottomNavBadge.classList.remove("active");
            if(notifHeaderDot) notifHeaderDot.classList.remove("active");
        }
    } catch(err) {
        console.error(err);
    }
}

async function loadNotifications(){
    notifList.innerHTML = `<div class="search-state-message">Caricamento notifiche...</div>`;
    if(!currentUser) return;

    try {
        const { data: notifications, error: notificationsError } = await supabase
            .from("notifications")
            .select("*")
            .eq("user_id", currentUser.id)
            .order("created_at", { ascending: false })
            .limit(30);

        if(notificationsError) throw notificationsError;

        if(!notifications || notifications.length === 0){
            notifList.innerHTML = `<div class="search-state-message">Nessuna notifica ricevuta.</div>`;
            return;
        }

        const actorIds = [...new Set(
            notifications
                .map(n => n.actor_id)
                .filter(Boolean)
        )];

        let actorsById = {};

        if(actorIds.length > 0){
            const { data: actors, error: actorsError } = await supabase
                .from("profiles")
                .select("id,full_name,username,avatar_url")
                .in("id", actorIds);

            if(actorsError) throw actorsError;

            (actors || []).forEach(actor => {
                actorsById[actor.id] = actor;
            });
        }

        notifList.innerHTML = notifications.map(n => {
            const actor = actorsById[n.actor_id] || {};
            const name = actor.full_name || "Membro";
            const avatar = actor.avatar_url;
            const initials = getInitials(name);
            const time = timeAgo(n.created_at);
            const unreadClass = n.is_read ? "" : "unread";

            let actionText = "ha interagito con te.";
            if(n.type === "like") actionText = "ha messo mi piace al tuo post.";
            else if(n.type === "comment") actionText = "ha commentato il tuo post.";
            else if(n.type === "follow") actionText = "ha iniziato a seguirti.";

            const actorUsername = actor.username || name;

            return `
                <div class="notif-item ${unreadClass}" data-id="${n.id}" data-post="${n.post_id || ""}">
                    ${!n.is_read ? '<span class="notif-unread-dot"></span>' : ''}
                    <div class="notif-avatar">
                        ${avatar ? `<img src="${escapeHtml(avatar)}" alt="">` : initials}
                    </div>
                    <div class="notif-content">
                        <div class="notif-text"><span class="notif-username">@${escapeHtml(actorUsername)}</span> ${actionText}</div>
                        <div class="notif-time">${time}</div>
                    </div>
                </div>
            `;
        }).join("");

        notifList.querySelectorAll(".notif-item").forEach(item => {
            item.addEventListener("click", async () => {
                const notifId = item.getAttribute("data-id");
                const postId = item.getAttribute("data-post");

                const { error: markReadError } = await supabase
                    .from("notifications")
                    .update({ is_read: true })
                    .eq("id", notifId)
                    .eq("user_id", currentUser.id);

                if(markReadError){
                    console.error("Errore segnando la notifica come letta:", markReadError);
                }

                item.classList.remove("unread");
                const dot = item.querySelector(".notif-unread-dot");
                if(dot) dot.remove();
                updateNotificationBadge();

                closeNotifications();

                if(postId){
                    const postEl = document.getElementById(`post-${postId}`);
                    if(postEl){
                        postEl.scrollIntoView({ behavior: "smooth", block: "center" });
                        postEl.style.transition = "border-color 0.4s ease";
                        postEl.style.borderColor = "var(--orange)";
                        setTimeout(() => postEl.style.borderColor = "", 1500);
                    }
                }
            });
        });

    } catch(err) {
        console.error("Errore caricamento notifiche:", err);
        notifList.innerHTML = `<div class="search-state-message">Errore nel caricamento delle notifiche.</div>`;
    }
}

async function performUserSearch(query){
    if(!query || query.length === 0){
        searchResults.classList.remove("active");
        searchResults.innerHTML = "";
        return;
    }

    searchResults.classList.add("active");
    searchResults.innerHTML = `<div class="search-state-message">Ricerca in corso...</div>`;

    try {
        const cleanQ = query.replace(/^@/, "");
        const { data, error } = await supabase
            .from("profiles")
            .select("id,full_name,username,avatar_url,bio,instagram")
            .or(`full_name.ilike.%${cleanQ}%,username.ilike.%${cleanQ}%`)
            .limit(15);

        if(error) throw error;

        if(!data || data.length === 0){
            searchResults.innerHTML = `<div class="search-state-message">Nessun utente trovato.</div>`;
            return;
        }

        searchResults.innerHTML = data.map(u => {
            const name = u.full_name || "Membro";
            const username = u.username ? `@${u.username}` : "@member";
            const initials = getInitials(name);
            const avatar = u.avatar_url;

            return `
                <div class="search-result-item" data-id="${u.id}">
                    <div class="search-result-avatar">
                        ${avatar ? `<img src="${escapeHtml(avatar)}" alt="">` : initials}
                    </div>
                    <div class="search-result-info">
                        <span class="search-result-name">${escapeHtml(name)}</span>
                        <span class="search-result-handle">${escapeHtml(username)}</span>
                    </div>
                </div>
            `;
        }).join("");

        searchResults.querySelectorAll(".search-result-item").forEach(item => {
            item.addEventListener("click", () => {
                const userId = item.getAttribute("data-id");
                const targetProfile = data.find(p => p.id === userId);
                if(targetProfile) openProfileModal(targetProfile);
                searchResults.classList.remove("active");
            });
        });

    } catch(err) {
        console.error(err);
        searchResults.innerHTML = `<div class="search-state-message">Errore durante la ricerca.</div>`;
    }
}

function openProfileModal(profile){
    const name = profile.full_name || "Membro FUORISCHEMA";
    const username = profile.username ? `@${profile.username}` : "@member";
    const bio = profile.bio || "Membro FUORISCHEMA.";
    const avatar = profile.avatar_url;
    const initials = getInitials(name);

    modalName.textContent = name;
    modalHandle.textContent = username;
    modalBio.textContent = bio;

    if(avatar){
        modalAvatar.innerHTML = `<img src="${escapeHtml(avatar)}" alt="">`;
    } else {
        modalAvatar.innerHTML = initials;
    }

    if(profile.instagram){
        let ig = profile.instagram.trim();
        if(!ig.startsWith("http")) ig = `https://instagram.com/${ig.replace(/^@/,"")}`;
        instagramLink.href = ig;
        instagramLink.style.display = "flex";
    } else {
        instagramLink.style.display = "none";
    }

    profilePageLink.href = `area-personale.html?id=${profile.id}`;

    profileOverlay.classList.add("active");
    document.body.classList.add("modal-open");
}

    const reader = new FileReader();
    reader.onload = (ev) => {
        selectedImageUrl = ev.target.result;

        postImagePreview.classList.add("active");

publishButton?.addEventListener("click", async () => {
    const content = postContent.value.trim();
    if(!content && !selectedImageFile){
        showToast("Scrivi qualcosa o seleziona una foto.");
        return;
    }

    publishButton.disabled = true;
    postStatus.textContent = "Pubblicazione...";

    try {
        let imageUrl = null;
        if(selectedImageFile){
            const ext = selectedImageFile.name.split(".").pop();
            const filePath = `${currentUser.id}/${Date.now()}.${ext}`;
            const { error: uploadError } = await supabase.storage
                .from("posts")
                .upload(filePath, selectedImageFile);

            if(uploadError) throw uploadError;

            const { data: pubData } = supabase.storage
                .from("posts")
                .getPublicUrl(filePath);

            imageUrl = pubData.publicUrl;
        }

        const { error: insertError } = await supabase
            .from("posts")
            .insert({
                user_id: currentUser.id,
                content: content || null,
                image_url: imageUrl
            });

        if(insertError) throw insertError;

        postContent.value = "";
        selectedImageFile = null;
        selectedImageUrl = null;
        previewImage.src = "";
        postImagePreview.classList.remove("active");
        postImageInput.value = "";
        postStatus.textContent = "";
        publishButton.disabled = false;

        showToast("Post pubblicato con successo!");
        loadFeed();

    } catch(err) {
        console.error(err);
        postStatus.textContent = "";
        publishButton.disabled = false;
        showToast("Errore durante la pubblicazione.");
    }
});

async function loadFeed(){
    feed.innerHTML = `
        <div class="empty">
            <div class="empty-icon">◌</div>
            <strong>CARICAMENTO...</strong>
            <span>Stiamo preparando FSocial.</span>
        </div>
    `;

    try {
        const { data: posts, error: postsError } = await supabase
            .from("posts")
            .select("id,content,image_url,created_at,user_id")
            .neq("content", "__FS_STORY__")
            .order("created_at", { ascending: false })
            .limit(60);

        if(postsError) throw postsError;

        if(!posts || posts.length === 0){
            feed.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">❖</div>
                    <strong>NESSUN POST</strong>
                    <span>Sii il primo a lasciare una traccia.</span>
                </div>
            `;
            return;
        }

        const postIds = posts.map(p => p.id);
        const authorIds = [...new Set(posts.map(p => p.user_id).filter(Boolean))];

        let profilesById = {};

        if(authorIds.length > 0){
            const { data: profiles, error: profilesError } = await supabase
                .from("profiles")
                .select("id,full_name,username,avatar_url,bio,instagram")
                .in("id", authorIds);

            if(profilesError) throw profilesError;

            (profiles || []).forEach(profile => {
                profilesById[profile.id] = profile;
            });
        }

        let likesMap = {};
        let userLikesMap = {};
        let commentsCountMap = {};

        if(postIds.length > 0){
            const { data: likesData, error: likesError } = await supabase
                .from("likes")
                .select("post_id, user_id")
                .in("post_id", postIds);

            if(!likesError && likesData){
                likesData.forEach(l => {
                    likesMap[l.post_id] = (likesMap[l.post_id] || 0) + 1;
                    if(currentUser && l.user_id === currentUser.id){
                        userLikesMap[l.post_id] = true;
                    }
                });
            } else if(likesError){
                console.error("Errore caricamento likes:", likesError);
            }

            const { data: commentsData, error: commentsError } = await supabase
                .from("comments")
                .select("post_id")
                .in("post_id", postIds);

            if(!commentsError && commentsData){
                commentsData.forEach(c => {
                    commentsCountMap[c.post_id] = (commentsCountMap[c.post_id] || 0) + 1;
                });
            } else if(commentsError){
                console.error("Errore caricamento conteggio commenti:", commentsError);
            }
        }

        let displayPosts = posts;

        if(currentFeedType === "foryou"){
            /*
             * PER TE:
             * - non è cronologico;
             * - engagement e segnali personali hanno peso reale;
             * - la recenza è un segnale, non il criterio dominante;
             * - la selezione è probabilistica, quindi due refresh possono produrre
             *   sequenze diverse;
             * - viene applicata una forte diversificazione per autore durante la
             *   selezione, non prima.
             */
            const now = Date.now();

            const candidates = posts.map((post) => {
                const ageHours = Math.max(
                    0.25,
                    (now - new Date(post.created_at).getTime()) / 3600000
                );

                const likes = likesMap[post.id] || 0;
                const comments = commentsCountMap[post.id] || 0;
                const likedByMe = userLikesMap[post.id] ? 1 : 0;
                const ownPost = currentUser && post.user_id === currentUser.id ? 1 : 0;

                const freshness = 1 / Math.pow(1 + ageHours / 48, 0.55);
                const engagement =
                    Math.log1p(likes) * 2.8 +
                    Math.log1p(comments) * 3.4;
                const personal = likedByMe * 3.0 - ownPost * 0.25;

                return {
                    post,
                    baseScore: Math.max(
                        0.01,
                        1.5 + freshness * 3.0 + engagement + personal
                    )
                };
            });

            const selected = [];
            const authorCounts = {};

            // Selezione pesata: i post migliori hanno più probabilità di entrare,
            // ma non viene sempre scelto lo stesso primo elemento.
            while(selected.length < 30 && candidates.length){
                let totalWeight = 0;
                const weighted = candidates.map(candidate => {
                    const authorId = candidate.post.user_id || `post-${candidate.post.id}`;
                    const count = authorCounts[authorId] || 0;

                    // Forte diversificazione: dopo il primo post dello stesso autore,
                    // la probabilità scende drasticamente.
                    const diversityMultiplier =
                        count === 0 ? 1.0 :
                        count === 1 ? 0.22 :
                        count === 2 ? 0.07 :
                        0.02;

                    const weight = candidate.baseScore * diversityMultiplier;
                    totalWeight += weight;
                    return { candidate, weight };
                });

                if(totalWeight <= 0){
                    break;
                }

                let random = Math.random() * totalWeight;
                let winnerIndex = 0;

                for(let i = 0; i < weighted.length; i++){
                    random -= weighted[i].weight;
                    if(random <= 0){
                        winnerIndex = i;
                        break;
                    }
                }

                const winner = weighted[winnerIndex].candidate;
                const authorId = winner.post.user_id || `post-${winner.post.id}`;

                selected.push(winner.post);
                authorCounts[authorId] = (authorCounts[authorId] || 0) + 1;
                candidates.splice(winnerIndex, 1);
            }

            displayPosts = selected;
        } else {
            // RECENTI = cronologico puro.
            displayPosts = posts.slice(0, 30);
        }

        feed.innerHTML = displayPosts.map(post => {
            const author = profilesById[post.user_id] || {};
            const name = author.full_name || "Membro FUORISCHEMA";
            const username = author.username ? `@${author.username}` : "@member";
            const avatar = author.avatar_url;
            const initials = getInitials(name);
            const time = timeAgo(post.created_at);
            const isLiked = userLikesMap[post.id] ? "liked" : "";
            const likesCount = likesMap[post.id] || 0;
            const commentsCount = commentsCountMap[post.id] || 0;
            const isOwnPost = currentUser && post.user_id === currentUser.id;

            return `
                <article class="post-card" id="post-${post.id}">
                    <div class="post-header">
                        <div class="post-author" data-author-id="${post.user_id}">
                            <div class="post-avatar">
                                ${avatar ? `<img src="${escapeHtml(avatar)}" alt="">` : initials}
                            </div>
                            <div class="post-author-info">
                                <div class="post-author-name">${escapeHtml(name)}</div>
                                <div class="post-author-handle">${escapeHtml(username)}</div>
                            </div>
                        </div>
                        <div class="post-date">${time}</div>
                    </div>

                    ${post.image_url ? `
                        <div class="post-image">
                            <img src="${escapeHtml(post.image_url)}" alt="Post image" loading="lazy">
                        </div>
                    ` : ""}

                    <div class="post-actions">
                        <button class="action-button like-btn ${isLiked}" data-post-id="${post.id}" type="button">
                            <span class="action-icon">♥</span>
                            <span class="likes-count">${likesCount}</span>
                        </button>
                        <button class="action-button comment-toggle-btn" data-post-id="${post.id}" type="button">
                            <span class="action-icon">💬</span>
                            <span class="comments-count">${commentsCount}</span>
                        </button>
                        ${isOwnPost ? `
                            <button class="delete-button" data-post-id="${post.id}" type="button">ELIMINA</button>
                        ` : ""}
                    </div>

                    ${post.content ? `
                        <div class="post-body">
                            <div class="post-caption">
                                <span class="author-username-inline" data-author-id="${post.user_id}">${escapeHtml(username)}</span>
                                <span class="post-text">${escapeHtml(post.content)}</span>
                            </div>
                        </div>
                    ` : ""}

                    <div class="comments" id="comments-${post.id}">
                        <div class="comments-list" id="comments-list-${post.id}">
                            <div class="search-state-message">Caricamento commenti...</div>
                        </div>
                        <div class="comment-box">
                            <input class="comment-input" id="comment-input-${post.id}" type="text" placeholder="Scrivi un commento..." autocomplete="off">
                            <button class="comment-button comment-submit-btn" data-post-id="${post.id}" type="button">Invia</button>
                        </div>
                    </div>
                </article>
            `;
        }).join("");

        feed.querySelectorAll(".post-author, .author-username-inline").forEach(el => {
            el.addEventListener("click", async () => {
                const authorId = el.getAttribute("data-author-id");
                if(!authorId) return;

                const { data: authorProfile, error: authorError } = await supabase
                    .from("profiles")
                    .select("*")
                    .eq("id", authorId)
                    .maybeSingle();

                if(authorError){
                    console.error("Errore caricamento profilo autore:", authorError);
                    return;
                }

                if(authorProfile) openProfileModal(authorProfile);
            });
        });

        feed.querySelectorAll(".like-btn").forEach(btn => {
            btn.addEventListener("click", async () => {
                const postId = btn.getAttribute("data-post-id");
                if(!currentUser || !postId) return;

                const isLiked = btn.classList.contains("liked");
                const countSpan = btn.querySelector(".likes-count");
                let count = parseInt(countSpan.textContent) || 0;

                if(isLiked){
                    btn.classList.remove("liked");
                    countSpan.textContent = Math.max(0, count - 1);

                    const { error } = await supabase
                        .from("likes")
                        .delete()
                        .eq("post_id", postId)
                        .eq("user_id", currentUser.id);

                    if(error){
                        console.error("Errore rimozione like:", error);
                        btn.classList.add("liked");
                        countSpan.textContent = count;
                    }
                } else {
                    btn.classList.add("liked");
                    countSpan.textContent = count + 1;

                    const { error } = await supabase
                        .from("likes")
                        .insert({ post_id: postId, user_id: currentUser.id });

                    if(error){
                        console.error("Errore aggiunta like:", error);
                        btn.classList.remove("liked");
                        countSpan.textContent = count;
                    }
                }
            });
        });

        feed.querySelectorAll(".comment-toggle-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const postId = btn.getAttribute("data-post-id");
                const commentsSec = document.getElementById(`comments-${postId}`);
                if(!commentsSec) return;

                const isOpen = commentsSec.classList.contains("active");
                if(isOpen){
                    commentsSec.classList.remove("active");
                } else {
                    commentsSec.classList.add("active");
                    loadComments(postId);
                }
            });
        });

        feed.querySelectorAll(".comment-submit-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const postId = btn.getAttribute("data-post-id");
                submitComment(postId);
            });
        });

        feed.querySelectorAll(".comment-input").forEach(input => {
            input.addEventListener("keydown", (e) => {
                if(e.key === "Enter"){
                    const postId = input.getAttribute("id").replace("comment-input-", "");
                    submitComment(postId);
                }
            });
        });

        feed.querySelectorAll(".delete-button").forEach(btn => {
            btn.addEventListener("click", async () => {
                if(!confirm("Vuoi davvero eliminare questo post?")) return;

                const postId = btn.getAttribute("data-post-id");
                const { error } = await supabase
                    .from("posts")
                    .delete()
                    .eq("id", postId);

                if(!error){
                    showToast("Post eliminato");
                    document.getElementById(`post-${postId}`)?.remove();
                } else {
                    console.error("Errore eliminazione post:", error);
                    showToast("Impossibile eliminare il post");
                }
            });
        });

    } catch(err) {
        console.error("Errore caricamento feed:", err);
        feed.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠</div>
                <strong>ERRORE</strong>
                <span>Impossibile caricare il feed.</span>
            </div>
        `;
    }
}

async function loadComments(postId){
    const listEl = document.getElementById(`comments-list-${postId}`);
    if(!listEl) return;

    try {
        const { data: comments, error: commentsError } = await supabase
            .from("comments")
            .select("id,content,created_at,user_id")
            .eq("post_id", postId)
            .order("created_at", { ascending: true });

        if(commentsError) throw commentsError;

        if(!comments || comments.length === 0){
            listEl.innerHTML = `<div class="search-state-message" style="padding:10px;">Nessun commento. Scrivi il primo!</div>`;
            return;
        }

        const authorIds = [...new Set(comments.map(c => c.user_id).filter(Boolean))];
        let profilesById = {};

        if(authorIds.length > 0){
            const { data: profiles, error: profilesError } = await supabase
                .from("profiles")
                .select("id,full_name,username,avatar_url")
                .in("id", authorIds);

            if(profilesError) throw profilesError;

            (profiles || []).forEach(profile => {
                profilesById[profile.id] = profile;
            });
        }

        listEl.innerHTML = comments.map(c => {
            const author = profilesById[c.user_id] || {};
            const name = author.full_name || "Membro";
            const username = author.username ? `@${author.username}` : "@member";
            const avatar = author.avatar_url;
            const initials = getInitials(name);

            return `
                <div class="comment">
                    <div class="comment-avatar">
                        ${avatar ? `<img src="${escapeHtml(avatar)}" alt="">` : initials}
                    </div>
                    <div class="comment-content">
                        <span class="comment-user">${escapeHtml(username)}</span>
                        <span class="comment-text">${escapeHtml(c.content)}</span>
                    </div>
                </div>
            `;
        }).join("");

    } catch(err) {
        console.error("Errore caricamento commenti:", err);
        listEl.innerHTML = `<div class="search-state-message" style="padding:10px;">Errore caricamento commenti.</div>`;
    }
}

async function submitComment(postId){
    const inputEl = document.getElementById(`comment-input-${postId}`);
    if(!inputEl || !currentUser) return;
    const content = inputEl.value.trim();
    if(!content) return;

    inputEl.value = "";
    inputEl.disabled = true;

    try {
        const { error } = await supabase
            .from("comments")
            .insert({
                post_id: postId,
                user_id: currentUser.id,
                content: content
            });

        if(error) throw error;

        inputEl.disabled = false;
        inputEl.focus();
        loadComments(postId);

        const toggleBtn = document.querySelector(`.comment-toggle-btn[data-post-id="${postId}"] .comments-count`);
        if(toggleBtn){
            const current = parseInt(toggleBtn.textContent) || 0;
            toggleBtn.textContent = current + 1;
        }

    } catch(err) {
        console.error(err);
        inputEl.disabled = false;
        showToast("Impossibile inviare il commento.");
    }
}
</script>
</body>
</html>
