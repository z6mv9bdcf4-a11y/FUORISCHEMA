<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSocial — FUORISCHEMA</title>

<style>
:root{
    --bg:#050505;
    --panel:#0c0c0c;
    --panel-2:#111;
    --panel-3:#171717;
    --line:rgba(255,255,255,.09);
    --line-strong:rgba(255,255,255,.15);
    --text:#f5f5f5;
    --muted:#8b8b8b;
    --muted-2:#5c5c5c;
    --orange:#ff4d00;
    --orange-2:#ff6a21;
    --danger:#ff453a;
    --radius:20px;
    --feed:760px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -12%,rgba(255,77,0,.13),transparent 34%),
        var(--bg);
    color:var(--text);
    font-family:Inter,Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
}
body.modal-open{overflow:hidden}
button,input,textarea{font:inherit}
button{border:0}
a{color:inherit}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    background:rgba(5,5,5,.84);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
}
.brand{
    text-decoration:none;
    font-size:21px;
    font-weight:1000;
    letter-spacing:-1.6px;
}
.brand-white{color:#fff}
.brand-orange{color:var(--orange)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.top-btn{
    min-height:38px;
    padding:0 15px;
    border:1px solid var(--line-strong);
    border-radius:11px;
    background:transparent;
    color:#fff;
    text-decoration:none;
    font-size:10px;
    font-weight:900;
    letter-spacing:1.4px;
    text-transform:uppercase;
    cursor:pointer;
    transition:.2s ease;
}
.top-btn:hover{border-color:var(--orange);color:var(--orange)}
.top-btn.primary{background:#fff;color:#050505;border-color:#fff}
.top-btn.primary:hover{background:var(--orange);border-color:var(--orange)}

.page{
    width:100%;
    padding:34px 16px 90px;
}
.feed-shell{
    width:min(100%,var(--feed));
    margin:0 auto;
}

.hero{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:22px;
}
.hero-title{
    font-size:clamp(44px,7vw,68px);
    line-height:.88;
    font-weight:1000;
    letter-spacing:-4.5px;
}
.hero-title span{color:var(--orange)}
.hero-meta{
    padding-bottom:5px;
    color:#777;
    font-size:9px;
    font-weight:900;
    letter-spacing:3px;
    text-transform:uppercase;
    text-align:right;
}

.section-label{
    display:flex;
    align-items:center;
    gap:12px;
    margin:0 2px 12px;
}
.section-label strong{
    color:#eee;
    font-size:9px;
    font-weight:1000;
    letter-spacing:2.4px;
    text-transform:uppercase;
}
.section-label i{height:1px;flex:1;background:var(--line);font-style:normal}

.stories-wrap{
    position:relative;
    margin-bottom:18px;
}
.stories{
    display:flex;
    gap:16px;
    overflow-x:auto;
    padding:4px 4px 12px;
    scrollbar-width:none;
    overscroll-behavior-x:contain;
}
.stories::-webkit-scrollbar{display:none}
.story{
    width:76px;
    flex:0 0 76px;
    text-align:center;
    cursor:pointer;
    user-select:none;
}
.story-ring{
    width:72px;
    height:72px;
    margin:0 auto 7px;
    padding:3px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--orange-2),var(--orange),#ff2500);
    box-shadow:0 8px 26px rgba(255,77,0,.12);
}
.story-ring.seen{background:#383838}
.story-avatar{
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    border:3px solid var(--bg);
    border-radius:50%;
    overflow:hidden;
    background:#191919;
    color:#111;
    font-size:20px;
    font-weight:1000;
}
.story-avatar img{width:100%;height:100%;object-fit:cover}
.story-add .story-avatar{background:var(--orange);color:#090909;font-size:28px}
.story.is-loading{opacity:.55;pointer-events:none}.story-add{cursor:pointer}
.story-name{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    color:#aaa;
    font-size:9px;
    font-weight:800;
}
.story-empty{
    color:#666;
    font-size:10px;
    padding:18px 0;
}

.create-card{
    position:relative;
    margin-bottom:25px;
    padding:19px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:
        linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
    overflow:hidden;
}
.create-card:before{
    content:"";
    position:absolute;
    inset:0 18% auto;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--orange),transparent);
}
.create-top{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.avatar{
    width:42px;height:42px;flex:0 0 42px;
    display:grid;place-items:center;
    border-radius:50%;
    background:var(--orange);
    color:#080808;
    font-size:14px;font-weight:1000;
    overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.user-info{min-width:0}
.user-name{font-size:13px;font-weight:900}
.user-handle{margin-top:3px;color:var(--muted);font-size:10px}
#postContent{
    width:100%;
    min-height:92px;
    resize:vertical;
    outline:0;
    border:0;
    background:transparent;
    color:#fff;
    font-size:16px;
    line-height:1.55;
    padding:4px 0;
    caret-color:var(--orange);
}
#postContent::placeholder{color:#555}
.create-image{
    display:none;
    position:relative;
    margin-top:12px;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    background:#080808;
}
.create-image.active{display:block}
.create-image img{
    display:block;
    width:100%;
    max-height:500px;
    object-fit:contain;
    background:#080808;
}
.remove-image{
    position:absolute;
    top:10px;right:10px;
    width:34px;height:34px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:50%;
    background:rgba(0,0,0,.72);
    color:#fff;
    font-size:20px;
    cursor:pointer;
}
.create-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:14px;
    padding-top:13px;
    border-top:1px solid var(--line);
}
.create-tools{display:flex;align-items:center;gap:8px;min-width:0}
.photo-label{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:9px 12px;
    border-radius:9px;
    background:var(--panel-3);
    color:#bbb;
    font-size:9px;
    font-weight:900;
    letter-spacing:.8px;
    cursor:pointer;
    transition:.2s ease;
}
.photo-label:hover{background:#202020;color:#fff}
#postImageInput{display:none}
#postStatus{color:var(--muted);font-size:9px;font-weight:800}
.publish-button{
    min-width:106px;
    padding:12px 18px;
    border-radius:10px;
    background:var(--orange);
    color:#080808;
    font-size:10px;
    font-weight:1000;
    letter-spacing:1px;
    cursor:pointer;
    transition:.2s ease;
}
.publish-button:hover{background:#fff;transform:translateY(-1px)}
.publish-button:disabled{opacity:.5;cursor:wait;transform:none}

.feed{display:flex;flex-direction:column;gap:16px}

.post-card{
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--panel);
    box-shadow:0 16px 45px rgba(0,0,0,.12);
    transition:border-color .2s ease,transform .2s ease;
}
.post-card:hover{border-color:var(--line-strong)}
.post-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:15px 17px 13px;
}
.post-author{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
    cursor:pointer;
}
.post-avatar{
    width:42px;height:42px;flex:0 0 42px;
    display:grid;place-items:center;
    border-radius:50%;
    overflow:hidden;
    background:var(--orange);
    color:#080808;
    font-size:14px;font-weight:1000;
}
.post-avatar img{width:100%;height:100%;object-fit:cover}
.post-author-info{min-width:0}
.post-author-name{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:13px;font-weight:900;
    transition:color .2s ease;
}
.post-author:hover .post-author-name{color:var(--orange)}
.post-author-handle{
    margin-top:3px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    color:var(--muted);
    font-size:10px;
}
.post-date{color:var(--muted-2);font-size:9px;font-weight:700;white-space:nowrap}

.post-image{
    width:100%;
    max-height:760px;
    background:#080808;
    border-top:1px solid rgba(255,255,255,.035);
    border-bottom:1px solid rgba(255,255,255,.035);
}
.post-image img{
    display:block;
    width:100%;
    max-height:760px;
    object-fit:contain;
    background:#080808;
}
.post-body{padding:16px 17px 6px}
.post-caption{
    position:relative;
    padding:13px 14px 14px 16px;
    border-left:2px solid var(--orange);
    border-radius:0 12px 12px 0;
    background:linear-gradient(90deg,rgba(255,77,0,.055),rgba(255,255,255,.012));
}
.post-caption-label{
    margin-bottom:7px;
    color:#666;
    font-size:8px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
}
.post-text{
    color:#f0f0f0;
    font-size:14px;
    line-height:1.58;
    white-space:pre-wrap;
    word-break:break-word;
}
.post-actions{
    display:flex;
    align-items:center;
    gap:2px;
    padding:9px 10px 2px;
}
.action-button{
    display:inline-flex;
    align-items:center;
    gap:6px;
    min-height:34px;
    padding:7px 9px;
    border-radius:9px;
    background:transparent;
    color:#888;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
    transition:.16s ease;
}
.action-button:hover{background:#171717;color:#fff}
.action-button:active{transform:scale(.95)}
.action-button.liked{color:var(--orange)}
.action-icon{font-size:18px;line-height:1}
.like-count,.comment-count{font-size:10px}
.delete-button{margin-left:auto;color:#686868}
.delete-button:hover{color:var(--danger);background:rgba(255,69,58,.07)}
.post-meta{
    padding:4px 17px 15px;
    color:#666;
    font-size:9px;
}
.post-meta strong{color:#ddd;font-weight:800}

.comments{
    display:none;
    margin:0 17px 15px;
    padding-top:13px;
    border-top:1px solid var(--line);
}
.comments.active{display:block}
.comments-list{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.comment{display:flex;gap:8px}
.comment-avatar{
    width:28px;height:28px;flex:0 0 28px;
    display:grid;place-items:center;
    overflow:hidden;
    border-radius:50%;
    background:var(--orange);
    color:#080808;
    font-size:8px;font-weight:1000;
}
.comment-avatar img{width:100%;height:100%;object-fit:cover}
.comment-content{
    min-width:0;
    flex:1;
    padding:8px 10px;
    border-radius:11px;
    background:#121212;
}
.comment-user{font-size:9px;font-weight:900}
.comment-text{margin-top:3px;color:#aaa;font-size:11px;line-height:1.4;word-break:break-word}
.comment-box{display:flex;gap:7px}
.comment-input{
    min-width:0;
    flex:1;
    outline:0;
    border:1px solid var(--line);
    border-radius:10px;
    background:#090909;
    color:#fff;
    padding:10px 11px;
    font-size:11px;
}
.comment-input:focus{border-color:rgba(255,77,0,.55)}
.comment-button{
    width:40px;
    border-radius:10px;
    background:var(--orange);
    color:#080808;
    font-weight:1000;
    cursor:pointer;
}
.comment-button:disabled{opacity:.5}

.empty{
    padding:58px 25px;
    border:1px dashed var(--line-strong);
    border-radius:var(--radius);
    background:rgba(255,255,255,.012);
    text-align:center;
}
.empty-icon{margin-bottom:12px;color:var(--orange);font-size:28px}
.empty strong{display:block;margin-bottom:6px;font-size:15px;font-weight:1000}
.empty span{color:var(--muted);font-size:10px}

.social-footer{
    display:flex;
    justify-content:space-between;
    margin-top:38px;
    padding-top:20px;
    border-top:1px solid var(--line);
    color:#454545;
    font-size:8px;
    font-weight:900;
    letter-spacing:2px;
}

/* Profile modal */
.profile-overlay,.story-viewer{
    position:fixed;
    inset:0;
    z-index:99999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.94);
}
.profile-overlay.active,.story-viewer.show{display:flex}
.profile-modal{
    position:relative;
    width:min(100%,430px);
    padding:28px;
    border:1px solid var(--line-strong);
    border-radius:24px;
    background:linear-gradient(145deg,#131313,#080808);
    box-shadow:0 30px 100px rgba(0,0,0,.75);
}
.profile-close,.story-viewer-delete{
    position:absolute;
    right:24px;
    bottom:24px;
    z-index:100001;
    border:1px solid rgba(255,255,255,.22);
    border-radius:12px;
    background:#ff4d00;
    color:#050505;
    padding:12px 18px;
    font-size:11px;
    font-weight:900;
    letter-spacing:1.5px;
    cursor:pointer;
}

.story-viewer-delete:disabled{
    opacity:.6;
    cursor:not-allowed;
}
.story-nav{
    position:absolute;
    top:50%;
    z-index:20;
    width:48px;
    height:72px;
    transform:translateY(-50%);
    display:grid;
    place-items:center;
    border:1px solid rgba(255,255,255,.16);
    border-radius:14px;
    background:rgba(0,0,0,.48);
    color:#fff;
    font-size:42px;
    line-height:1;
    cursor:pointer;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:.18s ease;
}
.story-nav:hover{background:var(--orange);border-color:var(--orange);color:#050505}
.story-nav:disabled{opacity:.16;pointer-events:none}
.story-prev{left:12px}
.story-next{right:12px}
.story-viewer-delete{
    right:16px;
    bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:25;
    min-width:138px;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
}

.story-viewer-close{
    position:absolute;
    top:13px;right:13px;
    z-index:5;
    width:35px;height:35px;
    display:grid;place-items:center;
    border:1px solid var(--line);
    border-radius:50%;
    background:#111;
    color:#aaa;
    font-size:20px;
    cursor:pointer;
}
.profile-close:hover,.story-viewer-close:hover{color:#fff;border-color:var(--orange)}
.profile-modal-top{text-align:center}
.profile-modal-avatar{
    width:92px;height:92px;
    margin:3px auto 14px;
    display:grid;place-items:center;
    overflow:hidden;
    border-radius:50%;
    background:var(--orange);
    color:#080808;
    font-size:29px;font-weight:1000;
    box-shadow:0 0 0 5px rgba(255,77,0,.08);
}
.profile-modal-avatar img{width:100%;height:100%;object-fit:cover}
.profile-modal-name{font-size:24px;font-weight:1000;letter-spacing:-1px}
.profile-modal-handle{margin-top:4px;color:var(--muted);font-size:11px}
.profile-modal-bio{margin-top:18px;color:#aaa;font-size:12px;line-height:1.6}
.profile-social{display:flex;gap:8px;margin-top:22px}
.profile-social a{
    flex:1;
    min-height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--line-strong);
    border-radius:10px;
    background:#111;
    color:#fff;
    text-decoration:none;
    font-size:9px;
    font-weight:900;
    letter-spacing:.8px;
}
.profile-social a:hover{border-color:var(--orange);color:var(--orange)}
.profile-social .instagram{background:var(--orange);border-color:var(--orange);color:#080808}
.profile-social .instagram:hover{background:#fff;border-color:#fff}

.story-viewer{
    padding:0;
    background:rgba(0,0,0,.96);
}
.story-viewer-content{
    position:relative;
    position:relative;
    z-index:100000;
    width:min(100vw,520px);
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#080808;
}
.story-viewer-image{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#080808;
    user-select:none;
    -webkit-user-drag:none;
}
.story-viewer-header{
    position:absolute;
    top:0;left:0;right:0;
    z-index:3;
    display:flex;
    align-items:center;
    gap:10px;
    padding:20px 58px 20px 18px;
    background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);
}
.story-viewer-avatar{
    width:34px;height:34px;
    display:grid;place-items:center;
    overflow:hidden;
    border-radius:50%;
    background:var(--orange);
    color:#080808;
    font-size:10px;font-weight:1000;
}
.story-viewer-name{font-size:12px;font-weight:900}
.story-viewer-close{
    top:16px;right:16px;
    z-index:100001;
    background:rgba(255,255,255,.92);
    border-color:transparent;
    color:#050505;
}

/* subtle loading state */
.is-loading{opacity:.6;pointer-events:none}

@media (min-width:900px){
    .page{padding-top:40px}
    .feed-shell{width:min(100%,760px)}
    .post-card{border-radius:22px}
}
@media (max-width:700px){
    .topbar{height:62px;padding:0 10px}
    .brand{font-size:18px}
    .topbar-actions{gap:5px}
    .top-btn{min-height:34px;padding:0 9px;font-size:8px}
    .story-nav{width:40px;height:58px;font-size:34px}
    .story-prev{left:7px}
    .story-next{right:7px}
    .story-viewer-delete{
        right:50%;
        bottom:calc(14px + env(safe-area-inset-bottom));
        transform:translateX(50%);
        min-width:145px;
        padding:11px 15px;
        font-size:10px;
    }
    .page{padding:24px 9px 75px}
    .hero{align-items:flex-start;flex-direction:column;gap:8px;margin-bottom:18px}
    .hero-title{font-size:48px;letter-spacing:-3px}
    .hero-meta{text-align:left;padding:0}
    .stories{gap:13px}
    .story{width:70px;flex-basis:70px}
    .story-ring{width:66px;height:66px}
    .create-card,.post-card{border-radius:16px}
    .create-card{padding:16px}
    #postContent{min-height:76px;font-size:15px}
    .post-header{padding:13px 13px 11px}
    .post-body{padding:13px 13px 3px}
    .post-meta{padding:4px 13px 13px}
    .comments{margin-left:13px;margin-right:13px}
    .post-image,.post-image img{max-height:620px}
    .social-footer{flex-direction:column;gap:8px}
}
@media (max-width:390px){
    .topbar-actions{gap:4px}
    .top-btn{padding:0 8px}
    .hero-title{font-size:43px}
    .create-footer{align-items:flex-end}
    .create-tools{flex-wrap:wrap}
}
</style>
</head>

<body>

<header class="topbar">
    <a href="index.html" class="brand">
        <span class="brand-white">FUORI</span><span class="brand-orange">SCHEMA</span>
    </a>
    <div class="topbar-actions">
        <a href="index.html" class="top-btn home-btn">HOME</a>
        <a href="area-personale.html" class="top-btn">PROFILO</a>
        <button id="logoutButton" class="top-btn primary" type="button">ESCI</button>
    </div>
</header>

<main class="page">
    <div class="feed-shell">

        <section class="hero">
            <div class="hero-title">F<span>Social</span></div>
            <div class="hero-meta">FUORISCHEMA PEOPLE<br>COMMUNITY / 01</div>
        </section>

        <div class="section-label">
            <strong>STORIE</strong><i></i>
        </div>

        <section class="stories-wrap">
            <div id="stories" class="stories"></div>
        </section>

        <section class="create-card">
            <div class="create-top">
                <div id="createAvatar" class="avatar">F</div>
                <div class="user-info">
                    <div id="createUserName" class="user-name">FUORISCHEMA MEMBER</div>
                    <div id="createUserHandle" class="user-handle">Condividi qualcosa</div>
                </div>
            </div>

            <textarea id="postContent" placeholder="Cosa stai facendo?"></textarea>

            <div id="postImagePreview" class="create-image">
                <img id="previewImage" src="" alt="Anteprima">

<script type="module">
import { supabase } from "./supabase.js";

/* =========================================================
   ELEMENTS
========================================================= */
const feed = document.getElementById("feed");
const stories = document.getElementById("stories");
const postContent = document.getElementById("postContent");
const publishButton = document.getElementById("publishButton");
const postStatus = document.getElementById("postStatus");
const logoutButton = document.getElementById("logoutButton");
const postImageInput = document.getElementById("postImageInput");
const postImagePreview = document.getElementById("postImagePreview");
const previewImage = document.getElementById("previewImage");
const removeImageButton = document.getElementById("removeImageButton");
const createAvatar = document.getElementById("createAvatar");
const createUserName = document.getElementById("createUserName");
const createUserHandle = document.getElementById("createUserHandle");

const profileOverlay = document.getElementById("profileOverlay");
const profileClose = document.getElementById("profileClose");
const modalAvatar = document.getElementById("modalAvatar");
const modalName = document.getElementById("modalName");
const modalHandle = document.getElementById("modalHandle");
const modalBio = document.getElementById("modalBio");
const instagramLink = document.getElementById("instagramLink");
const profilePageLink = document.getElementById("profilePageLink");

const storyViewer = document.getElementById("storyViewer");
const storyViewerClose = document.getElementById("storyViewerClose");
const storyViewerImage = document.getElementById("storyViewerImage");
const storyViewerDelete = document.getElementById("storyViewerDelete");
const storyViewerName = document.getElementById("storyViewerName");
let storyViewerCurrentStory = null;
let storyViewerCurrentAuthor = null;
const storyViewerAvatar = document.getElementById("storyViewerAvatar");
const storyPrevButton = document.getElementById("storyPrevButton");
const storyNextButton = document.getElementById("storyNextButton");

const toast = document.getElementById("toast");

/* =========================================================
   STATE
========================================================= */
let currentUser = null;
let selectedImageFile = null;
let selectedImageUrl = null;
const storyCache = new Map();
const STORY_MARKER = "__FS_STORY__";
let activeStories = [];
let activeStoryIndex = 0;

/* =========================================================
   HELPERS
========================================================= */
function showToast(message){
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(window.__fsToast);
    window.__fsToast = setTimeout(() => toast.classList.remove("show"), 2600);
}

function escapeHtml(value){
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

function getInitials(name){
    if(!name) return "F";
    const parts = String(name).trim().split(/\s+/);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function getUserName(user){
    return user?.user_metadata?.full_name ||
           user?.user_metadata?.name ||
           user?.user_metadata?.display_name ||
           "MEMBRO FUORISCHEMA";
}

function getUsername(user){
    return user?.user_metadata?.username ||
           user?.user_metadata?.user_name ||
           user?.user_metadata?.preferred_username ||
           "";
}

function getInstagram(user){
    return user?.user_metadata?.instagram || "";
}

function getAvatar(user){
    return user?.user_metadata?.avatar_url ||
           user?.user_metadata?.picture ||
           user?.user_metadata?.avatar ||
           "";
}

function timeAgo(date){
    const diff = Math.floor((Date.now() - new Date(date).getTime()) / 1000);
    if(diff < 60) return "ora";
    if(diff < 3600) return `${Math.floor(diff/60)} min`;
    if(diff < 86400) return `${Math.floor(diff/3600)} h`;
    if(diff < 604800) return `${Math.floor(diff/86400)} g`;
    return new Date(date).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function fileExtension(file){
    const ext = file.name.split(".").pop()?.toLowerCase();
    return ext && /^[a-z0-9]+$/.test(ext) ? ext : "jpg";
}

function setAvatar(element, author){
    if(author?.avatar){
        element.innerHTML = `<img src="${escapeHtml(author.avatar)}" alt="">`;
    }else{
        element.textContent = getInitials(author?.name);
    }
}

/* =========================================================
   AUTH
========================================================= */
async function checkUser(){
    const {data,error} = await supabase.auth.getUser();

    if(error || !data?.user){
        window.location.href = "login.html";
        return false;
    }

    currentUser = data.user;

    const me = {
        name:getUserName(currentUser),
        username:getUsername(currentUser),
        avatar:getAvatar(currentUser)
    };

    createUserName.textContent = me.name;
    createUserHandle.textContent = me.username ? `@${me.username}` : "Condividi qualcosa";
    setAvatar(createAvatar, me);

    return true;
}

logoutButton.addEventListener("click", async () => {
    logoutButton.disabled = true;
    await supabase.auth.signOut();
    window.location.href = "index.html";
});

/* =========================================================
   IMAGE POST
========================================================= */
postImageInput.addEventListener("change", () => {
    const file = postImageInput.files?.[0];
    if(!file) return;

    if(!file.type.startsWith("image/")){
        showToast("Seleziona una foto.");
        postImageInput.value = "";
        return;
    }

    if(file.size > 10 * 1024 * 1024){
        showToast("La foto è troppo grande. Massimo 10 MB.");
        postImageInput.value = "";
        return;
    }

    selectedImageFile = file;

    if(selectedImageUrl) URL.revokeObjectURL(selectedImageUrl);
    selectedImageUrl = URL.createObjectURL(file);

    previewImage.src = selectedImageUrl;
    postImagePreview.classList.add("active");
});

removeImageButton.addEventListener("click", () => {
    selectedImageFile = null;
    postImageInput.value = "";

    if(selectedImageUrl) URL.revokeObjectURL(selectedImageUrl);
    selectedImageUrl = null;

    previewImage.src = "";
    postImagePreview.classList.remove("active");
});

async function uploadPostImage(file){
    const path = `${currentUser.id}/${Date.now()}-${crypto.randomUUID()}.${fileExtension(file)}`;

    const {error} = await supabase.storage
        .from("post-images")
        .upload(path,file,{cacheControl:"3600",upsert:false});

    if(error) throw new Error("Non riesco a caricare la foto: " + error.message);

    const {data} = supabase.storage.from("post-images").getPublicUrl(path);
    return data?.publicUrl || null;
}

publishButton.addEventListener("click", async () => {
    if(!currentUser){
        showToast("Devi essere loggato.");
        return;
    }

    const content = postContent.value.trim();
    if(!content && !selectedImageFile){
        showToast("Scrivi qualcosa o aggiungi una foto.");
        return;
    }

    publishButton.disabled = true;
    postStatus.textContent = "Pubblicazione...";

    try{
        let imageUrl = null;
        if(selectedImageFile) imageUrl = await uploadPostImage(selectedImageFile);

        const postData = {
            user_id: currentUser.id,
            content
        };
        if(imageUrl) postData.image_url = imageUrl;

        const {error} = await supabase.from("posts").insert(postData);
        if(error) throw error;

        postContent.value = "";
        selectedImageFile = null;
        postImageInput.value = "";

        if(selectedImageUrl) URL.revokeObjectURL(selectedImageUrl);
        selectedImageUrl = null;
        previewImage.src = "";
        postImagePreview.classList.remove("active");

        postStatus.textContent = "Pubblicato.";
        showToast("Post pubblicato 🔥");
        await loadFeed();
    }catch(error){
        console.error(error);
        postStatus.textContent = "Errore";
        showToast(error.message || "Errore durante la pubblicazione.");
    }finally{
        publishButton.disabled = false;
    }
});

/* =========================================================
   PROFILES
========================================================= */
async function getProfile(userId){
    if(!userId) return null;

    const {data,error} = await supabase
        .from("profiles")
        .select("id,username,full_name,instagram,avatar_url,bio")
        .eq("id",userId)
        .maybeSingle();

    if(error){
        console.warn("Profilo non disponibile:",error.message);
        return null;
    }
    return data || null;
}

async function resolveAuthor(userId){
    const profile = await getProfile(userId);

    if(profile){
        return {
            id:profile.id,
            name:profile.full_name || profile.username || "MEMBRO FUORISCHEMA",
            username:profile.username || "",
            instagram:profile.instagram || "",
            avatar:profile.avatar_url || "",
            bio:profile.bio || "Membro FUORISCHEMA."
        };
    }

    if(currentUser && userId === currentUser.id){
        return {
            id:currentUser.id,
            name:getUserName(currentUser),
            username:getUsername(currentUser),
            instagram:getInstagram(currentUser),
            avatar:getAvatar(currentUser),
            bio:"Membro FUORISCHEMA."
        };
    }

    return {
        id:userId,
        name:"MEMBRO FUORISCHEMA",
        username:"",
        instagram:"",
        avatar:"",
        bio:"Membro FUORISCHEMA."
    };
}

function openProfile(author){
    setAvatar(modalAvatar,author);
    modalName.textContent = author.name;
    modalHandle.textContent = author.username ? `@${author.username}` : "Membro FUORISCHEMA";
    modalBio.textContent = author.bio || "Membro FUORISCHEMA.";

    if(author.instagram){
        const username = author.instagram.replace(/^@/,"").trim();
        instagramLink.href = `https://instagram.com/${encodeURIComponent(username)}`;
        instagramLink.style.display = "flex";
    }else{
        instagramLink.href = "#";
        instagramLink.style.display = "none";
    }

    profilePageLink.href = author?.id ? `area-personale.html?id=${encodeURIComponent(author.id)}` : "area-personale.html";
    profileOverlay.classList.add("active");
    profileOverlay.style.display = "flex";
    document.body.classList.add("modal-open");
}

function closeProfile(){
    profileOverlay.classList.remove("active");
    profileOverlay.style.display = "none";
    if(!storyViewer.classList.contains("show")) document.body.classList.remove("modal-open");
}

profileClose.addEventListener("click",closeProfile);
profileOverlay.addEventListener("click",event => {
    if(event.target === profileOverlay) closeProfile();
});

/* =========================================================
   FEED
========================================================= */
async function loadFeed(){
    feed.innerHTML = `
        <div class="empty">
            <div class="empty-icon">◌</div>
            <strong>CARICAMENTO...</strong>
            <span>Stiamo preparando FSocial.</span>
        </div>
    `;

    const {data:rawPosts,error} = await supabase
        .from("posts")
        .select("*")
        .order("created_at",{ascending:false});

    const posts = (rawPosts || []).filter(post => post.content !== STORY_MARKER);

    if(error){
        console.error(error);
        feed.innerHTML = `
            <div class="empty">
                <div class="empty-icon">!</div>
                <strong>ERRORE NEL FEED</strong>
                <span>${escapeHtml(error.message)}</span>
            </div>
        `;
        await loadStories([]);
        return;
    }

    if(!posts?.length){
        feed.innerHTML = `
            <div class="empty">
                <div class="empty-icon">◎</div>
                <strong>IL FEED È VUOTO</strong>
                <span>Sii il primo a lasciare il tuo segno.</span>
            </div>
        `;
        await loadStories([]);
        return;
    }

    feed.innerHTML = "";

    const authors = await Promise.all(posts.map(post => resolveAuthor(post.user_id)));
    await Promise.all(posts.map((post,index) => renderPost(post,authors[index])));

    await loadStories(posts,authors);
}

async function renderPost(post,author){
    const article = document.createElement("article");
    article.className = "post-card";

    const avatarHtml = author.avatar
        ? `<img src="${escapeHtml(author.avatar)}" alt="">`
        : escapeHtml(getInitials(author.name));

    const imageHtml = post.image_url ? `
        <div class="post-image">
            <img src="${escapeHtml(post.image_url)}" alt="Post FUORISCHEMA" loading="lazy">
        </div>
    ` : "";

    article.innerHTML = `
        <div class="post-header">
            <div class="post-author author-profile-trigger">
                <div class="post-avatar">${avatarHtml}</div>
                <div class="post-author-info">
                    <div class="post-author-name">${escapeHtml(author.name)}</div>
                    <div class="post-author-handle">${author.username ? "@"+escapeHtml(author.username) : "Membro FUORISCHEMA"}</div>
                </div>
            </div>
            <div class="post-date" title="${new Date(post.created_at).toLocaleString("it-IT")}">${escapeHtml(timeAgo(post.created_at))}</div>
        </div>

        ${imageHtml}

        ${post.content ? `
            <div class="post-body">
                <div class="post-caption">
                    <div class="post-caption-label">CAPTION</div>
                    <div class="post-text">${escapeHtml(post.content)}</div>
                </div>
            </div>
        ` : ""}

        <div class="post-actions">
            <button class="action-button like-button" type="button">
                <span class="action-icon">♡</span>
                <span class="like-count">0</span>
            </button>

            <button class="action-button comment-toggle" type="button">
                <span class="action-icon">○</span>
                <span class="comment-count">0</span>
            </button>

            <button class="action-button share-button" type="button">
                <span class="action-icon">↗</span>
                <span>CONDIVIDI</span>
            </button>

            ${post.user_id === currentUser.id ? `
                <button class="action-button delete-button" type="button">ELIMINA</button>
            ` : ""}
        </div>

        <div class="post-meta">
            <strong>${escapeHtml(author.name)}</strong>${author.username ? ` · @${escapeHtml(author.username)}` : ""}
        </div>

        <div class="comments" id="comments-${escapeHtml(post.id)}">
            <div class="comments-list"></div>
            <div class="comment-box">
                <input class="comment-input" type="text" maxlength="500" placeholder="Aggiungi un commento...">
                <button class="comment-button" type="button">→</button>
            </div>
        </div>
    `;

    feed.appendChild(article);

    const likeButton = article.querySelector(".like-button");
    const commentButton = article.querySelector(".comment-toggle");
    const deleteButton = article.querySelector(".delete-button");
    const shareButton = article.querySelector(".share-button");
    const addCommentButton = article.querySelector(".comment-button");
    const input = article.querySelector(".comment-input");
    const authorTrigger = article.querySelector(".author-profile-trigger");

    likeButton.addEventListener("click",() => toggleLike(post.id,likeButton));
    commentButton.addEventListener("click",() => toggleComments(post.id,article));
    addCommentButton.addEventListener("click",() => addComment(post.id,article));
    input.addEventListener("keydown",event => {
        if(event.key === "Enter"){
            event.preventDefault();
            addComment(post.id,article);
        }
    });
    authorTrigger.addEventListener("click",(event) => {
        event.preventDefault();
        event.stopPropagation();
        openProfile(author);
    });

    if(deleteButton){
        deleteButton.addEventListener("click",() => deletePost(post.id));
    }

    shareButton.addEventListener("click",async () => {
        const url = `${location.origin}${location.pathname}#post-${post.id}`;
        try{
            await navigator.clipboard.writeText(url);
            showToast("Link del post copiato.");
        }catch{
            showToast("Non posso copiare il link da questo browser.");
        }
    });

    await Promise.all([
        updateLikeState(post.id,likeButton),
        updateCommentCount(post.id,commentButton)
    ]);
}

/* =========================================================
   LIKES
========================================================= */
async function updateLikeState(postId,button){
    try{
        const {count} = await supabase
            .from("post_likes")
            .select("id",{count:"exact",head:true})
            .eq("post_id",postId);

        button.querySelector(".like-count").textContent = count || 0;

        const {data:existing} = await supabase
            .from("post_likes")
            .select("id")
            .eq("post_id",postId)
            .eq("user_id",currentUser.id)
            .maybeSingle();

        if(existing){
            button.classList.add("liked");
            button.querySelector(".action-icon").textContent = "♥";
        }
    }catch(error){
        console.error("Errore stato like:",error);
    }
}

async function toggleLike(postId,button){
    if(!currentUser){
        showToast("Devi essere loggato.");
        return;
    }
    if(button.disabled) return;

    button.disabled = true;

    try{
        const {data:existing,error:checkError} = await supabase
            .from("post_likes")
            .select("id")
            .eq("post_id",postId)
            .eq("user_id",currentUser.id)
            .maybeSingle();

        if(checkError) throw checkError;

        if(existing){
            const {error} = await supabase
                .from("post_likes")
                .delete()
                .eq("id",existing.id);
            if(error) throw error;

            button.classList.remove("liked");
            button.querySelector(".action-icon").textContent = "♡";
        }else{
            const {error} = await supabase
                .from("post_likes")
                .insert({post_id:postId,user_id:currentUser.id});
            if(error) throw error;

            button.classList.add("liked");
            button.querySelector(".action-icon").textContent = "♥";
        }

        const {count} = await supabase
            .from("post_likes")
            .select("id",{count:"exact",head:true})
            .eq("post_id",postId);

        button.querySelector(".like-count").textContent = count || 0;
    }catch(error){
        console.error(error);
        showToast("Errore nel like: " + error.message);
    }finally{
        button.disabled = false;
    }
}

/* =========================================================
   COMMENTS
========================================================= */
async function updateCommentCount(postId,button){
    try{
        const {count} = await supabase
            .from("post_comments")
            .select("id",{count:"exact",head:true})
            .eq("post_id",postId);

        button.querySelector(".comment-count").textContent = count || 0;
    }catch(error){
        console.error("Errore comment count:",error);
    }
}

async function toggleComments(postId,article){
    const box = document.getElementById(`comments-${postId}`);
    if(!box) return;

    box.classList.toggle("active");
    if(box.classList.contains("active")) await loadComments(postId,box);
}

async function loadComments(postId,box){
    const list = box.querySelector(".comments-list");
    list.innerHTML = `<div class="comment-text">Caricamento...</div>`;

    const {data,error} = await supabase
        .from("post_comments")
        .select("*")
        .eq("post_id",postId)
        .order("created_at",{ascending:true});

    if(error){
        list.innerHTML = `<div class="comment-text">${escapeHtml(error.message)}</div>`;
        return;
    }

    list.innerHTML = "";

    if(!data?.length){
        list.innerHTML = `<div class="comment-text">Nessun commento. Sii il primo.</div>`;
        return;
    }

    const authors = await Promise.all(data.map(comment => resolveAuthor(comment.user_id)));

    data.forEach((comment,index) => {
        const author = authors[index];
        const div = document.createElement("div");
        div.className = "comment";

        const avatar = author.avatar
            ? `<img src="${escapeHtml(author.avatar)}" alt="">`
            : escapeHtml(getInitials(author.name));

        div.innerHTML = `
            <div class="comment-avatar">${avatar}</div>
            <div class="comment-content">
                <div class="comment-user">${escapeHtml(author.name)}</div>
                <div class="comment-text">${escapeHtml(comment.content)}</div>
            </div>
        `;
        list.appendChild(div);
    });
}

async function addComment(postId,article){
    if(!currentUser){
        showToast("Devi essere loggato.");
        return;
    }

    const input = article.querySelector(".comment-input");
    const button = article.querySelector(".comment-button");
    const content = input.value.trim();

    if(!content) return;

    button.disabled = true;

    try{
        const {error} = await supabase
            .from("post_comments")
            .insert({
                post_id:postId,
                user_id:currentUser.id,
                content
            });

        if(error) throw error;

        input.value = "";

        const box = document.getElementById(`comments-${postId}`);
        box.classList.add("active");
        await loadComments(postId,box);
        await updateCommentCount(postId,article.querySelector(".comment-toggle"));

        showToast("Commento pubblicato.");
    }catch(error){
        console.error(error);
        showToast("Errore: " + error.message);
    }finally{
        button.disabled = false;
    }
}

/* =========================================================
   DELETE
========================================================= */
async function deletePost(postId){
    if(!confirm("Vuoi davvero eliminare questo post?")) return;

    const {error} = await supabase
        .from("posts")
        .delete()
        .eq("id",postId);

    if(error){
        showToast("Errore: " + error.message);
        return;
    }

    showToast("Post eliminato.");
    await loadFeed();
}

/* =========================================================
   STORIES — ROBUST VERSION
   Stories are real images stored in the existing "post-images"
   bucket, inside the user's existing storage folder:
   <user_id>/story-<timestamp>-<uuid>.<ext>
   This keeps the same storage path convention used by posts.
========================================================= */

const storyImageInput = document.getElementById("storyImageInput");

async function listUserStoriesFromStorage(userId){
    try{
        const {data,error} = await supabase.storage
            .from("post-images")
            .list(userId,{limit:100,sortBy:{column:"created_at",order:"desc"}});
        if(error) return [];
        const cutoff = Date.now() - 24*60*60*1000;
        return (data || [])
            .filter(file => file?.name?.startsWith("story-"))
            .map(file => ({
                name:file.name,
                created:file.created_at ? new Date(file.created_at).getTime() : 0
            }))
            .filter(file => file.created >= cutoff)
            .sort((a,b) => b.created-a.created);
    }catch(e){
        return [];
    }
}

async function getLatestStory(userId){
    if(storyCache.has(userId)) return storyCache.get(userId);

    // Primary source: a normal post row marked as a Story.
    // This survives page refresh and does not depend on Storage LIST permissions.
    const {data:storyPost,error} = await supabase
        .from("posts")
        .select("id,image_url,created_at,user_id,content")
        .eq("user_id",userId)
        .eq("content",STORY_MARKER)
        .order("created_at",{ascending:false})
        .limit(10);

    const cutoff = Date.now() - 24*60*60*1000;
    const activePost = (storyPost || []).find(p => p.created_at && new Date(p.created_at).getTime() >= cutoff && p.image_url);

    if(activePost){
        const result = {
            url:activePost.image_url,
            created:new Date(activePost.created_at).getTime(),
            path:activePost.image_url,
            postId:activePost.id
        };
        storyCache.set(userId,result);
        return result;
    }

    // Backward-compatible fallback for Stories uploaded by the previous version.
    const files = await listUserStoriesFromStorage(userId);
    if(!files.length){
        storyCache.set(userId,null);
        return null;
    }

    const path = `${userId}/${files[0].name}`;
    const {data} = supabase.storage.from("post-images").getPublicUrl(path);
    const result = {url:data?.publicUrl || null,created:files[0].created,path};
    storyCache.set(userId,result);
    return result;
}

async function uploadStory(file){
    if(!currentUser) throw new Error("Devi essere loggato.");
    if(!file.type.startsWith("image/")) throw new Error("Seleziona una foto.");
    if(file.size > 10 * 1024 * 1024) throw new Error("La foto è troppo grande. Massimo 10 MB.");

    // Remove the previous active Story first: one active Story per account.
    const previous = await getLatestStory(currentUser.id);
    if(previous?.postId){
        await supabase.from("posts").delete().eq("id",previous.postId);
    }
    if(previous?.path && previous.path.includes("/story-")){
        await supabase.storage.from("post-images").remove([previous.path]);
    }
    storyCache.delete(currentUser.id);

    const path = `${currentUser.id}/story-${Date.now()}-${crypto.randomUUID()}.${fileExtension(file)}`;
    const {error:uploadError} = await supabase.storage.from("post-images").upload(path,file,{cacheControl:"3600",upsert:false});
    if(uploadError) throw new Error("Non riesco a pubblicare la Story: " + uploadError.message);

    const {data:urlData} = supabase.storage.from("post-images").getPublicUrl(path);
    const publicUrl = urlData?.publicUrl;
    if(!publicUrl) throw new Error("Non riesco a ottenere l'URL della Story.");

    // Persist metadata in the database so it survives refresh and is visible on profiles.
    const {data:storyRow,error:rowError} = await supabase
        .from("posts")
        .insert({user_id:currentUser.id,content:STORY_MARKER,image_url:publicUrl})
        .select("id,created_at")
        .single();

    if(rowError){
        await supabase.storage.from("post-images").remove([path]);
        throw new Error("Story caricata ma non salvata: " + rowError.message);
    }

    const result = {url:publicUrl,created:storyRow?.created_at ? new Date(storyRow.created_at).getTime() : Date.now(),path,postId:storyRow.id};
    storyCache.set(currentUser.id,result);
    return result;
}

async function deleteStory(story){
    if(!currentUser || !story) return;

    if(!confirm("Vuoi davvero eliminare la tua Story?")) return;

    try{
        // Remove the persistent database row first. This is what makes the Story
        // disappear immediately from FSocial and from the profile after refresh.
        if(story.postId){
            const {error} = await supabase
                .from("posts")
                .delete()
                .eq("id",story.postId)
                .eq("user_id",currentUser.id);

            if(error) throw error;
        }

        // Also remove the image from Storage when we can recover its path.
        let storagePath = story.storagePath || "";
        if(!storagePath && story.url){
            const marker = "/storage/v1/object/public/post-images/";
            const index = story.url.indexOf(marker);
            if(index !== -1){
                storagePath = decodeURIComponent(story.url.slice(index + marker.length));
            }
        }

        if(storagePath){
            const {error:storageError} = await supabase.storage
                .from("post-images")
                .remove([storagePath]);

            if(storageError){
                console.warn("Story rimossa dal database, ma non dallo Storage:",storageError.message);
            }
        }

        storyCache.delete(currentUser.id);
        activeStories = activeStories.filter(item => item.story?.postId !== story.postId);
        storyViewerCurrentStory = null;
        storyViewerDelete.style.display = "none";
        closeStory();
        showToast("Story eliminata.");
        await loadStories();
    }catch(error){
        console.error(error);
        showToast("Non posso eliminare la Story: " + (error.message || "errore"));
    }
}

function updateStoryNavigation(){
    const total = activeStories.length;
    storyPrevButton.disabled = total <= 1 || activeStoryIndex <= 0;
    storyNextButton.disabled = total <= 1 || activeStoryIndex >= total - 1;
}

function renderStoryViewer(author,story){
    storyViewerCurrentStory = story;
    storyViewerCurrentAuthor = author;

    const isMine = !!currentUser && author?.id === currentUser.id;
    storyViewerDelete.style.display = isMine ? "block" : "none";
    storyViewerDelete.disabled = false;

    storyViewerImage.src = story.url;
    storyViewerName.textContent = author.name || "FUORISCHEMA";

    if(author.username) storyViewerName.textContent += `  @${author.username}`;

    if(author.avatar){
        storyViewerAvatar.innerHTML =
            `<img src="${escapeHtml(author.avatar)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    }else{
        storyViewerAvatar.textContent = getInitials(author.name);
    }

    updateStoryNavigation();
}

function openStory(author,story,storyList=null){
    if(!story?.url){
        showToast("Nessuna Story disponibile.");
        return;
    }

    if(Array.isArray(storyList) && storyList.length){
        activeStories = storyList;
        const found = activeStories.findIndex(item =>
            item.story?.url === story.url && item.author?.id === author?.id
        );
        activeStoryIndex = found >= 0 ? found : 0;
    }

    renderStoryViewer(author,story);
    storyViewer.classList.add("show");
    storyViewer.style.display = "flex";
    document.body.classList.add("modal-open");
}

function showStoryAt(index){
    if(index < 0 || index >= activeStories.length) return;
    activeStoryIndex = index;
    const item = activeStories[index];
    if(item?.story?.url) renderStoryViewer(item.author,item.story);
}

function closeStory(){
    storyViewer.classList.remove("show");
    storyViewer.style.display = "none";
    storyViewerImage.src = "";
    storyViewerDelete.style.display = "none";
    storyViewerCurrentStory = null;
    storyViewerCurrentAuthor = null;

    if(!profileOverlay.classList.contains("active")){
        document.body.classList.remove("modal-open");
    }
}

storyViewerClose.addEventListener("click",closeStory);

storyPrevButton.addEventListener("click",event => {
    event.stopPropagation();
    showStoryAt(activeStoryIndex - 1);
});

storyNextButton.addEventListener("click",event => {
    event.stopPropagation();
    showStoryAt(activeStoryIndex + 1);
});

storyViewerImage.addEventListener("click",event => {
    if(!storyViewer.classList.contains("show") || !activeStories.length) return;
    const rect = storyViewerImage.getBoundingClientRect();
    const x = event.clientX - rect.left;
    if(x < rect.width * 0.32) showStoryAt(activeStoryIndex - 1);
    else if(x > rect.width * 0.68) showStoryAt(activeStoryIndex + 1);
});

storyViewerDelete.addEventListener("click",async event => {
    event.stopPropagation();
    if(!storyViewerCurrentStory || storyViewerDelete.disabled) return;
    storyViewerDelete.disabled = true;
    await deleteStory(storyViewerCurrentStory);
    if(storyViewerCurrentStory){
        storyViewerDelete.disabled = false;
    }
});

storyViewer.addEventListener("click",event => {
    if(event.target === storyViewer) closeStory();
});

document.addEventListener("keydown",event => {
    if(!storyViewer.classList.contains("show")) return;
    if(event.key === "Escape") closeStory();
    else if(event.key === "ArrowLeft") showStoryAt(activeStoryIndex - 1);
    else if(event.key === "ArrowRight") showStoryAt(activeStoryIndex + 1);
});

/* ---------- YOUR STORY ---------- */

function renderMyStoryCard(me,story){
    const storyEl = document.createElement("div");
    storyEl.className = "story story-add";

    const ring = document.createElement("div");
    ring.className = `story-ring ${story ? "" : "seen"}`;

    const avatar = document.createElement("div");
    avatar.className = "story-avatar";

    if(story?.url){
        avatar.innerHTML =
            `<img src="${escapeHtml(story.url)}" alt="La tua Story">`;
    }else{
        avatar.textContent = "+";
    }

    ring.appendChild(avatar);

    const name = document.createElement("div");
    name.className = "story-name";
    name.textContent = "La tua Story";

    storyEl.append(ring,name);

    storyEl.addEventListener("click",(event) => {
        event.preventDefault();
        event.stopPropagation();
        if(story?.url){
            openStory(me,story,activeStories);
            return;
        }

        storyImageInput.value = "";
        storyImageInput.click();
    });

    stories.appendChild(storyEl);
}

storyImageInput.addEventListener("change",async() => {
    const file = storyImageInput.files?.[0];
    if(!file) return;

    storyImageInput.value = "";

    const previousText = storyImageInput.dataset.busy;

    if(previousText === "1") return;

    storyImageInput.dataset.busy = "1";

    try{
        showToast("Pubblicazione Story...");
        const uploaded = await uploadStory(file);

        // Manteniamo la Story appena caricata nella cache:
        // dopo il caricamento la card deve diventare cliccabile e riaprire la Story,
        // non tornare al pulsante "+".
        storyCache.set(currentUser.id, uploaded);

        await loadStories();

        showToast("Story pubblicata 🔥");

        if(uploaded?.url){
            const me = await resolveAuthor(currentUser.id);
            openStory(me,uploaded);
        }
    }catch(error){
        console.error(error);
        showToast(error.message || "Errore nella Story.");
    }finally{
        storyImageInput.dataset.busy = "0";
    }
});

/* ---------- LOAD ALL ACTIVE STORIES ---------- */

async function loadStories(){
    stories.innerHTML = `<div class="story-empty">Caricamento Stories...</div>`;

    const me = {
        id:currentUser.id,
        name:getUserName(currentUser),
        username:getUsername(currentUser),
        avatar:getAvatar(currentUser),
        instagram:getInstagram(currentUser),
        bio:"Membro FUORISCHEMA."
    };

    stories.innerHTML = "";
    activeStories = [];

    const myStory = await getLatestStory(currentUser.id);
    if(myStory?.url) activeStories.push({author:me,story:myStory});

    renderMyStoryCard(me,myStory);

    const {data:profiles,error} = await supabase
        .from("profiles")
        .select("id,full_name,username,instagram,avatar_url,bio")
        .neq("id",currentUser.id)
        .limit(100);

    if(error){
        console.warn("Impossibile caricare i profili per le Stories:",error.message);
        return;
    }

    for(const profile of (profiles || [])){
        const story = await getLatestStory(profile.id);
        if(!story?.url) continue;

        const author = {
            id:profile.id,
            name:profile.full_name || profile.username || "MEMBRO FUORISCHEMA",
            username:profile.username || "",
            instagram:profile.instagram || "",
            avatar:profile.avatar_url || "",
            bio:profile.bio || "Membro FUORISCHEMA."
        };

        activeStories.push({author,story});

        const storyEl = document.createElement("div");
        storyEl.className = "story";

        const ring = document.createElement("div");
        ring.className = "story-ring";

        const avatar = document.createElement("div");
        avatar.className = "story-avatar";

        if(author.avatar) avatar.innerHTML = `<img src="${escapeHtml(author.avatar)}" alt="">`;
        else avatar.textContent = getInitials(author.name);

        ring.appendChild(avatar);

        const name = document.createElement("div");
        name.className = "story-name";
        name.textContent = author.username ? `@${author.username}` : author.name;

        storyEl.append(ring,name);
        storyEl.addEventListener("click",(event) => {
            event.preventDefault();
            event.stopPropagation();
            openStory(author,story,activeStories);
        });
        stories.appendChild(storyEl);
    }

    if(stories.children.length === 1){
        const hint = document.createElement("div");
        hint.className = "story-empty";
        hint.textContent = "Nessuna Story attiva. Pubblica la tua.";
        stories.appendChild(hint);
    }
}
