<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FUORISCHEMA — Abbigliamento</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        header {
            padding: 30px 6%;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #ff4d00;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .back {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .back:hover {
            color: #ff4d00;
        }

        main {
            max-width: 1300px;
            margin: auto;
            padding: 80px 6%;
        }

        .label {
            color: #ff4d00;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(55px, 9vw, 110px);
            line-height: 0.85;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .intro {
            color: #888;
            font-size: 14px;
            margin-bottom: 70px;
            letter-spacing: 1px;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .category {
            position: relative;
            min-height: 220px;
            padding: 30px;
            background: #0b0b0b;
            border: 1px solid #222;
            color: #fff;
            text-decoration: none;
            overflow: hidden;
            transition: 0.3s;
        }

        .category:hover {
            border-color: #ff4d00;
            transform: translateY(-4px);
        }

        .category-number {
            color: #ff4d00;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 70px;
        }

        .category-name {
            font-size: clamp(30px, 5vw, 55px);
            font-weight: 900;
            line-height: 0.9;
            text-transform: uppercase;
        }

        .arrow {
            position: absolute;
            right: 30px;
            bottom: 25px;
            color: #ff4d00;
            font-size: 28px;
            transition: 0.3s;
        }

        .category:hover .arrow {
            transform: translateX(8px);
        }

        @media (max-width: 700px) {

            header {
                padding: 22px 5%;
            }

            main {
                padding: 55px 5%;
            }

            .categories {
                grid-template-columns: 1fr;
            }

            .category {
                min-height: 190px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        FUORISCHEMA
    </div>

    <a href="catalogo.html" class="back">
        ← CATALOGO
    </a>

</header>

<main>

    <div class="label">
        02 / CATEGORIA
    </div>

    <h1>
        ABBIGLIAMENTO
    </h1>

    <p class="intro">
        SCEGLI LA CATEGORIA
    </p>

    <div class="categories">

        <a href="maglie.html" class="category">
            <div class="category-number">001</div>
            <div class="category-name">MAGLIE</div>
            <div class="arrow">→</div>
        </a>

        <a href="jeans.html" class="category">
            <div class="category-number">002</div>
            <div class="category-name">JEANS</div>
            <div class="arrow">→</div>
        </a>

        <a href="pantaloni.html" class="category">
            <div class="category-number">003</div>
            <div class="category-name">PANTALONI</div>
            <div class="arrow">→</div>
        </a>

        <a href="felpe.html" class="category">
            <div class="category-number">004</div>
            <div class="category-name">FELPE</div>
            <div class="arrow">→</div>
        </a>

        <a href="giacche.html" class="category">
            <div class="category-number">005</div>
            <div class="category-name">GIACCHE</div>
            <div class="arrow">→</div>
        </a>

        <a href="t-shirt.html" class="category">
            <div class="category-number">006</div>
            <div class="category-name">T-SHIRT</div>
            <div class="arrow">→</div>
        </a>

    </div>

</main>

</body>
</html>
