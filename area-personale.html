<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PROFILO — FUORISCHEMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:#050505;color:#f5f5f5;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;padding-bottom:70px}
a{color:inherit;text-decoration:none;touch-action:manipulation}
button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}
:root{--bg:#050505;--panel:#0f0f0f;--line:#1c1c1c;--line-light:#2e2e2e;--panel-border:rgba(255,255,255,0.08);--text:#f5f5f5;--muted:#8e8e8e;--orange:#ff4d00;--orange-hover:#e04400;--orange-glow:rgba(255,77,0,0.25);--font-title:'Syne',sans-serif}
header{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:50;background:rgba(5,5,5,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.logo{font-size:20px;font-weight:900;letter-spacing:-1.2px;text-transform:uppercase;font-family:var(--font-title)}.logo span{color:var(--orange)}
.profile-container{width:min(935px,92%);margin:0 auto;padding:40px 0 40px;flex:1}
.profile-header{display:grid;grid-template-columns:180px 1fr;gap:40px;align-items:start;padding-bottom:44px;border-bottom:1px solid var(--line)}
.avatar-wrapper{display:flex;flex-direction:column;align-items:center;justify-content:center}.avatar{width:150px;height:150px;border-radius:50%;background:var(--panel);border:1px solid var(--line-light);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;box-shadow:0 0 25px rgba(255,77,0,.05)}.avatar img{width:100%;height:100%;object-fit:cover;display:none}.avatar-placeholder{font-size:48px;font-weight:900;color:var(--orange);font-family:var(--font-title)}
.change-avatar{margin-top:14px;background:none;border:none;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;transition:color .2s}.change-avatar:hover{color:var(--orange)}#avatarInput{display:none}
.profile-info{display:flex;flex-direction:column;gap:18px}.profile-title-row{display:flex;flex-direction:column;gap:4px}.profile-name{font-size:clamp(24px,3.5vw,36px);line-height:1.1;font-weight:900;letter-spacing:-1px;text-transform:uppercase;color:#fff;font-family:var(--font-title)}.profile-username{color:var(--orange);font-size:13px;font-weight:800;letter-spacing:1.2px}.profile-stats{display:flex;gap:28px;padding:10px 0}.stat-item{display:flex;align-items:baseline;gap:6px}.stat-value{font-size:16px;font-weight:900;color:#fff}.stat-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase}.profile-bio{color:#ccc;font-size:14px;line-height:1.5;max-width:580px;white-space:pre-wrap}
.actions{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}.action-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-light);background:var(--panel);color:#fff;padding:10px 18px;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;border-radius:4px;transition:all .2s ease}.action-btn:hover{border-color:var(--orange);color:var(--orange)}.action-btn.orange{background:var(--orange);border-color:var(--orange);color:#050505}.action-btn.orange:hover{background:var(--orange-hover);border-color:var(--orange-hover)}
.posts-section{padding-top:32px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.section-label{color:var(--text);font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}.section-label::before{content:'';display:inline-block;width:6px;height:6px;background:var(--orange);border-radius:50%}.posts-count{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.posts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.post-tile{position:relative;aspect-ratio:1/1;background:var(--panel);overflow:hidden;border:1px solid var(--line);border-radius:4px;transition:border-color .25s ease}.post-tile:hover{border-color:var(--line-light)}.post-tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}.post-tile:hover img{transform:scale(1.04)}.post-overlay{position:absolute;inset:0;padding:20px;background:rgba(5,5,5,.85);backdrop-filter:blur(4px);opacity:0;transition:opacity .25s ease;display:flex;align-items:center;justify-content:center}.post-tile:hover .post-overlay{opacity:1}.post-text{font-size:12px;line-height:1.4;color:#fff;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical}.text-only{display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#0f0f0f,#070707)}.text-only .post-text{font-size:14px;font-weight:700;text-align:center;color:#ececec;line-height:1.4;-webkit-line-clamp:7}.empty-posts{grid-column:1/-1;min-height:240px;border:1px dashed var(--line-light);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:40px 20px;background:rgba(15,15,15,.3)}.empty-posts strong{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--text)}.empty-posts span{margin-top:8px;color:var(--muted);font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal-backdrop.show{display:flex}.modal{width:min(480px,100%);background:#0d0d0d;border:1px solid var(--line-light);border-radius:8px;box-shadow:0 30px 90px rgba(0,0,0,.8);padding:28px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.modal-title{font-size:16px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;font-family:var(--font-title)}.close-modal{border:0;background:none;color:var(--muted);font-size:24px;line-height:1}.close-modal:hover{color:#fff}.field{margin-bottom:18px}.field label{display:block;color:var(--orange);font-size:9px;font-weight:900;letter-spacing:1.5px;margin-bottom:8px;text-transform:uppercase}.field input,.field textarea{width:100%;background:#050505;color:#fff;border:1px solid var(--line-light);border-radius:4px;padding:12px 14px;outline:none;font-size:13px;transition:border-color .2s}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--orange)}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.status{font-size:11px;color:var(--muted);margin-top:10px;min-height:16px}
footer{border-top:1px solid var(--line);padding:24px 5vw 40px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;background:#050505}
.bottom-nav{display:flex !important;position:fixed !important;bottom:0 !important;left:0 !important;right:0 !important;height:calc(60px + env(safe-area-inset-bottom,0px)) !important;padding-bottom:env(safe-area-inset-bottom,0px) !important;background:rgba(8,8,10,.95) !important;backdrop-filter:blur(20px) !important;-webkit-backdrop-filter:blur(20px) !important;border-top:1px solid var(--panel-border) !important;z-index:999999 !important;align-items:center !important;justify-content:space-around !important;box-shadow:0 -10px 30px rgba(0,0,0,.8) !important;visibility:visible !important;opacity:1 !important}.bottom-nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;height:100%;color:var(--muted);transition:color .2s ease,transform .15s ease;position:relative;border:none;background:transparent}.bottom-nav-item:active{transform:scale(.88)}.bottom-nav-item.active,.bottom-nav-item:hover{color:#fff}.bottom-nav-icon{font-size:20px;line-height:1}.bottom-nav-label{font-size:9px;font-weight:700;letter-spacing:.5px;margin-top:3px;text-transform:uppercase}.bottom-nav-item.plus-btn{flex:0 0 48px}.bottom-nav-item.plus-btn .plus-inner{width:42px;height:42px;border-radius:50%;background:var(--orange);color:#000;display:grid;place-items:center;font-size:22px;font-weight:900;box-shadow:0 0 16px var(--orange-glow);transition:transform .2s ease,background-color .2s ease}.bottom-nav-item.plus-btn:active .plus-inner{transform:scale(.92);background:#fff}.bottom-nav-badge{position:absolute;top:8px;right:22%;background:var(--orange);color:#000;font-size:9px;font-weight:900;min-width:14px;height:14px;border-radius:100px;display:none;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--bg)}.bottom-nav-badge.active{display:inline-flex}
@media(max-width:768px){header{height:62px;padding:0 16px}.logo{font-size:17px}.profile-container{width:100%;padding:24px 16px}.profile-header{grid-template-columns:100px 1fr;gap:20px;padding-bottom:28px}.avatar{width:96px;height:96px}.avatar-placeholder{font-size:32px}.change-avatar{font-size:8px;letter-spacing:1px;margin-top:10px}.profile-name{font-size:22px}.profile-username{font-size:11px}.profile-bio{font-size:12px}.posts-grid{grid-template-columns:repeat(3,1fr);gap:3px}.post-tile{border-radius:0;border:none}.post-overlay{display:none}.text-only .post-text{font-size:10px;line-height:1.2;-webkit-line-clamp:5}footer{padding:20px 16px 30px;flex-direction:column;gap:10px;text-align:center}}@media(max-width:480px){.profile-header{grid-template-columns:1fr;text-align:center;gap:16px}.profile-info{align-items:center}.profile-stats{justify-content:center}.actions{justify-content:center}}
</style>
<meta name="robots" content="noindex, nofollow, noarchive">
</head>
<body>
<header><a href="index.html" class="logo">FUORI<span>SCHEMA</span></a></header>
<main class="profile-container">
<section class="profile-header">
<div class="avatar-wrapper"><div class="avatar"><img id="avatarImage" alt="Foto profilo"><div id="avatarPlaceholder" class="avatar-placeholder">F</div></div><button id="changeAvatarBtn" class="change-avatar">+ CAMBIA FOTO</button><input type="file" id="avatarInput" accept="image/*"></div>
<div class="profile-info">
<div class="profile-title-row"><h1 id="profileName" class="profile-name">CARICAMENTO...</h1><div id="profileUsername" class="profile-username">@FUORISCHEMA</div></div>
<div class="profile-stats"><div class="stat-item"><span id="postsCount" class="stat-value">0</span><span class="stat-label">Post</span></div></div>
<p id="profileBio" class="profile-bio">Fuori dagli schemi. Dentro te stesso.</p>
<div class="actions"><button id="editProfileBtn" class="action-btn orange">MODIFICA PROFILO</button></div>
</div>
</section>
<section class="posts-section"><div class="section-head"><div class="section-label">GALLERIA TRACCE</div></div><div id="postsGrid" class="posts-grid"></div></section>
</main>
<footer><span>FUORISCHEMA © 2026</span><span>FUORI DAGLI SCHEMI.</span></footer>
<nav class="bottom-nav">
<a id="navHome" href="Fsocial.html" class="bottom-nav-item" aria-label="Home"><span class="bottom-nav-icon">⌂</span><span class="bottom-nav-label">Home</span></a>
<a id="navSearch" href="Fsocial.html?action=search" class="bottom-nav-item" aria-label="Cerca"><span class="bottom-nav-icon">⌕</span><span class="bottom-nav-label">Cerca</span></a>
<a id="navCreate" href="Fsocial.html?action=create" class="bottom-nav-item plus-btn" aria-label="Crea Post"><div class="plus-inner">+</div></a>
<a id="navNotif" href="Fsocial.html?openNotifications=1" class="bottom-nav-item" aria-label="Notifiche"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" style="width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></span><span class="bottom-nav-label">Notifiche</span><span id="bottomNavBadge" class="bottom-nav-badge">0</span></a>
<a id="navProfile" href="area-personale.html" class="bottom-nav-item active" aria-label="Profilo"><span class="bottom-nav-icon">●</span><span class="bottom-nav-label">Profilo</span></a>
</nav>
<div id="editModal" class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div id="modalTitle" class="modal-title">Modifica profilo</div><button id="closeModal" class="close-modal" type="button">×</button></div><div class="field"><label for="editName">NOME</label><input id="editName" type="text" maxlength="80"></div><div class="field"><label for="editUsername">USERNAME</label><input id="editUsername" type="text" maxlength="40" placeholder="es. vincenzo"></div><div class="field"><label for="editBio">BIO</label><textarea id="editBio" maxlength="180"></textarea></div><div class="field"><label for="editInstagram">INSTAGRAM</label><input id="editInstagram" type="text" maxlength="80" placeholder="@tuousername"></div><div id="editStatus" class="status"></div><div class="modal-actions"><button id="cancelEdit" class="action-btn" type="button">ANNULLA</button><button id="saveEdit" class="action-btn orange" type="button">SALVA</button></div></div></div>
<script type="module">
import { supabase } from "./supabase.js";
const profileName=document.getElementById("profileName"),profileUsername=document.getElementById("profileUsername"),profileBio=document.getElementById("profileBio"),avatarImage=document.getElementById("avatarImage"),avatarPlaceholder=document.getElementById("avatarPlaceholder"),avatarInput=document.getElementById("avatarInput"),changeAvatarBtn=document.getElementById("changeAvatarBtn"),editProfileBtn=document.getElementById("editProfileBtn"),postsGrid=document.getElementById("postsGrid"),postsCount=document.getElementById("postsCount"),bottomNavBadge=document.getElementById("bottomNavBadge");
const editModal=document.getElementById("editModal"),closeModal=document.getElementById("closeModal"),cancelEdit=document.getElementById("cancelEdit"),saveEdit=document.getElementById("saveEdit"),editStatus=document.getElementById("editStatus"),editName=document.getElementById("editName"),editUsername=document.getElementById("editUsername"),editBio=document.getElementById("editBio"),editInstagram=document.getElementById("editInstagram");
let currentUser=null,currentProfile=null,viewedUserId=null,isOwnProfile=true;
function escapeHtml(value=""){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function initials(name="F"){return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"F"}function formatPostText(text=""){return escapeHtml(text).replace(/\n/g,"<br>")}
async function updateNotificationBadge(){if(!currentUser)return;try{const{count,error}=await supabase.from("notifications").select("id",{count:"exact",head:true}).eq("user_id",currentUser.id).eq("is_read",false);if(!error&&count&&count>0){const val=count>99?"99+":count;if(bottomNavBadge){bottomNavBadge.textContent=val;bottomNavBadge.classList.add("active")}}else if(bottomNavBadge){bottomNavBadge.textContent="0";bottomNavBadge.classList.remove("active")}}catch(err){console.error(err)}}
async function loadProfile(){const{data:{session}}=await supabase.auth.getSession();if(!session){window.location.href="login.html";return}currentUser=session.user;updateNotificationBadge();const params=new URLSearchParams(window.location.search),requestedUserId=params.get("id");viewedUserId=requestedUserId||currentUser.id;isOwnProfile=viewedUserId===currentUser.id;const{data:profile,error}=await supabase.from("profiles").select("*").eq("id",viewedUserId).maybeSingle();if(error)console.error(error);if(!profile){if(!isOwnProfile){profileName.textContent="PROFILO NON TROVATO";profileUsername.textContent="";profileBio.textContent="Questo profilo non è disponibile.";postsGrid.innerHTML='<div class="empty-posts"><strong>PROFILO NON TROVATO</strong><span>Il membro richiesto non è disponibile.</span></div>';postsCount.textContent="0";editProfileBtn.style.display="none";changeAvatarBtn.style.display="none";return}currentProfile={id:currentUser.id,full_name:currentUser.user_metadata?.full_name||"MEMBRO FUORISCHEMA",username:currentUser.email?.split("@")[0]||"member",bio:"Fuori dagli schemi. Dentro te stesso."}}else currentProfile=profile;editProfileBtn.style.display=isOwnProfile?"":"none";changeAvatarBtn.style.display=isOwnProfile?"":"none";renderProfile();await loadMyPosts()}
function renderProfile(){const name=currentProfile?.full_name||currentUser?.user_metadata?.full_name||"MEMBRO FUORISCHEMA",username=String(currentProfile?.username||currentUser?.email?.split("@")[0]||"member").replace(/^@/,""),bio=currentProfile?.bio||"Fuori dagli schemi. Dentro te stesso.";profileName.textContent=name.toUpperCase();profileUsername.textContent="@"+username;profileBio.textContent=bio;if(currentProfile?.avatar_url){avatarImage.src=currentProfile.avatar_url+"?t="+Date.now();avatarImage.style.display="block";avatarPlaceholder.style.display="none"}else{avatarImage.style.display="none";avatarPlaceholder.style.display="flex";avatarPlaceholder.textContent=initials(name)}}
async function loadMyPosts(){postsGrid.innerHTML='<div class="empty-posts"><strong>CARICAMENTO...</strong><span>Stiamo cercando le tue tracce.</span></div>';const{data:rawPosts,error}=await supabase.from("posts").select("id,content,image_url,created_at,user_id").eq("user_id",viewedUserId).order("created_at",{ascending:false});const posts=(rawPosts||[]).filter(post=>post.content!=="__FS_STORY__");if(error){console.error(error);postsGrid.innerHTML=`<div class="empty-posts"><strong>ERRORE</strong><span>${escapeHtml(error.message)}</span></div>`;postsCount.textContent="0";return}postsCount.textContent=`${posts?.length||0}`;if(!posts||posts.length===0){postsGrid.innerHTML='<div class="empty-posts"><strong>NESSUN POST</strong><span>Lascia la tua prima traccia su FSocial.</span></div>';return}postsGrid.innerHTML=posts.map(post=>{const text=post.content||"";if(post.image_url)return `<article class="post-tile"><img src="${escapeHtml(post.image_url)}" alt="Post FUORISCHEMA" loading="lazy">${text?`<div class="post-overlay"><div class="post-text">${formatPostText(text)}</div></div>`:""}</article>`;return `<article class="post-tile text-only"><div class="post-text">${formatPostText(text||"Nuovo post.")}</div></article>`}).join("")}
function openEdit(){editName.value=currentProfile?.full_name||"";editUsername.value=currentProfile?.username||"";editBio.value=currentProfile?.bio||"";editInstagram.value=currentProfile?.instagram||"";editStatus.textContent="";editModal.classList.add("show");document.body.style.overflow="hidden"}function closeEdit(){editModal.classList.remove("show");document.body.style.overflow=""}
async function saveProfile(){if(!isOwnProfile)return;const full_name=editName.value.trim(),username=editUsername.value.trim().replace(/^@/,""),bio=editBio.value.trim(),instagram=editInstagram.value.trim();if(!full_name||!username){editStatus.textContent="Nome e username sono obbligatori.";return}saveEdit.disabled=true;editStatus.textContent="Salvataggio...";try{const{error}=await supabase.from("profiles").upsert({id:currentUser.id,full_name,username,bio,instagram},{onConflict:"id"});if(error)throw error;currentProfile={...currentProfile,full_name,username,bio,instagram};renderProfile();closeEdit()}catch(err){console.error(err);editStatus.textContent=err.message||"Errore durante il salvataggio."}finally{saveEdit.disabled=false}}
async function uploadAvatar(){if(!isOwnProfile||!avatarInput.files?.[0])return;const file=avatarInput.files[0];changeAvatarBtn.disabled=true;changeAvatarBtn.textContent="CARICAMENTO...";try{const ext=(file.name.split(".").pop()||"jpg").toLowerCase();const path=`${currentUser.id}/avatar-${Date.now()}.${ext}`;const{error:uploadError}=await supabase.storage.from("avatars").upload(path,file,{upsert:true,contentType:file.type||"image/jpeg"});if(uploadError)throw uploadError;const{data:urlData}=supabase.storage.from("avatars").getPublicUrl(path);const{error:updateError}=await supabase.from("profiles").upsert({id:currentUser.id,avatar_url:urlData.publicUrl},{onConflict:"id"});if(updateError)throw updateError;currentProfile={...currentProfile,avatar_url:urlData.publicUrl};renderProfile()}catch(err){console.error(err)}finally{changeAvatarBtn.disabled=false;changeAvatarBtn.textContent="+ CAMBIA FOTO"}}
editProfileBtn?.addEventListener("click",openEdit);closeModal?.addEventListener("click",closeEdit);cancelEdit?.addEventListener("click",closeEdit);saveEdit?.addEventListener("click",saveProfile);changeAvatarBtn?.addEventListener("click",()=>avatarInput?.click());avatarInput?.addEventListener("change",uploadAvatar);editModal?.addEventListener("click",e=>{if(e.target===editModal)closeEdit()});
loadProfile();
</script>
</body>
</html>
