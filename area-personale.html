/* =========================================================
   FUORISCHEMA — PROFILE REDESIGN
   SOLO ESTETICA — NESSUNA LOGICA MODIFICATA
   ========================================================= */

.profile-container{
    width:min(1120px,92%);
    margin:0 auto;
    padding:34px 0 70px;
}

.profile-header{
    grid-template-columns:170px 1fr;
    gap:44px;
    padding:34px 0 38px;
    border-bottom:1px solid var(--line);
    align-items:center;
}

.avatar-wrapper{
    justify-content:flex-start;
}

.avatar{
    width:150px;
    height:150px;
    border-color:#292929;
    box-shadow:
        0 0 0 1px rgba(255,77,0,.05),
        0 20px 55px rgba(0,0,0,.5);
}

.change-avatar{
    margin-top:11px;
    font-size:9px;
    letter-spacing:1.6px;
}

.profile-info{
    gap:13px;
}

.profile-title-row{
    gap:6px;
}

.profile-name{
    font-size:clamp(30px,3.6vw,42px);
    line-height:.95;
    letter-spacing:-1.5px;
}

.profile-username{
    font-size:11px;
    letter-spacing:1.5px;
}

.profile-stats{
    padding:4px 0;
    gap:18px;
}

.stat-item{
    gap:6px;
}

.stat-value{
    font-size:19px;
}

.stat-label{
    font-size:9px;
    letter-spacing:1.5px;
}

.profile-bio{
    max-width:560px;
    color:#bdbdbd;
    font-size:12px;
    line-height:1.55;
}

.actions{
    margin-top:4px;
    gap:7px;
}

.action-btn{
    min-height:37px;
    padding:9px 18px;
    border-radius:2px;
    font-size:8px;
    letter-spacing:1.5px;
}

.action-btn.orange{
    box-shadow:0 8px 25px rgba(255,77,0,.08);
}

.posts-section{
    padding-top:25px;
}

.section-head{
    margin-bottom:13px;
}

.section-label{
    font-size:10px;
    letter-spacing:2.1px;
}

.section-label::before{
    width:5px;
    height:5px;
}

.posts-count{
    font-size:9px;
}

.posts-grid{
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.post-tile{
    border-radius:2px;
    border-color:#171717;
}

.post-tile:hover{
    border-color:#292929;
}

.post-tile:hover img{
    transform:scale(1.02);
}

.post-overlay{
    padding:22px;
    background:rgba(5,5,5,.82);
}

.post-text{
    font-size:11px;
    letter-spacing:.1px;
}

.empty-posts{
    min-height:280px;
    border-radius:2px;
}

footer{
    padding-top:18px;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:768px){

    header{
        height:60px;
        padding:0 17px;
    }

    .logo{
        font-size:17px;
    }

    .profile-container{
        width:100%;
        padding:20px 14px 34px;
    }

    .profile-header{
        grid-template-columns:92px 1fr;
        gap:17px;
        padding:18px 0 27px;
        align-items:center;
    }

    .avatar{
        width:92px;
        height:92px;
    }

    .avatar-placeholder{
        font-size:30px;
    }

    .change-avatar{
        margin-top:8px;
        font-size:7px;
        letter-spacing:1px;
    }

    .profile-info{
        gap:10px;
    }

    .profile-name{
        font-size:22px;
        line-height:.95;
        letter-spacing:-.7px;
    }

    .profile-username{
        font-size:9px;
        letter-spacing:1.1px;
    }

    .profile-stats{
        padding:3px 0;
        gap:13px;
    }

    .stat-value{
        font-size:16px;
    }

    .stat-label{
        font-size:8px;
        letter-spacing:1.1px;
    }

    .profile-bio{
        font-size:10px;
        line-height:1.45;
    }

    .actions{
        gap:6px;
        margin-top:2px;
    }

    .action-btn{
        min-height:34px;
        padding:8px 12px;
        font-size:7.5px;
        letter-spacing:1.15px;
    }

    .posts-section{
        padding-top:21px;
    }

    .section-head{
        margin-bottom:10px;
    }

    .section-label{
        font-size:9px;
        letter-spacing:1.7px;
    }

    .posts-count{
        font-size:8px;
    }

    .posts-grid{
        grid-template-columns:repeat(3,1fr);
        gap:2px;
    }

    .post-tile{
        border:0;
        border-radius:0;
    }

    .post-overlay{
        display:none;
    }

    .text-only .post-text{
        font-size:9px;
        line-height:1.25;
    }
}

@media(max-width:480px){

    .profile-header{
        grid-template-columns:1fr;
        gap:13px;
        padding-top:21px;
        text-align:center;
        align-items:center;
    }

    .avatar-wrapper{
        align-items:center;
    }

    .profile-info{
        align-items:center;
    }

    .profile-title-row{
        align-items:center;
        justify-content:center;
    }

    .profile-name{
        font-size:27px;
        line-height:.9;
        letter-spacing:-.8px;
    }

    .profile-username{
        font-size:9px;
    }

    .profile-stats{
        justify-content:center;
    }

    .profile-bio{
        max-width:300px;
    }

    .actions{
        justify-content:center;
    }

    .posts-section{
        padding-left:0;
        padding-right:0;
    }
}

<script type="module">
import { supabase } from "./supabase.js";
const profileName=document.getElementById("profileName"),profileUsername=document.getElementById("profileUsername"),profileBio=document.getElementById("profileBio"),avatarImage=document.getElementById("avatarImage"),avatarPlaceholder=document.getElementById("avatarPlaceholder"),avatarInput=document.getElementById("avatarInput"),changeAvatarBtn=document.getElementById("changeAvatarBtn"),editProfileBtn=document.getElementById("editProfileBtn"),postsGrid=document.getElementById("postsGrid"),postsCount=document.getElementById("postsCount"),bottomNavBadge=document.getElementById("bottomNavBadge");
const editModal=document.getElementById("editModal"),closeModal=document.getElementById("closeModal"),cancelEdit=document.getElementById("cancelEdit"),saveEdit=document.getElementById("saveEdit"),editStatus=document.getElementById("editStatus"),editName=document.getElementById("editName"),editUsername=document.getElementById("editUsername"),editBio=document.getElementById("editBio"),editInstagram=document.getElementById("editInstagram");
let currentUser=null,currentProfile=null,viewedUserId=null,isOwnProfile=true;
function escapeHtml(value=""){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function initials(name="F"){return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"F"}function formatPostText(text=""){return escapeHtml(text).replace(/\n/g,"<br>")}
async function updateNotificationBadge(){if(!currentUser)return;try{const{count,error}=await supabase.from("notifications").select("id",{count:"exact",head:true}).eq("user_id",currentUser.id).eq("is_read",false);if(!error&&count&&count>0){const val=count>99?"99+":count;if(bottomNavBadge){bottomNavBadge.textContent=val;bottomNavBadge.classList.add("active")}}else if(bottomNavBadge){bottomNavBadge.textContent="0";bottomNavBadge.classList.remove("active")}}catch(err){console.error(err)}}
async function loadProfile(){const{data:{session}}=await supabase.auth.getSession();if(!session){window.location.href="login.html";return}currentUser=session.user;updateNotificationBadge();const params=new URLSearchParams(window.location.search),requestedUserId=params.get("id");viewedUserId=requestedUserId||currentUser.id;isOwnProfile=viewedUserId===currentUser.id;const{data:profile,error}=await supabase.from("profiles").select("*").eq("id",viewedUserId).maybeSingle();if(error)console.error(error);if(!profile){if(!isOwnProfile){profileName.textContent="PROFILO NON TROVATO";profileUsername.textContent="";profileBio.textContent="Questo profilo non è disponibile.";postsGrid.innerHTML='<div class="empty-posts"><strong>PROFILO NON TROVATO</strong><span>Il membro richiesto non è disponibile.</span></div>';postsCount.textContent="0";editProfileBtn.style.display="none";changeAvatarBtn.style.display="none";return}currentProfile={id:currentUser.id,full_name:currentUser.user_metadata?.full_name||"MEMBRO FUORISCHEMA",username:currentUser.email?.split("@")[0]||"member",bio:"Fuori dagli schemi. Dentro te stesso."}}else currentProfile=profile;editProfileBtn.style.display=isOwnProfile?"":"none";changeAvatarBtn.style.display=isOwnProfile?"":"none";renderProfile();await loadMyPosts()}
function renderProfile(){const name=currentProfile?.full_name||currentUser?.user_metadata?.full_name||"MEMBRO FUORISCHEMA",username=String(currentProfile?.username||currentUser?.email?.split("@")[0]||"member").replace(/^@/,""),bio=currentProfile?.bio||"Fuori dagli schemi. Dentro te stesso.";profileName.textContent=name.toUpperCase();profileUsername.textContent="@"+username;profileBio.textContent=bio;if(currentProfile?.avatar_url){avatarImage.src=currentProfile.avatar_url+"?t="+Date.now();avatarImage.style.display="block";avatarPlaceholder.style.display="none"}else{avatarImage.style.display="none";avatarPlaceholder.style.display="flex";avatarPlaceholder.textContent=initials(name)}}
async function loadMyPosts(){postsGrid.innerHTML='<div class="empty-posts"><strong>CARICAMENTO...</strong><span>Stiamo cercando le tue tracce.</span></div>';const{data:rawPosts,error}=await supabase.from("posts").select("id,content,image_url,created_at,user_id").eq("user_id",viewedUserId).order("created_at",{ascending:false});const posts=(rawPosts||[]).filter(post=>post.content!=="__FS_STORY__");if(error){console.error(error);postsGrid.innerHTML=`<div class="empty-posts"><strong>ERRORE</strong><span>${escapeHtml(error.message)}</span></div>`;postsCount.textContent="0";return}postsCount.textContent=`${posts?.length||0}`;if(!posts||posts.length===0){postsGrid.innerHTML='<div class="empty-posts"><strong>NESSUN POST</strong><span>Lascia la tua prima traccia su FSocial.</span></div>';return}postsGrid.innerHTML=posts.map(post=>{const text=post.content||"";if(post.image_url)return `<article class="post-tile"><img src="${escapeHtml(post.image_url)}" alt="Post FUORISCHEMA" loading="lazy">${text?`<div class="post-overlay"><div class="post-text">${formatPostText(text)}</div></div>`:""}</article>`;return `<article class="post-tile text-only"><div class="post-text">${formatPostText(text||"Nuovo post.")}</div></article>`}).join("")}
function openEdit(){editName.value=currentProfile?.full_name||"";editUsername.value=currentProfile?.username||"";editBio.value=currentProfile?.bio||"";editInstagram.value=currentProfile?.instagram||"";editStatus.textContent="";editModal.classList.add("show");document.body.style.overflow="hidden"}function closeEdit(){editModal.classList.remove("show");document.body.style.overflow=""}
async function saveProfile(){if(!isOwnProfile)return;const full_name=editName.value.trim(),username=editUsername.value.trim().replace(/^@/,""),bio=editBio.value.trim(),instagram=editInstagram.value.trim();if(!full_name||!username){editStatus.textContent="Nome e username sono obbligatori.";return}saveEdit.disabled=true;editStatus.textContent="Salvataggio...";try{const{error}=await supabase.from("profiles").upsert({id:currentUser.id,full_name,username,bio,instagram},{onConflict:"id"});if(error)throw error;currentProfile={...currentProfile,full_name,username,bio,instagram};renderProfile();closeEdit()}catch(err){console.error(err);editStatus.textContent=err.message||"Errore durante il salvataggio."}finally{saveEdit.disabled=false}}
async function uploadAvatar(){if(!isOwnProfile||!avatarInput.files?.[0])return;const file=avatarInput.files[0];changeAvatarBtn.disabled=true;changeAvatarBtn.textContent="CARICAMENTO...";try{const ext=(file.name.split(".").pop()||"jpg").toLowerCase();const path=`${currentUser.id}/avatar-${Date.now()}.${ext}`;const{error:uploadError}=await supabase.storage.from("avatars").upload(path,file,{upsert:true,contentType:file.type||"image/jpeg"});if(uploadError)throw uploadError;const{data:urlData}=supabase.storage.from("avatars").getPublicUrl(path);const{error:updateError}=await supabase.from("profiles").upsert({id:currentUser.id,avatar_url:urlData.publicUrl},{onConflict:"id"});if(updateError)throw updateError;currentProfile={...currentProfile,avatar_url:urlData.publicUrl};renderProfile()}catch(err){console.error(err)}finally{changeAvatarBtn.disabled=false;changeAvatarBtn.textContent="+ CAMBIA FOTO"}}

loadProfile();
</script>
