<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROFILO — FUORISCHEMA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#050505;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
button{cursor:pointer}
:root{
  --bg:#050505;--panel:#0b0b0b;--line:#242424;--line2:#303030;
  --text:#f5f5f5;--muted:#8b8b8b;--orange:#ff4d00;
}
header{
  height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:50;
  background:rgba(5,5,5,.94);backdrop-filter:blur(14px)
}
.logo{font-size:21px;font-weight:950;letter-spacing:-1.5px}
.logo span{color:var(--orange)}
.header-right{display:flex;gap:8px;align-items:center}
.header-btn{
  border:1px solid #333;background:transparent;color:#fff;padding:11px 16px;
  font-size:10px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase
}
.header-btn:hover{border-color:var(--orange);color:var(--orange)}
.header-btn.orange{background:var(--orange);border-color:var(--orange);color:#050505}
.header-btn.home{display:inline-flex;align-items:center;gap:7px}

/* HERO — volutamente piccolo: il profilo è il contenuto */
.profile-hero{
  width:min(1180px,90%);margin:0 auto;padding:42px 0 26px;border-bottom:1px solid var(--line)
}
.eyebrow{color:var(--orange);font-size:9px;font-weight:900;letter-spacing:3px;text-transform:uppercase}
.hero-title{margin-top:10px;font-size:clamp(26px,4vw,48px);line-height:.95;letter-spacing:-2px;font-weight:950;text-transform:uppercase}
.hero-title span{color:var(--orange)}

/* PROFILE */
.profile-area{width:min(1180px,90%);margin:0 auto;padding:36px 0 70px}
.profile-top{
  display:grid;grid-template-columns:150px 1fr;gap:34px;align-items:center;
  padding-bottom:32px;border-bottom:1px solid var(--line)
}
.avatar-column{display:flex;flex-direction:column;align-items:center}
.avatar{
  width:136px;height:136px;border-radius:50%;background:#111;border:1px solid #353535;
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.avatar img{width:100%;height:100%;object-fit:cover;display:none}
.avatar-placeholder{font-size:43px;font-weight:950;color:var(--orange)}
.change-avatar{
  margin-top:11px;background:none;border:0;color:#777;font-size:9px;font-weight:900;
  letter-spacing:1.5px;text-transform:uppercase
}
.change-avatar:hover{color:var(--orange)}
#avatarInput{display:none}
.profile-name{
  font-size:clamp(30px,4.5vw,58px);line-height:.95;letter-spacing:-3px;
  font-weight:950;text-transform:uppercase
}
.profile-username{color:var(--orange);font-size:12px;font-weight:900;letter-spacing:1.4px;margin-top:10px}
.profile-bio{color:#aaa;font-size:14px;line-height:1.5;margin-top:13px;max-width:650px}
.actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.action-btn{
  display:inline-flex;align-items:center;justify-content:center;border:1px solid #3a3a3a;
  background:transparent;color:#fff;padding:11px 15px;font-size:9px;font-weight:900;
  letter-spacing:1.5px;text-transform:uppercase
}
.action-btn:hover{border-color:var(--orange);color:var(--orange)}
.action-btn.orange{background:var(--orange);border-color:var(--orange);color:#050505}

/* POSTS */
.posts-section{padding-top:34px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:17px}
.section-label{color:var(--orange);font-size:9px;font-weight:900;letter-spacing:3px;text-transform:uppercase}
.posts-count{color:#666;font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.posts-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#050505
}
.post-tile{
  position:relative;aspect-ratio:1/1;background:#0b0b0b;overflow:hidden;border:1px solid #171717
}
.post-tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.post-tile:hover img{transform:scale(1.025)}
.post-overlay{
  position:absolute;inset:auto 0 0 0;padding:38px 12px 12px;
  background:linear-gradient(transparent,rgba(0,0,0,.82));opacity:0;transition:.2s
}
.post-tile:hover .post-overlay{opacity:1}
.post-text{font-size:11px;line-height:1.35;color:#fff}
.text-only{display:flex;align-items:center;justify-content:center;padding:22px}
.text-only .post-text{font-size:18px;font-weight:800;text-align:center;max-width:90%}
.empty-posts{
  grid-column:1/-1;min-height:220px;border:1px solid #1d1d1d;display:flex;
  align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px
}
.empty-posts strong{font-size:15px;text-transform:uppercase}
.empty-posts span{margin-top:8px;color:#666;font-size:9px;letter-spacing:1.7px;text-transform:uppercase}

/* MODAL */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:100
}
.modal-backdrop.show{display:flex}
.modal{
  width:min(520px,100%);background:#0b0b0b;border:1px solid #303030;
  box-shadow:0 25px 80px rgba(0,0,0,.55);padding:24px
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.modal-title{font-size:20px;font-weight:950;letter-spacing:-.5px;text-transform:uppercase}
.close-modal{border:0;background:none;color:#777;font-size:22px}
.close-modal:hover{color:#fff}
.field{margin-bottom:15px}
.field label{display:block;color:var(--orange);font-size:8px;font-weight:900;letter-spacing:2px;margin-bottom:7px}
.field input,.field textarea{
  width:100%;background:#050505;color:#fff;border:1px solid #292929;padding:12px 13px;
  outline:none;font-size:12px
}
.field textarea{min-height:88px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--orange)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.status{font-size:10px;color:#777;margin-top:8px;min-height:14px}

/* FOOTER */
footer{
  border-top:1px solid var(--line);padding:22px 5vw;display:flex;justify-content:space-between;
  color:#555;font-size:9px;letter-spacing:1.5px;text-transform:uppercase
}

/* MOBILE */
@media(max-width:800px){
  header{height:68px;padding:0 18px}
  .logo{font-size:19px}
  .header-btn{padding:10px 11px;font-size:8px}
  .profile-hero{width:calc(100% - 36px);padding:28px 0 20px}
  .hero-title{font-size:30px}
  .profile-area{width:calc(100% - 36px);padding-top:25px}
  .profile-top{grid-template-columns:92px 1fr;gap:18px;align-items:start;padding-bottom:24px}
  .avatar{width:88px;height:88px}
  .avatar-placeholder{font-size:29px}
  .change-avatar{font-size:7px;letter-spacing:1px}
  .profile-name{font-size:28px;letter-spacing:-1.5px}
  .profile-username{font-size:10px;margin-top:7px}
  .profile-bio{font-size:11px;margin-top:9px}
  .actions{margin-top:13px}
  .action-btn{padding:9px 10px;font-size:7px;letter-spacing:1px}
  .posts-section{padding-top:24px}
  .posts-grid{grid-template-columns:repeat(3,1fr);gap:2px}
  .post-overlay{display:none}
  .text-only .post-text{font-size:11px}
  footer{padding:18px;flex-direction:column;gap:8px}
}
@media(max-width:460px){
  .home-label{display:none}
  .profile-top{grid-template-columns:78px 1fr;gap:13px}
  .avatar{width:76px;height:76px}
  .profile-name{font-size:24px}
}

/* STORY NEL PROFILO */
.profile-story-wrap{margin-top:16px;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.profile-story-ring{width:78px;height:78px;padding:3px;border-radius:50%;background:linear-gradient(135deg,#ff6a21,#ff4d00,#ff2500);cursor:pointer;display:none}
.profile-story-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid #050505}
.profile-story-label{font-size:9px;font-weight:900;letter-spacing:1.6px;color:#aaa;text-transform:uppercase;display:none}
.profile-story-viewer{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:99999;display:none;align-items:center;justify-content:center}
.profile-story-viewer.show{display:flex}
.profile-story-viewer img{max-width:92vw;max-height:92vh;object-fit:contain}
.profile-story-close{position:absolute;top:22px;right:22px;width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#000;font-size:25px;cursor:pointer}
.profile-story-owner{position:absolute;top:25px;left:25px;color:#fff;font-weight:900;font-size:14px;letter-spacing:.5px}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">FUORI<span>SCHEMA</span></a>
  <div class="header-right">
    <a href="index.html" class="header-btn home"><span>←</span><span class="home-label">HOME</span></a>
    <a href="FSocial.html" class="header-btn">COMMUNITY</a>
    <button id="logoutBtn" class="header-btn orange">ESCI</button>
  </div>
</header>

<section class="profile-hero">
  <div class="eyebrow">01 / MEMBER PROFILE</div>
  <h1 class="hero-title">LA TUA <span>TRACCIA.</span></h1>
</section>

<main class="profile-area">
  <section class="profile-top">
    <div class="avatar-column">
      <div class="avatar">
        <img id="avatarImage" alt="Foto profilo">
        <div id="avatarPlaceholder" class="avatar-placeholder">F</div>
      </div>
      <button id="changeAvatarBtn" class="change-avatar">+ CAMBIA FOTO</button>
      <input type="file" id="avatarInput" accept="image/*">
      <div class="profile-story-wrap">
        <div id="profileStoryRing" class="profile-story-ring" title="Apri Story">
          <img id="profileStoryImage" alt="Story">
        </div>
        <div id="profileStoryLabel" class="profile-story-label">Story attiva</div>
      </div>
    </div>

    <div class="profile-info">
      <div id="profileName" class="profile-name">CARICAMENTO...</div>
      <div id="profileUsername" class="profile-username">@FUORISCHEMA</div>
      <div id="profileBio" class="profile-bio">Fuori dagli schemi. Dentro te stesso.</div>

      <div class="actions">
        <button id="editProfileBtn" class="action-btn orange">MODIFICA PROFILO</button>
        <a href="FSocial.html" class="action-btn">COMMUNITY →</a>
      </div>
    </div>
  </section>

  <section class="posts-section">
    <div class="section-head">
      <div class="section-label">02 / I TUOI POST</div>
      <div id="postsCount" class="posts-count">0 POST</div>
    </div>
    <div id="postsGrid" class="posts-grid"></div>
  </section>
</main>

<footer>
  <span>FUORISCHEMA © 2026</span>
  <span>FUORI DAGLI SCHEMI.</span>
</footer>

<div id="profileStoryViewer" class="profile-story-viewer">
  <div id="profileStoryOwner" class="profile-story-owner"></div>
  <button id="profileStoryClose" class="profile-story-close" type="button">×</button>
  <img id="profileStoryViewerImage" alt="Story">
</div>

<div id="editModal" class="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <div id="modalTitle" class="modal-title">Modifica profilo</div>
      <button id="closeModal" class="close-modal" type="button">×</button>
    </div>

    <div class="field">
      <label for="editName">NOME</label>
      <input id="editName" type="text" maxlength="80">
    </div>
    <div class="field">
      <label for="editUsername">USERNAME</label>
      <input id="editUsername" type="text" maxlength="40" placeholder="es. vincenzo">
    </div>
    <div class="field">
      <label for="editBio">BIO</label>
      <textarea id="editBio" maxlength="180"></textarea>
    </div>
    <div class="field">
      <label for="editInstagram">INSTAGRAM</label>
      <input id="editInstagram" type="text" maxlength="80" placeholder="@tuousername">
    </div>
    <div id="editStatus" class="status"></div>

    <div class="modal-actions">
      <button id="cancelEdit" class="action-btn" type="button">ANNULLA</button>
      <button id="saveEdit" class="action-btn orange" type="button">SALVA</button>
    </div>
  </div>
</div>

<script type="module">
import { supabase } from "./supabase.js";

const profileName = document.getElementById("profileName");
const profileUsername = document.getElementById("profileUsername");
const profileBio = document.getElementById("profileBio");
const avatarImage = document.getElementById("avatarImage");
const avatarPlaceholder = document.getElementById("avatarPlaceholder");
const avatarInput = document.getElementById("avatarInput");
const changeAvatarBtn = document.getElementById("changeAvatarBtn");
const logoutBtn = document.getElementById("logoutBtn");
const editProfileBtn = document.getElementById("editProfileBtn");
const postsGrid = document.getElementById("postsGrid");
const postsCount = document.getElementById("postsCount");
const profileStoryRing = document.getElementById("profileStoryRing");
const profileStoryImage = document.getElementById("profileStoryImage");
const profileStoryLabel = document.getElementById("profileStoryLabel");
const profileStoryViewer = document.getElementById("profileStoryViewer");
const profileStoryViewerImage = document.getElementById("profileStoryViewerImage");
const profileStoryOwner = document.getElementById("profileStoryOwner");
const profileStoryClose = document.getElementById("profileStoryClose");
const STORY_MARKER = "__FS_STORY__";

const editModal = document.getElementById("editModal");
const closeModal = document.getElementById("closeModal");
const cancelEdit = document.getElementById("cancelEdit");
const saveEdit = document.getElementById("saveEdit");
const editStatus = document.getElementById("editStatus");
const editName = document.getElementById("editName");
const editUsername = document.getElementById("editUsername");
const editBio = document.getElementById("editBio");
const editInstagram = document.getElementById("editInstagram");

let currentUser = null;
let currentProfile = null;
let viewedUserId = null;
let isOwnProfile = true;

function escapeHtml(value=""){
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function initials(name="F"){
  return name.trim().split(/\s+/).slice(0,2).map(x => x[0]).join("").toUpperCase() || "F";
}

function formatPostText(text=""){
  return escapeHtml(text).replace(/\n/g,"<br>");
}

async function loadProfileStory(userId){
  profileStoryRing.style.display = "none";
  profileStoryLabel.style.display = "none";
  if(!userId) return;

  const cutoff = new Date(Date.now() - 24*60*60*1000).toISOString();
  const {data,error} = await supabase
    .from("posts")
    .select("id,image_url,created_at")
    .eq("user_id",userId)
    .eq("content",STORY_MARKER)
    .gte("created_at",cutoff)
    .order("created_at",{ascending:false})
    .limit(1);

  if(error || !data?.length || !data[0].image_url) return;

  profileStoryImage.src = data[0].image_url;
  profileStoryRing.style.display = "block";
  profileStoryLabel.style.display = "block";
  profileStoryRing.onclick = () => {
    profileStoryViewerImage.src = data[0].image_url;
    profileStoryOwner.textContent = currentProfile?.username ? `@${String(currentProfile.username).replace(/^@/,'')}` : (currentProfile?.full_name || "FUORISCHEMA");
    profileStoryViewer.classList.add("show");
    document.body.style.overflow = "hidden";
  };
}

profileStoryClose.addEventListener("click",()=>{
  profileStoryViewer.classList.remove("show");
  profileStoryViewerImage.src = "";
  document.body.style.overflow = "";
});
profileStoryViewer.addEventListener("click",e=>{
  if(e.target === profileStoryViewer) profileStoryClose.click();
});

async function loadProfile(){
  const {data:{session}} = await supabase.auth.getSession();

  if(!session){
    window.location.href = "login.html";
    return;
  }

  currentUser = session.user;

  const params = new URLSearchParams(window.location.search);
  const requestedUserId = params.get("id");
  viewedUserId = requestedUserId || currentUser.id;
  isOwnProfile = viewedUserId === currentUser.id;

  const {data:profile,error} = await supabase
    .from("profiles")
    .select("*")
    .eq("id", viewedUserId)
    .maybeSingle();

  if(error){
    console.error(error);
  }

  if(!profile){
    if(!isOwnProfile){
      profileName.textContent = "PROFILO NON TROVATO";
      profileUsername.textContent = "";
      profileBio.textContent = "Questo profilo non è disponibile.";
      postsGrid.innerHTML = `
        <div class="empty-posts">
          <strong>PROFILO NON TROVATO</strong>
          <span>Il membro richiesto non è disponibile.</span>
        </div>`;
      postsCount.textContent = "0 POST";
      editProfileBtn.style.display = "none";
      changeAvatarBtn.style.display = "none";
      return;
    }

    currentProfile = {
      id: currentUser.id,
      full_name: currentUser.user_metadata?.full_name || "MEMBRO FUORISCHEMA",
      username: currentUser.email?.split("@")[0] || "member",
      bio: "Fuori dagli schemi. Dentro te stesso."
    };
  }else{
    currentProfile = profile;
  }

  editProfileBtn.style.display = isOwnProfile ? "" : "none";
  changeAvatarBtn.style.display = isOwnProfile ? "" : "none";

  const heroTitle = document.querySelector(".hero-title");
  const postsLabel = document.querySelector(".section-label");
  if(heroTitle) heroTitle.innerHTML = isOwnProfile ? 'LA TUA <span>TRACCIA.</span>' : 'LA SUA <span>TRACCIA.</span>';
  if(postsLabel) postsLabel.textContent = isOwnProfile ? "02 / I TUOI POST" : "02 / I SUOI POST";

  renderProfile();
  await loadProfileStory(viewedUserId);
  await loadMyPosts();
}

function renderProfile(){
  const name = currentProfile?.full_name || currentUser?.user_metadata?.full_name || "MEMBRO FUORISCHEMA";
  const username = String(currentProfile?.username || currentUser?.email?.split("@")[0] || "member").replace(/^@/,"");
  const bio = currentProfile?.bio || "Fuori dagli schemi. Dentro te stesso.";

  profileName.textContent = name.toUpperCase();
  profileUsername.textContent = "@" + username;
  profileBio.textContent = bio;

  if(currentProfile?.avatar_url){
    avatarImage.src = currentProfile.avatar_url + "?t=" + Date.now();
    avatarImage.style.display = "block";
    avatarPlaceholder.style.display = "none";
  }else{
    avatarImage.style.display = "none";
    avatarPlaceholder.style.display = "flex";
    avatarPlaceholder.textContent = initials(name);
  }
}

async function loadMyPosts(){
  postsGrid.innerHTML = `
    <div class="empty-posts">
      <strong>CARICAMENTO...</strong>
      <span>Stiamo cercando le tue tracce.</span>
    </div>`;

  const {data:rawPosts,error} = await supabase
    .from("posts")
    .select("id,content,image_url,created_at,user_id")
    .eq("user_id", viewedUserId)
    .order("created_at",{ascending:false});
  const posts = (rawPosts || []).filter(post => post.content !== STORY_MARKER);

  if(error){
    console.error(error);
    postsGrid.innerHTML = `
      <div class="empty-posts">
        <strong>ERRORE</strong>
        <span>${escapeHtml(error.message)}</span>
      </div>`;
    postsCount.textContent = "0 POST";
    return;
  }

  postsCount.textContent = `${posts?.length || 0} ${posts?.length === 1 ? "POST" : "POST"}`;

  if(!posts || posts.length === 0){
    postsGrid.innerHTML = `
      <div class="empty-posts">
        <strong>NESSUN POST</strong>
        <span>Lascia la tua prima traccia su FSocial.</span>
      </div>`;
    return;
  }

  postsGrid.innerHTML = posts.map(post => {
    const text = post.content || "";
    if(post.image_url){
      return `
        <article class="post-tile">
          <img src="${escapeHtml(post.image_url)}" alt="Post FUORISCHEMA" loading="lazy">
          ${text ? `<div class="post-overlay"><div class="post-text">${formatPostText(text)}</div></div>` : ""}
        </article>`;
    }
    return `
      <article class="post-tile text-only">
        <div class="post-text">${formatPostText(text || "Nuovo post.")}</div>
      </article>`;
  }).join("");
}

function openEdit(){
  editName.value = currentProfile?.full_name || "";
  editUsername.value = currentProfile?.username || "";
  editBio.value = currentProfile?.bio || "";
  editInstagram.value = currentProfile?.instagram || "";
  editStatus.textContent = "";
  editModal.classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeEdit(){
  editModal.classList.remove("show");
  document.body.style.overflow = "";
}

async function saveProfile(){
  if(!isOwnProfile) return;
  const full_name = editName.value.trim();
  const username = editUsername.value.trim().replace(/^@/,"");
  const bio = editBio.value.trim();
  const instagram = editInstagram.value.trim();

  if(!full_name || !username){
    editStatus.textContent = "Nome e username sono obbligatori.";
    return;
  }

  saveEdit.disabled = true;
  editStatus.textContent = "Salvataggio...";

  const {data,error} = await supabase
    .from("profiles")
    .update({full_name,username,bio,instagram})
    .eq("id",currentUser.id)
    .select("*")
    .single();

  if(error){
    console.error(error);
    editStatus.textContent = "Errore: " + error.message;
    saveEdit.disabled = false;
    return;
  }

  currentProfile = data;
  renderProfile();
  closeEdit();
  saveEdit.disabled = false;
}

logoutBtn.addEventListener("click",async()=>{
  await supabase.auth.signOut();
  window.location.href = "index.html";
});

editProfileBtn.addEventListener("click",openEdit);
closeModal.addEventListener("click",closeEdit);
cancelEdit.addEventListener("click",closeEdit);
saveEdit.addEventListener("click",saveProfile);

editModal.addEventListener("click",e=>{
  if(e.target === editModal) closeEdit();
});

document.addEventListener("keydown",e=>{
  if(e.key === "Escape") {
    closeEdit();
    if(profileStoryViewer.classList.contains("show")) profileStoryClose.click();
  }
});

changeAvatarBtn.addEventListener("click",()=>avatarInput.click());

avatarInput.addEventListener("change",async()=>{
  if(!isOwnProfile) return;
  const file = avatarInput.files?.[0];
  if(!file || !currentUser) return;

  changeAvatarBtn.textContent = "CARICAMENTO...";
  changeAvatarBtn.disabled = true;

  const extension = file.name.split(".").pop().toLowerCase();
  const filePath = `${currentUser.id}/avatar.${extension}`;

  const {error:uploadError} = await supabase.storage
    .from("avatars")
    .upload(filePath,file,{upsert:true});

  if(uploadError){
    console.error(uploadError);
    alert("Non è stato possibile caricare la foto.");
    changeAvatarBtn.textContent = "+ CAMBIA FOTO";
    changeAvatarBtn.disabled = false;
    return;
  }

  const {data} = supabase.storage.from("avatars").getPublicUrl(filePath);
  const avatarUrl = data.publicUrl;

  const {error:updateError} = await supabase
    .from("profiles")
    .update({avatar_url:avatarUrl})
    .eq("id",currentUser.id);

  if(updateError){
    console.error(updateError);
    alert("Foto caricata, ma non è stato possibile salvarla nel profilo.");
    changeAvatarBtn.textContent = "+ CAMBIA FOTO";
    changeAvatarBtn.disabled = false;
    return;
  }

  currentProfile.avatar_url = avatarUrl;
  renderProfile();
  changeAvatarBtn.textContent = "✓ FOTO AGGIORNATA";
  setTimeout(()=>{
    changeAvatarBtn.textContent = "+ CAMBIA FOTO";
    changeAvatarBtn.disabled = false;
  },1500);
});

loadProfile();
</script>
</body>
</html>
