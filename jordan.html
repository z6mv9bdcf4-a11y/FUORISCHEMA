<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FUORISCHEMA — Jordan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        header {
            padding: 30px 6%;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #ff4d00;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .back {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .back:hover {
            color: #ff4d00;
        }

        main {
            padding: 80px 6%;
            max-width: 1300px;
            margin: auto;
        }

        .label {
            color: #ff4d00;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(50px, 9vw, 100px);
            line-height: 0.9;
            margin-bottom: 20px;
        }

        .intro {
            color: #999;
            font-size: 14px;
            margin-bottom: 60px;
        }

        .coming-soon {
            border: 1px solid #222;
            background: #0b0b0b;
            padding: 80px 30px;
            text-align: center;
        }

        .coming-soon-number {
            color: #ff4d00;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .coming-soon h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .coming-soon p {
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">FUORISCHEMA</div>

    <a href="scarpe.html" class="back">
        ← TORNA A SCARPE
    </a>
</header>

<main>

    <div class="label">02 / JORDAN</div>

    <h1>JORDAN</h1>

    <p class="intro">
        SELEZIONE FUORISCHEMA
    </p>

    <div class="coming-soon">

        <div class="coming-soon-number">
            CATALOGO IN AGGIORNAMENTO
        </div>

        <h2>PROSSIMAMENTE</h2>

        <p>
            I prodotti Jordan saranno disponibili a breve.
        </p>

    </div>

</main>

</body>
</html>
