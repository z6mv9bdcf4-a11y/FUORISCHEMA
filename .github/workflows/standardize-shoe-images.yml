name: Standardize shoe product images

on:
  push:
    branches:
      - image-standardization-batch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rembg[cpu]" Pillow

      - name: Generate standardized shoe images
        run: python tools/standardize_shoe_images.py

      - name: Commit generated assets
        run: |
          git config user.name "FUORISCHEMA Image Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/products/standardized products.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Standardize shoe product images"
          git push
