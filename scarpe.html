<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Scarpe — FUORISCHEMA</title>
<meta name="description" content="Scopri tutte le sneakers selezionate da FUORISCHEMA.">

<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="stylesheet" href="cart.css">

<style>
:root{
    --bg:#050505;
    --card:#0a0a0a;
    --text:#f5f5f5;
    --muted:#777;
    --line:#222;
    --orange:#ff5a00;
}

*{box-sizing:border-box;margin:0;padding:0}

html{
    background:var(--bg);
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input{
    font:inherit;
}

header{
    height:68px;
    padding:0 5%;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(5,5,5,.94);
    backdrop-filter:blur(14px);
}

.logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.logo span{
    color:var(--orange);
}

.home-btn{
    min-height:36px;
    padding:0 13px;
    border:1px solid #292929;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:7px;
    font-weight:900;
    letter-spacing:2px;
}

main{
    width:min(1180px,90%);
    margin:0 auto;
    padding:42px 0 90px;
}

.page-top{
    padding-bottom:28px;
    border-bottom:1px solid var(--line);
}

.eyebrow{
    color:var(--orange);
    font-size:8px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:15px;
}

h1{
    font-size:clamp(60px,10vw,120px);
    line-height:.8;
    letter-spacing:-7px;
    font-weight:900;
}

.page-description{
    max-width:520px;
    margin-top:24px;
    color:#888;
    font-size:12px;
    line-height:1.6;
}

.catalog-tools{
    margin-top:28px;
    display:flex;
    gap:8px;
    align-items:stretch;
}

.search{
    flex:1;
    min-width:0;
    height:48px;
    border:1px solid #292929;
    background:#090909;
    color:#f5f5f5;
    padding:0 15px;
    outline:none;
    font-size:11px;
}

.search:focus{
    border-color:#555;
}

.search::placeholder{
    color:#555;
}

.tool-btn{
    height:48px;
    padding:0 20px;
    border:1px solid #292929;
    background:#090909;
    color:#f5f5f5;
    cursor:pointer;
    font-size:8px;
    font-weight:900;
    letter-spacing:1.5px;
}

.tool-btn:hover,
.tool-btn.active{
    border-color:var(--orange);
    color:var(--orange);
}

.filters{
    display:none;
    margin-top:10px;
    padding:18px;
    border:1px solid #292929;
    background:#090909;
}

.filters.open{
    display:block;
}

.filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.filter-title{
    width:100%;
    margin-bottom:5px;
    color:#666;
    font-size:7px;
    font-weight:900;
    letter-spacing:2px;
}

.filter-chip{
    padding:9px 12px;
    border:1px solid #292929;
    background:#050505;
    color:#aaa;
    cursor:pointer;
    font-size:8px;
    font-weight:900;
}

.filter-chip:hover,
.filter-chip.active{
    border-color:var(--orange);
    color:var(--orange);
}

.catalog-meta{
    margin:28px 0 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.catalog-count{
    color:#777;
    font-size:8px;
    font-weight:900;
    letter-spacing:1.5px;
}

.sort-select{
    height:34px;
    padding:0 10px;
    border:1px solid #292929;
    background:#090909;
    color:#aaa;
    outline:none;
    font-size:8px;
    font-weight:900;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px;
}

.product-card{
    min-width:0;
    border:1px solid #222;
    background:#090909;
    overflow:hidden;
    transition:.2s ease;
}

.product-card:hover{
    border-color:#555;
    transform:translateY(-3px);
}

.product-image{
    aspect-ratio:1/1;
    background:#111;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.product-info{
    padding:14px;
    min-width:0;
}

.product-brand{
    color:#666;
    font-size:7px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:6px;
}

.product-name{
    min-height:34px;
    font-size:13px;
    line-height:1.15;
    font-weight:900;
    overflow-wrap:anywhere;
}

.product-price{
    margin-top:12px;
    font-size:14px;
    font-weight:900;
}

.product-cta{
    display:block;
    margin-top:13px;
    padding-top:11px;
    border-top:1px solid #222;
    color:var(--orange);
    font-size:8px;
    font-weight:900;
    letter-spacing:1.5px;
}

.empty{
    grid-column:1/-1;
    padding:50px 20px;
    border:1px solid #222;
    color:#555;
    text-align:center;
    font-size:8px;
    font-weight:900;
    letter-spacing:2px;
}

.bottom-note{
    margin-top:70px;
    padding-top:18px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    color:#444;
    font-size:7px;
    font-weight:900;
    letter-spacing:2px;
}

@media(max-width:700px){
    header{
        height:62px;
        padding:0 13px;
    }

    .logo{
        font-size:17px;
    }

    .home-btn{
        min-height:33px;
        padding:0 10px;
        font-size:6px;
    }

    main{
        width:calc(100% - 26px);
        padding:28px 0 65px;
    }

    h1{
        font-size:clamp(48px,15vw,65px);
        letter-spacing:-4px;
        line-height:.82;
    }

    .page-description{
        font-size:10px;
    }

    .catalog-tools{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .search{
        grid-column:1/-1;
    }

    .tool-btn{
        width:100%;
    }

    .catalog-meta{
        margin-top:22px;
    }

    .product-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:8px;
    }

    .product-info{
        padding:10px;
    }

    .product-brand{
        font-size:6px;
    }

    .product-name{
        font-size:10px;
        line-height:1.2;
        min-height:30px;
    }

    .product-price{
        font-size:13px;
        margin-top:9px;
    }

    .product-cta{
        font-size:7px;
        margin-top:10px;
        padding-top:10px;
        line-height:1.3;
    }

    .bottom-note{
        display:block;
        line-height:2;
        font-size:6px;
    }
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">FUORI<span>SCHEMA</span></a>
    <a href="index.html" class="home-btn">HOME</a>
</header>

<main>

<section class="page-top">
    <div class="eyebrow">SCARPE</div>
    <h1>SNEAKERS</h1>
    <p class="page-description">
        Scopri tutte le sneakers selezionate da FUORISCHEMA.
        Cerca un modello o filtra la selezione per brand.
    </p>

    <div class="catalog-tools">
        <input
            id="searchInput"
            class="search"
            type="search"
            placeholder="Cerca sneakers, brand o modello..."
            autocomplete="off"
        >
        <button id="filterBtn" class="tool-btn" type="button">FILTRA</button>
        <button id="sortBtn" class="tool-btn" type="button">ORDINA</button>
    </div>

    <div id="filters" class="filters">
        <div class="filter-row">
            <div class="filter-title">BRAND</div>
            <button class="filter-chip active" type="button" data-brand="ALL">TUTTI</button>
            <div id="brandFilters"></div>
        </div>
    </div>
</section>

<div class="catalog-meta">
    <div id="catalogCount" class="catalog-count">0 PRODOTTI</div>

    <select id="sortSelect" class="sort-select" aria-label="Ordina prodotti">
        <option value="default">RILEVANZA</option>
        <option value="name">A-Z</option>
        <option value="brand">BRAND</option>
    </select>
</div>

<section>
    <div id="productGrid" class="product-grid"></div>
</section>

<div class="bottom-note">
    <span>FUORISCHEMA / FOOTWEAR</span>
    <span>SCARPE / SNEAKERS</span>
</div>

</main>

<script src="products.js"></script>

<script>
(function(){

    const searchInput = document.getElementById("searchInput");
    const filterBtn = document.getElementById("filterBtn");
    const sortBtn = document.getElementById("sortBtn");
    const filters = document.getElementById("filters");
    const brandFilters = document.getElementById("brandFilters");
    const sortSelect = document.getElementById("sortSelect");
    const productGrid = document.getElementById("productGrid");
    const catalogCount = document.getElementById("catalogCount");

    if(typeof FUORISCHEMA_PRODUCTS === "undefined") return;

    const products = Object.values(FUORISCHEMA_PRODUCTS)
        .filter(product =>
            String(product.category || "").toUpperCase() === "SCARPE"
        );

    let selectedBrand = "ALL";

    const brands = [...new Set(
        products
            .map(product => String(product.brand || "").trim())
            .filter(Boolean)
    )].sort((a,b) => a.localeCompare(b));

    brands.forEach(brand => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "filter-chip";
        button.dataset.brand = brand;
        button.textContent = brand;
        brandFilters.appendChild(button);
    });

    function render(){

        const query = searchInput.value.trim().toLowerCase();
        const sort = sortSelect.value;

        let visible = products.filter(product => {

            const matchesBrand =
                selectedBrand === "ALL" ||
                String(product.brand || "").toUpperCase() === selectedBrand.toUpperCase();

            const searchable = [
                product.name,
                product.brand,
                product.type,
                product.code
            ].filter(Boolean).join(" ").toLowerCase();

            return matchesBrand && (!query || searchable.includes(query));
        });

        if(sort === "name"){
            visible.sort((a,b) =>
                String(a.name || "").localeCompare(String(b.name || ""))
            );
        }

        if(sort === "brand"){
            visible.sort((a,b) =>
                String(a.brand || "").localeCompare(String(b.brand || "")) ||
                String(a.name || "").localeCompare(String(b.name || ""))
            );
        }

        catalogCount.textContent =
            visible.length + (visible.length === 1 ? " PRODOTTO" : " PRODOTTI");

        productGrid.innerHTML = "";

        if(!visible.length){
            productGrid.innerHTML =
                '<div class="empty">NESSUN PRODOTTO TROVATO</div>';
            return;
        }

        visible.forEach(product => {

            const card = document.createElement("a");

            card.className = "product-card";
            card.href =
                "prodotto.html?id=" +
                encodeURIComponent(product.id);

            const price =
                typeof product.price === "number"
                    ? product.price.toLocaleString("it-IT",{
                        style:"currency",
                        currency:"EUR"
                    })
                    : "";

            card.innerHTML = `
                <div class="product-image">
                    <img
                        src="${product.image}"
                        alt="${product.name || ""}"
                        loading="lazy"
                    >
                </div>

                <div class="product-info">
                    <div class="product-brand">
                        ${product.brand || ""}
                    </div>

                    <div class="product-name">
                        ${product.name || ""}
                    </div>

                    ${price
                        ? `<div class="product-price">${price}</div>`
                        : ""
                    }

                    <span class="product-cta">
                        SCOPRI IL PRODOTTO →
                    </span>
                </div>
            `;

            productGrid.appendChild(card);
        });
    }

    filterBtn.addEventListener("click", () => {
        filters.classList.toggle("open");
        filterBtn.classList.toggle("active");
    });

    sortBtn.addEventListener("click", () => {
        sortSelect.focus();
        sortSelect.click();
    });

    searchInput.addEventListener("input", render);
    sortSelect.addEventListener("change", render);

    brandFilters.addEventListener("click", event => {

        const button = event.target.closest(".filter-chip");

        if(!button) return;

        selectedBrand = button.dataset.brand;

        document
            .querySelectorAll(".filter-chip")
            .forEach(chip => chip.classList.remove("active"));

        button.classList.add("active");

        render();
    });

    render();

})();
</script>

<script src="cart.js"></script>

</body>
</html>
