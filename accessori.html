<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Accessori — FUORISCHEMA</title>
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-192.png">
<meta name="description" content="undefined">
<link rel="canonical" href="https://fuorischemastore.it/accessori.html">

<style>
:root{--bg:#050505;--panel:#0b0b0b;--panel2:#101010;--text:#f5f5f5;--muted:#777;--muted2:#4d4d4d;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);--orange:#ff4d00;--max:1280px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,select{font:inherit}
.topbar{position:sticky;top:0;z-index:50;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:rgba(5,5,5,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:1000;letter-spacing:-1.6px}.brand-white{color:#fff}.brand-orange{color:var(--orange)}
.home{min-height:38px;padding:0 14px;display:flex;align-items:center;border:1px solid var(--line2);color:#ddd;font-size:8px;font-weight:900;letter-spacing:1.7px}.home:hover{border-color:var(--orange);color:var(--orange)}
.page{width:min(calc(100% - 44px),var(--max));margin:0 auto;padding:58px 0 90px}
.header{padding-bottom:30px;border-bottom:1px solid var(--line)}
.kicker{color:var(--orange);font-size:9px;font-weight:900;letter-spacing:3px}
h1{margin-top:10px;font-size:clamp(64px,10vw,126px);line-height:.82;letter-spacing:-7px;font-weight:1000;text-transform:uppercase}
.intro{margin-top:18px;color:#777;font-size:10px;font-weight:700;letter-spacing:1.5px;line-height:1.6}
.tools{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin:24px 0 14px}
.search{height:46px;width:100%;padding:0 15px;background:var(--panel);border:1px solid var(--line);outline:none;color:#fff;font-size:10px;font-weight:700;letter-spacing:1px}
.search::placeholder{color:#555;text-transform:uppercase;letter-spacing:1.8px}
.search:focus{border-color:var(--orange)}
.tool-btn{height:46px;padding:0 17px;background:transparent;border:1px solid var(--line2);color:#aaa;cursor:pointer;font-size:8px;font-weight:900;letter-spacing:1.5px}
.tool-btn:hover,.tool-btn.active{color:#050505;background:var(--orange);border-color:var(--orange)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:12px;color:#555;font-size:8px;font-weight:900;letter-spacing:2px}
.filters{display:none;padding:14px;margin-bottom:16px;background:var(--panel);border:1px solid var(--line)}
.filters.open{display:block}
.filter-title{color:#777;font-size:7px;font-weight:900;letter-spacing:2px;margin-bottom:9px}
.filter-group{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.filter-group:last-child{margin-bottom:0}
.filter-chip{min-height:32px;padding:0 11px;background:#080808;border:1px solid var(--line);color:#777;cursor:pointer;font-size:7px;font-weight:900;letter-spacing:1.3px}
.filter-chip:hover,.filter-chip.active{color:#050505;background:var(--orange);border-color:var(--orange)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{min-width:0;background:var(--panel);border:1px solid var(--line);transition:transform .2s ease,border-color .2s ease}
.card:hover{transform:translateY(-3px);border-color:var(--line2)}
.image{position:relative;aspect-ratio:1/1.03;display:grid;place-items:center;overflow:hidden;background:#090909;border-bottom:1px solid var(--line)}
.image img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;top:9px;left:9px;padding:6px 7px;background:var(--orange);color:#050505;font-size:6px;font-weight:1000;letter-spacing:1.2px}
.info{padding:12px 13px 13px}.brand-name{color:#666;font-size:7px;font-weight:900;letter-spacing:1.8px}.name{margin-top:6px;color:#eee;font-size:12px;font-weight:900;line-height:1.25}.type{margin-top:5px;color:#555;font-size:8px;line-height:1.35}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;padding-top:10px;border-top:1px solid var(--line)}
.price{color:#eee;font-size:10px;font-weight:900}.price.missing{color:#555;font-size:7px;letter-spacing:1px}.arrow{color:#777;font-size:15px}
.card:hover .arrow{color:var(--orange);transform:translateX(3px)}
.empty{display:none;padding:70px 20px;text-align:center;border:1px dashed var(--line2)}.empty.show{display:block}.empty strong{display:block;font-size:22px}.empty span{display:block;margin-top:8px;color:#666;font-size:9px;letter-spacing:1px}
.footer{display:flex;justify-content:space-between;margin-top:70px;padding-top:18px;border-top:1px solid var(--line);color:#444;font-size:7px;font-weight:900;letter-spacing:2px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){
.topbar{height:64px;padding:0 15px}.brand{font-size:18px}.home{min-height:35px;padding:0 10px;font-size:7px}
.page{width:calc(100% - 24px);padding:35px 0 70px}.header{padding-bottom:24px}h1{font-size:clamp(58px,19vw,88px);letter-spacing:-4px}.intro{font-size:8px;letter-spacing:1px}
.tools{grid-template-columns:1fr auto auto;gap:6px;margin-top:20px}.search{height:42px;padding:0 12px}.tool-btn{height:42px;padding:0 11px;font-size:7px}
.meta{font-size:7px;letter-spacing:1.4px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.image{aspect-ratio:1/1.04}.info{padding:10px}.brand-name{font-size:6px}.name{font-size:10px;margin-top:5px}.type{font-size:7px;margin-top:4px}.bottom{margin-top:9px;padding-top:8px}.price{font-size:9px}.price.missing{font-size:6px}.arrow{font-size:12px}
.footer{flex-direction:column;gap:8px}
}
</style>
<link rel="stylesheet" href="cart.css">
</head>
<body>
<header class="topbar">
<a href="index.html" class="brand"><span class="brand-white">FUORI</span><span class="brand-orange">SCHEMA</span></a>
<a href="index.html" class="home">HOME</a>
</header>

<main class="page">
<section class="header">
<div class="kicker">ACCESSORI</div>
<h1>ACCESSORI</h1>
<p class="intro">Borse e altri accessori FUORISCHEMA. Cerca e filtra la selezione.</p>
</section>

<section class="tools" aria-label="Ricerca e filtri">
<input id="search" class="search" type="search" autocomplete="off" placeholder="CERCA PRODOTTI">
<button id="filterBtn" class="tool-btn" type="button">FILTRA</button>
<button id="sortBtn" class="tool-btn" type="button">ORDINA</button>
</section>

<section id="filters" class="filters">
<div class="filter-title">BRAND</div>
<div id="brandFilters" class="filter-group"></div>
<div class="filter-title">CATEGORIA</div>
<div id="categoryFilters" class="filter-group"></div>
</section>

<div class="meta"><span id="resultLabel">TUTTI GLI ACCESSORI</span><span id="count"></span></div>
<section id="grid" class="grid"></section>
<section id="empty" class="empty"><strong>NESSUN PRODOTTO</strong><span>Prova a cambiare ricerca o filtri.</span></section>

<footer class="footer"><span>FUORISCHEMA</span><span>ACCESSORIES</span></footer>
</main>

<script src="products.js"></script>
<script src="cart.js"></script>
<script>
const CATEGORY_GROUP = "ACCESSORI";
const products = Object.values(window.FUORISCHEMA_PRODUCTS || {}).filter(product => {
    if(CATEGORY_GROUP === "SCARPE") return product.category === "SCARPE";
    if(CATEGORY_GROUP === "ABBIGLIAMENTO") return ["TUTE","GIACCHE","MAGLIERIA","PANTALONI","JEANS","T-SHIRT","TSHIRT"].includes(product.category);
    if(CATEGORY_GROUP === "ACCESSORI") return ["BORSE","PORTAFOGLI","CAPPELLI"].includes(product.category);
    return false;
});

const state = {query:"", brand:"TUTTI", category:"TUTTE", sort:"default"};

const search = document.getElementById("search");
const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const count = document.getElementById("count");
const filters = document.getElementById("filters");
const filterBtn = document.getElementById("filterBtn");
const sortBtn = document.getElementById("sortBtn");

function esc(value){
    return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
}

function unique(values){ return [...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b)); }

function renderFilters(){
    const brands = unique(products.map(p=>p.brand));
    const categories = unique(products.map(p=>p.category));
    document.getElementById("brandFilters").innerHTML =
        ['TUTTI',...brands].map(value => '<button class="filter-chip '+(state.brand===value?'active':'')+'" data-brand="'+esc(value)+'">'+esc(value)+'</button>').join("");
    document.getElementById("categoryFilters").innerHTML =
        ['TUTTE',...categories].map(value => '<button class="filter-chip '+(state.category===value?'active':'')+'" data-category="'+esc(value)+'">'+esc(value)+'</button>').join("");
}

function visibleProducts(){
    let list = products.filter(product => {
        const haystack = [product.name,product.brand,product.category,product.type,product.code].join(" ").toLowerCase();
        const matchesSearch = !state.query || haystack.includes(state.query);
        const matchesBrand = state.brand==="TUTTI" || product.brand===state.brand;
        const matchesCategory = state.category==="TUTTE" || product.category===state.category;
        return matchesSearch && matchesBrand && matchesCategory;
    });

    if(state.sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
    if(state.sort==="brand") list.sort((a,b)=>a.brand.localeCompare(b.brand) || a.name.localeCompare(b.name));
    if(state.sort==="new") list.sort((a,b)=>((b.filter==="new")?1:0)-((a.filter==="new")?1:0));

    return list;
}

function render(){
    const list = visibleProducts();
    count.textContent = list.length + (list.length===1 ? " PRODOTTO" : " PRODOTTI");
    empty.classList.toggle("show", list.length===0);

    grid.innerHTML = list.map(product => {
        const price = product.price != null && product.price !== "" ? esc(product.price)+" €" : '<span class="price missing">PREZZO IN ARRIVO</span>';
        const badge = product.label ? '<span class="badge">'+esc(product.label)+'</span>' : "";
        return '<a class="card" href="prodotto.html?id='+encodeURIComponent(product.id)+'">'+
            '<div class="image">'+badge+'<img src="'+esc(product.image)+'" alt="'+esc(product.name)+'" loading="lazy"></div>'+
            '<div class="info">'+
                '<div class="brand-name">'+esc(product.brand)+'</div>'+
                '<div class="name">'+esc(product.name)+'</div>'+
                '<div class="type">'+esc(product.type || "")+'</div>'+
                '<div class="bottom"><span class="price">'+price+'</span><span class="arrow">→</span></div>'+
            '</div>'+
        '</a>';
    }).join("");
}

filterBtn.addEventListener("click",()=>{
    filters.classList.toggle("open");
    filterBtn.classList.toggle("active",filters.classList.contains("open"));
});

sortBtn.addEventListener("click",()=>{
    const options=[["default","RILEVANZA"],["new","NUOVI"],["name","A-Z"],["brand","BRAND"]];
    const index=options.findIndex(item=>item[0]===state.sort);
    state.sort=options[(index+1)%options.length][0];
    sortBtn.textContent="ORDINA: "+options[(index+1)%options.length][1];
    render();
});

search.addEventListener("input",event=>{
    state.query=event.target.value.trim().toLowerCase();
    render();
});

filters.addEventListener("click",event=>{
    const button=event.target.closest(".filter-chip");
    if(!button) return;
    if(button.dataset.brand) state.brand=button.dataset.brand;
    if(button.dataset.category) state.category=button.dataset.category;
    renderFilters();
    render();
});

renderFilters();
render();
</script>
</body>
</html>
