<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>REIMPOSTA PASSWORD — FUORISCHEMA</title>

    <link rel="stylesheet" href="mobile-fixes.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --nero: #050505;
            --bianco: #f4f4f2;
            --arancio: #ff4d00;
            --grigio: #888;
            --linea: #242424;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--nero);
            color: var(--bianco);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            padding: 28px 38px;
            border-bottom: 1px solid var(--linea);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1.5px;
        }

        .back {
            font-size: 12px;
            font-weight: 800;
        }

        .back:hover {
            color: var(--arancio);
        }

        main {
            min-height: calc(100vh - 150px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
        }

        .reset-wrapper {
            width: 100%;
            max-width: 520px;
        }

        .eyebrow {
            color: var(--arancio);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(50px, 9vw, 96px);
            line-height: .85;
            letter-spacing: -5px;
            font-weight: 900;
            margin-bottom: 30px;
        }

        h1 span {
            color: var(--arancio);
        }

        .intro {
            color: #999;
            font-size: 14px;
            line-height: 1.7;
            max-width: 470px;
            margin-bottom: 45px;
        }

        .form-section {
            border-top: 1px solid var(--linea);
            padding-top: 30px;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #888;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            background: transparent;
            border: 1px solid var(--linea);
            color: var(--bianco);
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: border-color .25s ease;
        }

        input:focus {
            border-color: var(--arancio);
        }

        input::placeholder {
            color: #555;
        }

        .submit-button {
            width: 100%;
            height: 58px;
            margin-top: 12px;
            border: 1px solid var(--arancio);
            background: var(--arancio);
            color: var(--nero);
            font-family: inherit;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: .5px;
            cursor: pointer;
            transition: all .25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .submit-button:hover {
            background: transparent;
            color: var(--arancio);
        }

        .submit-button:disabled {
            opacity: .65;
            pointer-events: none;
        }

        .submit-button span {
            font-size: 20px;
        }

        .message {
            display: none;
            margin-top: 24px;
            border: 1px solid var(--linea);
            padding: 18px;
            color: #999;
            font-size: 12px;
            line-height: 1.6;
        }

        .message.active {
            display: block;
        }

        .message.success {
            border-color: var(--arancio);
        }

        .message strong {
            display: block;
            color: var(--bianco);
            margin-bottom: 6px;
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        .footer-link {
            border-top: 1px solid var(--linea);
            margin-top: 35px;
            padding-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .footer-link span {
            color: #777;
            font-size: 11px;
        }

        .footer-link a {
            color: var(--bianco);
            font-size: 11px;
            font-weight: 800;
        }

        .footer-link a:hover {
            color: var(--arancio);
        }

        footer {
            border-top: 1px solid var(--linea);
            padding: 22px 38px;
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 10px;
            font-weight: 700;
        }

        @media (max-width: 700px) {
            header {
                padding: 22px 20px;
            }

            .brand {
                font-size: 20px;
            }

            main {
                padding: 55px 20px;
                align-items: flex-start;
            }

            .reset-wrapper {
                padding-top: 15px;
            }

            h1 {
                font-size: clamp(48px, 15vw, 76px);
                letter-spacing: -4px;
            }

            .intro {
                font-size: 13px;
            }

            footer {
                padding: 20px;
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="brand">FUORISCHEMA</a>
    <a href="login.html" class="back">← LOGIN</a>
</header>

<main>
    <div class="reset-wrapper">

        <div class="eyebrow">03 / PASSWORD RECOVERY</div>

        <h1>
            NUOVA<br>
            <span>PASSWORD.</span>
        </h1>

        <p class="intro">
            Scegli una nuova password per il tuo account FUORISCHEMA.
            Usa una password che non hai già utilizzato altrove.
        </p>

        <section class="form-section">

            <div class="field">
                <label for="newPassword">NUOVA PASSWORD</label>
                <input
                    id="newPassword"
                    class="mobile-safe-input"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Inserisci la nuova password"
                >
            </div>

            <div class="field">
                <label for="confirmPassword">CONFERMA PASSWORD</label>
                <input
                    id="confirmPassword"
                    class="mobile-safe-input"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Ripeti la nuova password"
                >
            </div>

            <button id="savePasswordBtn" class="submit-button" type="button">
                SALVA NUOVA PASSWORD
                <span id="buttonArrow">→</span>
            </button>

            <div id="message" class="message" aria-live="polite">
                <strong id="messageTitle"></strong>
                <span id="messageText"></span>
            </div>

        </section>

        <div class="footer-link">
            <span>HAI CAMBIATO IDEA?</span>
            <a href="login.html">TORNA AL LOGIN →</a>
        </div>

    </div>
</main>

<footer>
    <span>FUORISCHEMA © 2026</span>
    <span>PASSWORD RECOVERY</span>
</footer>

<script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_URL, SUPABASE_KEY } from "./supabase.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const saveButton = document.getElementById("savePasswordBtn");
    const buttonArrow = document.getElementById("buttonArrow");
    const message = document.getElementById("message");
    const messageTitle = document.getElementById("messageTitle");
    const messageText = document.getElementById("messageText");

    function showMessage(type, title, text) {
        message.className = "message active " + (type === "success" ? "success" : "");
        messageTitle.textContent = title;
        messageText.textContent = text;
    }

    function setLoading(isLoading) {
        saveButton.disabled = isLoading;
        buttonArrow.textContent = isLoading ? "◌" : "→";

        if (isLoading) {
            buttonArrow.style.animation = "spin .8s linear infinite";
        } else {
            buttonArrow.style.animation = "";
        }
    }

    const style = document.createElement("style");
    style.textContent = "@keyframes spin { to { transform: rotate(360deg); } }";
    document.head.appendChild(style);

    // Quando l'utente arriva dal link email di recupero,
    // Supabase crea/aggiorna automaticamente la sessione recovery.
    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
        showMessage(
            "error",
            "LINK NON VALIDO.",
            "Questa sessione di recupero non è più disponibile. Richiedi un nuovo link dalla pagina di accesso."
        );
    }

    saveButton.addEventListener("click", async () => {
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        message.className = "message";
        messageTitle.textContent = "";
        messageText.textContent = "";

        if (!newPassword || !confirmPassword) {
            showMessage(
                "error",
                "DATI MANCANTI.",
                "Inserisci la nuova password in entrambi i campi."
            );
            return;
        }

        if (newPassword.length < 8) {
            showMessage(
                "error",
                "PASSWORD TROPPO CORTA.",
                "La password deve contenere almeno 8 caratteri."
            );
            return;
        }

        if (newPassword !== confirmPassword) {
            showMessage(
                "error",
                "LE PASSWORD NON COINCIDONO.",
                "Controlla i due campi e riprova."
            );
            return;
        }

        const { data: { session: activeSession } } = await supabase.auth.getSession();

        if (!activeSession) {
            showMessage(
                "error",
                "SESSIONE SCADUTA.",
                "Il link di recupero non è più valido. Torna al login e richiedi un nuovo link."
            );
            return;
        }

        setLoading(true);

        const { error } = await supabase.auth.updateUser({
            password: newPassword
        });

        setLoading(false);

        if (error) {
            showMessage(
                "error",
                "OPERAZIONE NON RIUSCITA.",
                "Non è stato possibile aggiornare la password. Richiedi un nuovo link e riprova."
            );
            return;
        }

        showMessage(
            "success",
            "PASSWORD AGGIORNATA.",
            "La tua nuova password è stata salvata. Ora puoi accedere al tuo account FUORISCHEMA."
        );

        newPasswordInput.value = "";
        confirmPasswordInput.value = "";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 2200);
    });

    [newPasswordInput, confirmPasswordInput].forEach(input => {
        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !saveButton.disabled) {
                saveButton.click();
            }
        });
    });
</script>

</body>
</html>
