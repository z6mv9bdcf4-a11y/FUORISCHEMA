<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Catalogo — FUORISCHEMA</title>

<style>
:root{
    --bg:#050505;
    --text:#f5f5f5;
    --line:rgba(255,255,255,.12);
    --orange:#ff4d00;
    --max:1120px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%,rgba(255,77,0,.10),transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:Inter,Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
}

a{color:inherit;text-decoration:none}

.topbar{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 42px;
    border-bottom:1px solid var(--line);
    background:rgba(5,5,5,.92);
}

.brand{
    font-size:22px;
    font-weight:1000;
    letter-spacing:-1.8px;
}

.brand-white{color:#fff}
.brand-orange{color:var(--orange)}

.home-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:90px;
    height:44px;
    padding:0 17px;
    border:1px solid var(--line);
    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
    transition:.2s ease;
}

.home-btn:hover{
    color:var(--orange);
    border-color:var(--orange);
}

.page{
    width:min(calc(100% - 48px),var(--max));
    margin:0 auto;
    padding:70px 0 90px;
}

.hero{margin-bottom:68px}

.kicker{
    margin-bottom:18px;
    color:var(--orange);
    font-size:10px;
    font-weight:1000;
    letter-spacing:4px;
}

h1{
    font-size:clamp(70px,11vw,142px);
    line-height:.78;
    font-weight:1000;
    letter-spacing:-8px;
}

.hero-sub{
    margin-top:28px;
    color:#858585;
    font-size:10px;
    font-weight:900;
    letter-spacing:3px;
    text-transform:uppercase;
}

.categories{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:14px;
}

.category{
    position:relative;
    min-width:0;
    min-height:410px;
    padding:28px 30px 30px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    overflow:hidden;
    border:1px solid var(--line);
    background:linear-gradient(145deg,rgba(255,255,255,.025),rgba(255,255,255,.008));
    transition:transform .25s ease,border-color .25s ease,background .25s ease;
}

.category::after{
    content:"";
    position:absolute;
    right:-20px;
    bottom:-55px;
    font-size:190px;
    line-height:1;
    font-weight:1000;
    letter-spacing:-14px;
    color:rgba(255,255,255,.018);
    pointer-events:none;
}

.category:nth-child(1)::after{content:"01"}
.category:nth-child(2)::after{content:"02"}
.category:nth-child(3)::after{content:"03"}

.category:hover{
    transform:translateY(-5px);
    border-color:rgba(255,77,0,.7);
    background:linear-gradient(145deg,rgba(255,77,0,.07),rgba(255,255,255,.008));
}

.category-number{
    position:relative;
    z-index:2;
    color:var(--orange);
    font-size:9px;
    font-weight:1000;
    letter-spacing:4px;
}

.category-arrow{
    position:absolute;
    top:27px;
    right:28px;
    z-index:2;
    color:#777;
    font-size:25px;
    line-height:1;
    transition:.2s ease;
}

.category:hover .category-arrow{
    color:var(--orange);
    transform:translateX(4px);
}

.category-bottom{
    position:relative;
    z-index:2;
    min-width:0;
}

/* IMPORTANT:
   The titles are sized against the card instead of the whole viewport.
   This keeps every category name on one line. */
.category-title{
    display:block;
    width:100%;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:clip;
    font-size:clamp(24px,2.1vw,32px);
    line-height:.9;
    font-weight:1000;
    letter-spacing:-2.4px;
}

.category-title.shoes{
    font-size:clamp(38px,3.25vw,50px);
    letter-spacing:-3px;
}

.category-title.accessories{
    font-size:clamp(24px,2.1vw,32px);
    letter-spacing:-2.5px;
}

.category-status{
    margin-top:16px;
    color:#555;
    font-size:8px;
    font-weight:900;
    letter-spacing:2.5px;
    text-transform:uppercase;
}

.footer{
    display:flex;
    justify-content:space-between;
    gap:20px;
    margin-top:72px;
    padding-top:20px;
    border-top:1px solid var(--line);
    color:#444;
    font-size:8px;
    font-weight:900;
    letter-spacing:3px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    z-index:50;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    padding:12px 17px;
    border:1px solid rgba(255,255,255,.14);
    background:#111;
    color:#fff;
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    transition:.2s ease;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:850px){
    .topbar{
        height:68px;
        padding:0 22px;
    }

    .brand{font-size:19px}

    .page{
        width:min(calc(100% - 30px),620px);
        padding:48px 0 70px;
    }

    .hero{margin-bottom:42px}

    h1{
        font-size:clamp(64px,17vw,105px);
        letter-spacing:-6px;
    }

    .categories{
        grid-template-columns:1fr;
        gap:12px;
    }

    .category{
        min-height:285px;
        padding:24px;
    }

    .category-title{
        font-size:clamp(28px,7vw,45px);
        letter-spacing:-3px;
    }

    .category-title.shoes{
        font-size:clamp(40px,10vw,62px);
        letter-spacing:-3.5px;
    }

    .category-title.accessories{
        font-size:clamp(28px,7vw,45px);
        letter-spacing:-3px;
    }

    .category-arrow{
        top:24px;
        right:24px;
    }

    .footer{
        flex-direction:column;
        gap:9px;
    }
}

@media(max-width:430px){
    .topbar{padding:0 15px}

    .home-btn{
        min-width:78px;
        height:38px;
        padding:0 12px;
        font-size:8px;
    }

    .page{
        width:calc(100% - 22px);
        padding-top:38px;
    }

    h1{
        font-size:62px;
        letter-spacing:-4px;
    }

    .hero-sub{
        font-size:8px;
        letter-spacing:2.4px;
    }

    .category{
        min-height:260px;
        padding:21px;
    }

    .category-title{
        font-size:clamp(30px,8.9vw,42px);
        letter-spacing:-2.5px;
    }

    .category-title.shoes{
        font-size:clamp(36px,10.5vw,48px);
        letter-spacing:-3px;
    }

    .category-title.accessories{
        font-size:clamp(30px,8.9vw,42px);
        letter-spacing:-2.5px;
    }

    .category-arrow{
        top:21px;
        right:21px;
        font-size:22px;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <a href="index.html" class="brand" aria-label="FUORISCHEMA Home">
        <span class="brand-white">FUORI</span><span class="brand-orange">SCHEMA</span>
    </a>
    <a href="index.html" class="home-btn">← HOME</a>
</header>

<main class="page">

    <section class="hero">
        <div class="kicker">01 / CATALOGO</div>
        <h1>CATALOGO</h1>
        <div class="hero-sub">SCEGLI DA DOVE INIZIARE</div>
    </section>

    <section class="categories" aria-label="Categorie catalogo">

        <a class="category" href="scarpe.html">
            <div>
                <div class="category-number">001</div>
                <div class="category-arrow">→</div>
            </div>
            <div class="category-bottom">
                <div class="category-title shoes">SCARPE</div>
            </div>
        </a>

        <a class="category" href="abbigliamento.html">
            <div>
                <div class="category-number">002</div>
                <div class="category-arrow">→</div>
            </div>
            <div class="category-bottom">
                <div class="category-title">ABBIGLIAMENTO</div>
            </div>
        </a>

        <a class="category" href="#" id="accessoriCard">
            <div>
                <div class="category-number">003</div>
                <div class="category-arrow">→</div>
            </div>
            <div class="category-bottom">
                <div class="category-title accessories">ACCESSORI</div>
            </div>
        </a>

    </section>

    <footer class="footer">
        <span>FUORISCHEMA</span>
        <span>CATALOGO / 01</span>
    </footer>

</main>

<div id="toast" class="toast">ACCESSORI — PROSSIMAMENTE</div>

<script>
const accessoriCard=document.getElementById("accessoriCard");
const toast=document.getElementById("toast");

accessoriCard.addEventListener("click",function(event){
    event.preventDefault();
    toast.classList.add("show");
    clearTimeout(window.__catalogoToast);
    window.__catalogoToast=setTimeout(()=>{
        toast.classList.remove("show");
    },2200);
});
</script>

</body>
</html>
