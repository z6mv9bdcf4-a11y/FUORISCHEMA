<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>ACCEDI — FUORISCHEMA</title><script type="module" src="./supabase.js"></script></head><body><main><h1>ACCEDI</h1><input id="email" type="email"><input id="password" type="password"><button id="login">ACCEDI</button><button id="forgot">PASSWORD DIMENTICATA</button><pre id="debug"></pre></main><script type="module">import {supabase} from './supabase.js'; const debug=document.getElementById('debug'); document.getElementById('login').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value; debug.textContent='Login in corso...'; const {data,error}=await supabase.auth.signInWithPassword({email,password}); debug.textContent=error?JSON.stringify({name:error.name,message:error.message,status:error.status,code:error.code},null,2):JSON.stringify({success:true,user:data.user?.email,session:!!data.session},null,2);}; document.getElementById('forgot').onclick=async()=>{const email=document.getElementById('email').value.trim(); debug.textContent='Recovery in corso...'; const {data,error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:'https://fuorischemastore.it/reset-password.html'}); debug.textContent=error?JSON.stringify({name:error.name,message:error.message,status:error.status,code:error.code},null,2):'Recovery richiesta inviata.';};</script></body></html>
