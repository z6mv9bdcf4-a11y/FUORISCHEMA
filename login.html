<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACCEDI — FUORISCHEMA</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --nero: #050505;
            --bianco: #f4f4f2;
            --arancio: #ff4d00;
            --grigio: #888;
            --linea: #242424;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--nero);
            color: var(--bianco);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            padding: 28px 38px;
            border-bottom: 1px solid var(--linea);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1.5px;
        }

        .back {
            font-size: 12px;
            font-weight: 800;
        }

        .back:hover {
            color: var(--arancio);
        }

        main {
            min-height: calc(100vh - 150px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 520px;
        }

        .eyebrow {
            color: var(--arancio);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(55px, 9vw, 100px);
            line-height: 0.85;
            letter-spacing: -5px;
            font-weight: 900;
            margin-bottom: 30px;
        }

        h1 span {
            color: var(--arancio);
        }

        .intro {
            color: #999;
            font-size: 14px;
            line-height: 1.7;
            max-width: 470px;
            margin-bottom: 45px;
        }

        .form-section {
            border-top: 1px solid var(--linea);
            padding-top: 30px;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #888;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            background: transparent;
            border: 1px solid var(--linea);
            color: var(--bianco);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.25s ease;
        }

        input:focus {
            border-color: var(--arancio);
        }

        input::placeholder {
            color: #555;
        }

        .submit-button {
            width: 100%;
            height: 58px;
            margin-top: 12px;
            border: 1px solid var(--arancio);
            background: var(--arancio);
            color: var(--nero);
            font-family: inherit;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .submit-button:hover {
            background: transparent;
            color: var(--arancio);
        }

        .submit-button span {
            font-size: 20px;
        }

        .register-link {
            border-top: 1px solid var(--linea);
            margin-top: 35px;
            padding-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .register-link span {
            color: #777;
            font-size: 11px;
        }

        .register-link a {
            color: var(--bianco);
            font-size: 11px;
            font-weight: 800;
        }

        .register-link a:hover {
            color: var(--arancio);
        }

        footer {
            border-top: 1px solid var(--linea);
            padding: 22px 38px;
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 10px;
            font-weight: 700;
        }

        @media (max-width: 700px) {

            header {
                padding: 22px 20px;
            }

            .brand {
                font-size: 20px;
            }

            main {
                padding: 60px 20px;
                align-items: flex-start;
            }

            .login-wrapper {
                padding-top: 20px;
            }

            h1 {
                font-size: clamp(52px, 17vw, 85px);
                letter-spacing: -4px;
            }

            .intro {
                font-size: 13px;
            }

            footer {
                padding: 20px;
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <header>

        <a href="index.html" class="brand">
            FUORISCHEMA
        </a>

        <a href="community.html" class="back">
            ← COMMUNITY
        </a>

    </header>


    <main>

        <div class="login-wrapper">

            <div class="eyebrow">
                01 / MEMBER ACCESS
            </div>

            <h1>
                BENTORNATO<br>
                <span>FUORI.</span>
            </h1>

            <p class="intro">
                Accedi al tuo account FUORISCHEMA
                per entrare nella Community e condividere
                il tuo modo di vivere il brand.
            </p>


            <section class="form-section">

                <div class="field">

                    <label for="email">
                        EMAIL
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="La tua email"
                    >

                </div>


                <div class="field">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="La tua password"
                    >

                </div>


                <button id="loginBtn" class="submit-button" type="button">

                    ACCEDI

                    <span>→</span>

                </button>

            </section>


            <div class="register-link">

                <span>
                    NON HAI ANCORA UN ACCOUNT?
                </span>

                <a href="account.html">
                    REGISTRATI →
                </a>

            </div>

        </div>

    </main>


    <footer>

        <span>
            FUORISCHEMA © 2026
        </span>

        <span>
            MEMBER ACCESS
        </span>

    </footer>

<script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_URL, SUPABASE_KEY } from "./supabase.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginButton = document.querySelector(".submit-button");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    loginButton.addEventListener("click", async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
            alert("Inserisci email e password.");
            return;
        }

        loginButton.disabled = true;
        loginButton.style.opacity = "0.6";

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            alert("Accesso non riuscito: " + error.message);

            loginButton.disabled = false;
            loginButton.style.opacity = "1";
            return;
        }

        alert("ACCESSO RIUSCITO.");

        window.location.href = "community.html";
    });
</script>
</body>
</html>
